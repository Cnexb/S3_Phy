<!doctype html>
<html lang="en" translate="no">
  <head>
  <meta name="google" content="notranslate">
    <meta charset="utf-8" />
    <title>Uni+ HKDSE Physics Hub</title>
    <script>
      (function () {
        var path = location.pathname.replace(/\/$/, '');
        if (path.endsWith('/dist')) return;
        location.replace(location.origin + path + '/dist/' + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p><a id="gh-dist-link" href="#">Continue to Uni+ HKDSE Physics Hub</a></p>
    <script>
      (function () {
        var path = location.pathname.replace(/\/$/, '');
        var a = document.getElementById('gh-dist-link');
        if (a) a.href = location.origin + path + '/dist/';
      })();
    </script>
  </body>
</html>
