html, body { margin: 0; padding: 0; background: #f8f9fa; }
#app { padding: 8px; }

.lang-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  padding: 0;
  background: transparent;
  border: none;
  flex-shrink: 0;
}

.lang-btn {
  background: transparent;
  border: 1px solid #e8eaed;
  color: #6b7280;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

.lang-btn:hover {
  border-color: #cbd5e1;
  color: #1a1c2c;
}

.lang-btn.active {
  background: #2563eb;
  border-color: #2563eb;
  color: #ffffff;
}

html.s3phy-embed .lang-bar {
  display: none !important;
}

html.s3phy-embed,
html.s3phy-embed body {
  height: auto !important;
  min-height: 100% !important;
  overflow-y: auto !important;
  background: #f8f9fa;
}
html.s3phy-embed #app {
  padding: 4px;
  height: auto !important;
  min-height: 100% !important;
  box-sizing: border-box;
}

.reflab {
  --reflab-bg: #f8f9fa;
  --reflab-panel: #ffffff;
  --reflab-border: #e8eaed;
  --reflab-green: #16a34a;
  --reflab-cyan: #0891b2;
  --reflab-yellow: #ca8a04;
  --reflab-text: #1a1c2c;
  --reflab-muted: #6b7280;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--reflab-text);
  background: var(--reflab-bg);
  border-radius: 12px;
  padding: 12px;
  max-width: 100%;
  box-sizing: border-box;
}
.reflab * { box-sizing: border-box; }
.reflab-head {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  margin: 0 0 10px;
  min-height: 0;
}
.reflab-head-main {
  grid-column: 2;
  text-align: center;
}
.reflab-head .lang-bar {
  grid-column: 3;
  justify-self: end;
}
.reflab-title {
  margin: 0;
  font-weight: 800;
  font-size: 1.35rem;
  background: linear-gradient(90deg, #2563eb, #16a34a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.reflab-sub { color: var(--reflab-muted); font-size: 0.82rem; margin-top: 4px; }

html.s3phy-embed .reflab-head {
  grid-template-columns: 1fr;
}
html.s3phy-embed .reflab-head-main {
  grid-column: 1;
}
.reflab-dash {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  align-items: stretch;
}
.reflab-viz {
  position: relative;
  width: 100%;
  background: var(--reflab-panel);
  padding: 10px;
  border-radius: 16px;
  border: 1px solid var(--reflab-border);
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 2px 12px rgba(26, 28, 44, 0.04);
}

.reflab-mode-toggle {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 12;
  display: inline-flex;
  gap: 0;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid var(--reflab-border);
  border-radius: 999px;
  padding: 3px;
  box-shadow: 0 2px 10px rgba(26, 28, 44, 0.08);
}

.reflab-mode-btn {
  border: none;
  background: transparent;
  color: var(--reflab-muted);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
}
.reflab-mode-btn:hover { color: #1a1c2c; }
.reflab-mode-btn.active {
  background: #1a1c2c;
  color: #ffffff;
}

.reflab-mode-panel {
  display: contents;
}
.reflab-mode-panel[hidden] {
  display: none !important;
}

.reflab-canvas {
  background: #f8f9fa;
  border-radius: 12px;
  width: 100%;
  max-width: 100%;
  height: auto;
  display: block;
  border: 1px solid var(--reflab-border);
  touch-action: none;
  user-select: none;
}

/* —— Canvas HUD overlays —— */
.reflab-canvas-hud {
  position: absolute;
  z-index: 8;
  pointer-events: auto;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid var(--reflab-border);
  border-radius: 10px;
  padding: 8px 10px;
  box-shadow: 0 2px 10px rgba(26, 28, 44, 0.08);
  backdrop-filter: blur(4px);
}

.reflab-canvas-hud--incident {
  top: 14px;
  left: 14px;
  width: min(260px, 42%);
}

.reflab-canvas-hud--refracted {
  bottom: 58px;
  right: 14px;
  width: min(260px, 42%);
}

.reflab-canvas-hud--layerX {
  /* Top band (X) — left */
  top: max(48px, 6%);
  left: 14px;
  width: min(220px, 34%);
}

.reflab-canvas-hud--layerY {
  /* Middle band (Y) — left */
  top: 38%;
  left: 14px;
  right: auto;
  width: min(220px, 34%);
}

.reflab-canvas-hud--layerZ {
  /* Bottom band (Z) — right */

  function createT(lang = currentLang) {
    const map = STRINGS[lang === "en" ? "en" : "zh"] || STRINGS.zh;
    return (key) => map[key] ?? key;
  }

  // labs/refraction/js/boot.js
  var root = document.getElementById("app");
  function updateLangButtons(activeLang) {
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      const lang = btn.getAttribute("data-set-lang");
      btn.classList.toggle("active", lang === activeLang);
    });
  }
  function mount() {
    if (!root) return;
    root.replaceChildren();
    const current = getLang();
    initRefractionLab(root, createT(current));
    updateLangButtons(current);
  }
  function applyLang(lang) {
    setLang(lang);
    mount();
  }
  initLangFromUrl();
  applyLang(getLang());
  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".lang-btn");
    if (!btn || !btn.hasAttribute("data-set-lang")) return;
    const lang = btn.getAttribute("data-set-lang");
    if (lang) applyLang(lang);
  });
  window.addEventListener("message", (ev) => {
    if (ev.data?.type !== "s3phy:lang") return;
    const next = hubLangToLocal(ev.data.lang);
    if (next === getLang()) return;
    applyLang(next);
  });
})();
