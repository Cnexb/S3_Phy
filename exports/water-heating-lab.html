<!DOCTYPE html>
<html lang="zh-HK" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>煲水實驗 — Water Heating Lab</title>
  <style>
/* S3_Phy embed mode — shared chrome for iframe labs inside Hub */

html.s3phy-embed {
  font-family: var(--s3-font);
  font-size: var(--s3-font-size-base);
  line-height: var(--s3-line-height);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}

html.s3phy-embed:has(.lab-section) {
  height: 100%;
}

html.s3phy-embed body {
  font-family: var(--s3-font);
  font-size: max(var(--s3-font-min), 1rem);
  line-height: var(--s3-line-height);
  margin: 0;
}

/* Interactive lab iframe — flex fill (not quiz/worksheet) */
html.s3phy-embed body:has(.lab-section),
html.s3phy-embed body.embed-mode:has(.sim-main-col),
html.s3phy-embed body:has(.sim-main-col):not(:has(#quiz-layout)) {
  height: 100%;
  min-height: 0 !important;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

html.s3phy-embed body:has(.lab-section) > main,
html.s3phy-embed body.embed-mode main.flex-grow,
html.s3phy-embed body:has(.sim-main-col):not(:has(#quiz-layout)) > main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  width: 100%;
  overflow: hidden;
}

/* Quiz / worksheet iframe — preserve two-column grid */
html.s3phy-embed body:has(#quiz-layout) {
  height: auto;
  min-height: 100%;
  display: block;
  overflow: auto;
}

html.s3phy-embed #quiz-layout {
  display: grid !important;
  grid-template-columns: 1fr;
  gap: 1.5rem;
  max-width: none !important;
  width: 100%;
  margin: 0;
  align-items: start;
  box-sizing: border-box;
}

@media (min-width: 1101px) {
  html.s3phy-embed #quiz-layout {
    grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  }
}

@media (max-width: 1100px) {
  html.s3phy-embed #quiz-layout > aside#settings-panel {
    position: static;
    max-height: min(42dvh, 420px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
}

html.s3phy-embed #quiz-layout > aside#settings-panel {
  position: sticky;
  top: 0.5rem;
  align-self: start;
  max-height: calc(100dvh - 1rem);
  overflow-y: auto;
}

html.s3phy-embed #quiz-layout > .min-w-0 {
  min-width: 0;
  width: 100%;
}

html.s3phy-embed .lab-section {
  flex: 1 1 auto;
  min-height: 0 !important;
  height: 100%;
  align-content: stretch;
  align-items: stretch;
}

html.s3phy-embed .lab-viz,
html.s3phy-embed .lab-steps {
  height: 100% !important;
  min-height: 0;
  max-height: none !important;
}

html.s3phy-embed .lab-viz {
  display: flex;
  flex-direction: column;
}

html.s3phy-embed .lab-viz-canvas {
  flex: 1 1 auto;
  min-height: 200px;
  max-height: none !important;
}

html.s3phy-embed .lab-steps {
  overflow-y: auto;
}

html.s3phy-embed .lab-viz.lab-viz-dual {
  display: grid !important;
  height: 100% !important;
}

html.s3phy-embed .lab-viz-dual {
  max-height: none !important;
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
  align-content: stretch;
  overflow: hidden;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel-chart {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel:first-child .lab-viz-canvas {
  flex: 1 1 auto !important;
  min-height: 120px !important;
  max-height: none !important;
  aspect-ratio: unset;
  height: auto;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel-chart .lab-viz-chart-wrap {
  flex: 1 1 auto;
  min-height: 0;
  height: auto !important;
  margin-top: 0;
  aspect-ratio: unset;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

html.s3phy-embed header,
html.s3phy-embed footer {
  flex-shrink: 0;
}

html.s3phy-embed .max-w-7xl {
  max-width: none;
  width: 100%;
}

html.s3phy-embed .sim-main-col,
html.s3phy-embed .glass-panel.flex-grow {
  flex: 1 1 auto;
  min-height: 0;
}

html.s3phy-embed .canvas-container {
  flex: 1 1 auto;
  min-height: 0 !important;
  height: auto !important;
  max-height: none;
}

html.s3phy-embed .main-container,
html.s3phy-embed .lab-wrap,
html.s3phy-embed .dashboard,
html.s3phy-embed .app-root {
  max-width: none;
  width: 100%;
  margin: 0;
}

/* Floating controls panel (heat labs + shared script) */
.lab-section {
  position: relative;
  min-height: 0;
}

@media (min-width: 768px) {
  /* Keep grid items as 2 parallel columns at >= 768px */
  html.s3phy-embed .lab-section,
  html.s3phy-embed .main-grid {
    grid-template-columns: repeat(12, minmax(0, 1fr)) !important;
  }
  html.s3phy-embed .lab-section.controls-floating .lab-viz,
  html.s3phy-embed .main-grid .sim-main-col {
    grid-column: span 6 / span 6 !important;
  }
  html.s3phy-embed .lab-section.controls-floating .lab-steps,
  html.s3phy-embed .main-grid .tab-sidebar-col {
    grid-column: span 6 / span 6 !important;
  }
  /* Specially for heat transfer conduction / convection / radiation simulation */
  html.s3phy-embed .main-grid > div:first-of-type {
    grid-column: span 6 / span 6 !important;
  }
  html.s3phy-embed .main-grid > div:last-of-type {
    grid-column: span 6 / span 6 !important;
  }

  html.s3phy-embed .lab-controls.lab-controls-float,
  html.s3phy-embed .control-panel {
    position: absolute !important;
    z-index: 50 !important;
    width: var(--s3-float-panel-w) !important;
    max-width: var(--s3-float-panel-w) !important;
  }
}

@media (max-width: 767px) {
  html.s3phy-embed .lab-section.controls-floating .lab-viz,
  html.s3phy-embed .lab-section.controls-floating .lab-steps {
    grid-column: 1 / -1;
  }

  html.s3phy-embed .lab-controls.lab-controls-float {
    position: relative;
    left: auto !important;
    top: auto !important;
    width: 100% !important;
    max-width: none;
    margin-bottom: 0.75rem;
  }
}

.lab-controls.lab-controls-float {
  position: absolute;
  z-index: 40;
  width: var(--s3-float-panel-w);
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
}

.lab-controls-body {
  transition: max-height 0.25s ease, opacity 0.2s ease;
}

.lab-controls-desc {
  transition: max-height 0.25s ease, opacity 0.2s ease;
}

.lab-controls.controls-collapsed .lab-controls-body,
.lab-controls.controls-collapsed .lab-controls-desc {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  pointer-events: none;
  margin: 0;
  padding-top: 0;
  padding-bottom: 0;
}

.lab-controls:not(.controls-collapsed) .lab-controls-body {
  max-height: min(70vh, 520px);
  opacity: 1;
  overflow-y: auto;
}

.lab-controls:not(.controls-collapsed) .lab-controls-desc {
  opacity: 1;
  max-height: 4rem;
}

.lab-controls.controls-collapsed .lab-controls-title-text {
  display: none;
}

.lab-controls-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.lab-controls-actions {
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 0.5rem;
  width: 100%;
}

.lab-controls-actions button {
  padding: 0.625rem 0.75rem;
  justify-content: center;
}

.lab-controls-actions button:not(.flex-1) {
  flex-shrink: 0;
}

.lab-controls-actions button.flex-1 {
  white-space: nowrap;
  min-width: max-content;
}

.lab-controls-drag-handle {
  display: none;
  cursor: grab;
  touch-action: none;
  color: #94a3b8;
  padding: 0.25rem;
  border-radius: 0.375rem;
  flex-shrink: 0;
  background: none;
  border: none;
}

@media (min-width: 900px) {
  .lab-controls.lab-controls-float .lab-controls-drag-handle {
    display: flex;
    align-items: center;
    justify-content: center;
  }
}

.lab-controls-drag-handle:active {
  cursor: grabbing;
}

/* Hub iframe — standalone labs (rotating-mirror, rgb, thermometer) */
html.s3phy-embed:has(#app > .rml),
html.s3phy-embed:has(#app > .rgb-mixer),
html.s3phy-embed:has(#app > .tl-wrap) {
  height: 100%;
}

html.s3phy-embed body:has(#app > .rml),
html.s3phy-embed body:has(#app > .rgb-mixer),
html.s3phy-embed body:has(#app > .tl-wrap) {
  height: 100%;
  min-height: 0 !important;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

html.s3phy-embed body:has(#app > .rml) #app,
html.s3phy-embed body:has(#app > .rgb-mixer) #app,
html.s3phy-embed body:has(#app > .tl-wrap) #app {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

html.s3phy-embed .rml,
html.s3phy-embed .rgb-mixer,
html.s3phy-embed .tl-wrap {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

html.s3phy-embed .rml .rml-head,
html.s3phy-embed .tl-wrap .tl-head {
  display: none;
}

html.s3phy-embed .rml {
  display: flex;
  flex-direction: column;
}

html.s3phy-embed .rml .rml-dash {
  flex: 1 1 auto;
  min-height: 0;
  align-items: stretch;
  flex-wrap: nowrap;
  max-width: none;
  width: 100%;
  margin: 0;
}

html.s3phy-embed .rml .rml-viz {
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  display: flex;
  align-items: stretch;
}

html.s3phy-embed .rml .rml-canvas {
  width: 100%;
  height: 100%;
  max-width: none;
  flex: 1;
  object-fit: contain;
}

html.s3phy-embed .rml .rml-controls {
  flex: 0 0 auto;
  max-height: 100%;
  overflow-y: auto;
}

html.s3phy-embed .tl-wrap {
  display: flex;
  flex-direction: column;
}

html.s3phy-embed .tl-wrap .tl-dash,
html.s3phy-embed .tl-wrap .tl-dash--faulty {
  flex: 1 1 auto;
  min-height: 0 !important;
  height: 100%;
}

html.s3phy-embed .tl-wrap--faulty-cal .tl-faulty-hero {
  flex: 1 1 auto;
  min-height: 0 !important;
}

html.s3phy-embed .tl-wrap--faulty-cal .tl-faulty-hero-viz {
  flex: 1 1 auto;
  min-height: 0;
}

html.s3phy-embed .tl-wrap--faulty-cal .tl-dash--faulty {
  display: grid;
  grid-template-columns: 1fr minmax(260px, 360px);
  grid-template-rows: 1fr;
  align-items: stretch;
  gap: 14px;
}

html.s3phy-embed .tl-wrap--faulty-cal .tl-faulty-hero {
  grid-column: 1;
  grid-row: 1;
}

html.s3phy-embed .tl-wrap--faulty-cal .tl-faulty-live {
  grid-column: 2;
  grid-row: 1;
  overflow-y: auto;
  min-height: 0;
}

html.s3phy-embed .tl-wrap--faulty-cal .tl-controls {
  grid-column: 1 / -1;
}

html.s3phy-embed .rgb-mixer {
  display: flex;
  flex-direction: column;
}

html.s3phy-embed .rgb-mixer-body {
  flex: 1 1 auto;
  min-height: 0 !important;
  height: auto;
  max-height: none;
  align-items: stretch;
}

html.s3phy-embed .rgb-mixer-stage {
  min-height: 0 !important;
  height: 100%;
}

html.s3phy-embed .rgb-mixer-canvas {
  width: 100%;
  height: 100%;
}

html.s3phy-embed .rgb-mixer-controls {
  overflow-y: auto;
  max-height: 100%;
}

/* Lens simulator embed compact chrome */
html.s3phy-embed .controls-panel,
html.s3phy-embed .control-panel {
  width: var(--s3-float-panel-w) !important;
  max-width: var(--s3-float-panel-w) !important;
}

/* Minimum readable text in embed controls */
html.s3phy-embed label,
html.s3phy-embed .control label,
html.s3phy-embed button,
html.s3phy-embed input,
html.s3phy-embed select {
  font-size: max(var(--s3-font-min), 0.875rem);
}

/* Height adaptive scaling for compact/low-height viewports (height < 720px) */
@media (max-height: 720px) {
  html.s3phy-embed {
    --s3-font-size-base: 13.5px !important;
  }
  html.s3phy-embed body {
    font-size: max(var(--s3-font-min, 11px), 0.85rem) !important;
  }
  
  /* Compact paddings and gaps */
  html.s3phy-embed .p-5,
  html.s3phy-embed .p-4,
  html.s3phy-embed .p-3.5,
  html.s3phy-embed .p-3 {
    padding: 0.5rem 0.625rem !important;
  }
  html.s3phy-embed .px-4,
  html.s3phy-embed .px-5 {
    padding-left: 0.625rem !important;
    padding-right: 0.625rem !important;
  }
  html.s3phy-embed .py-4,
  html.s3phy-embed .py-5,
  html.s3phy-embed .py-6 {
    padding-top: 0.5rem !important;
    padding-bottom: 0.5rem !important;
  }
  html.s3phy-embed .gap-6,
  html.s3phy-embed .gap-5,
  html.s3phy-embed .gap-4,
  html.s3phy-embed .gap-3 {
    gap: 0.375rem !important;
  }
  html.s3phy-embed .space-y-4 > :not([hidden]) ~ :not([hidden]) {
    margin-top: 0.375rem !important;
  }
  html.s3phy-embed .space-y-3 > :not([hidden]) ~ :not([hidden]) {
    margin-top: 0.25rem !important;
  }

  /* Compact header & tabs */
  html.s3phy-embed header {
    padding-top: 0.25rem !important;
    padding-bottom: 0.25rem !important;
    margin-bottom: 0.25rem !important;
  }
  html.s3phy-embed header h1 {
    font-size: 1.1rem !important;
  }
  
  /* KaTeX mathematical formulas scaling and tight margins */
  html.s3phy-embed .lab-steps .katex {
    font-size: 0.95em !important;
  }
  html.s3phy-embed .lab-steps .katex-display {
    margin: 0.25em 0 !important;
  }
  
  /* Shrink canvas and containers to prevent overflow */
  html.s3phy-embed .lab-viz-canvas {
    min-height: 120px !important;
    flex: 1 1 auto !important;
  }
  
  /* Compact parameters/controls — keep panel wide enough for action buttons */
  html.s3phy-embed .lab-controls.lab-controls-float,
  html.s3phy-embed .control-panel {
    width: var(--s3-float-panel-w) !important;
    max-width: var(--s3-float-panel-w) !important;
    padding: 0.5rem !important;
  }
  html.s3phy-embed .lab-controls-body {
    gap: 0.375rem !important;
  }
  html.s3phy-embed .lab-controls-body select,
  html.s3phy-embed .lab-controls-body input,
  html.s3phy-embed .lab-controls-body button {
    padding-top: 0.375rem !important;
    padding-bottom: 0.375rem !important;
    font-size: 0.75rem !important;
  }
}

@media (max-height: 600px) {
  html.s3phy-embed {
    --s3-font-size-base: 12px !important;
  }
  html.s3phy-embed body {
    font-size: max(var(--s3-font-min, 10px), 0.75rem) !important;
  }
  html.s3phy-embed .lab-viz-canvas {
    min-height: 100px !important;
  }
  html.s3phy-embed .p-5,
  html.s3phy-embed .p-4,
  html.s3phy-embed .p-3.5,
  html.s3phy-embed .p-3 {
    padding: 0.375rem 0.5rem !important;
  }
  html.s3phy-embed .gap-6,
  html.s3phy-embed .gap-5,
  html.s3phy-embed .gap-4,
  html.s3phy-embed .gap-3 {
    gap: 0.25rem !important;
  }
}


html,
body {
  margin: 0;
  min-height: 100%;
  background: #ffffff;
}

#app {
  padding: 8px;
}

html.s3phy-embed,
html.s3phy-embed body {
  height: 100%;
  overflow: hidden;
}

html.s3phy-embed #app {
  height: 100%;
  min-height: 0;
  padding: 4px;
  box-sizing: border-box;
}

html:fullscreen,
html:fullscreen body,
html:fullscreen #app {
  width: 100%;
  height: 100%;
  overflow: auto;
}

html:fullscreen #app { padding: 0; }
html:fullscreen .bw-wrap {
  width: 100%;
  max-width: none;
  min-height: 100%;
  border-radius: 0;
}

.bw-wrap {
  --bw-bg: #ffffff;
  --bw-panel: #f8f9fa;
  --bw-border: #e4e4e7;
  --bw-green: #10b981;
  --bw-cyan: #0891b2;
  --bw-yellow: #d97706;
  --bw-red: #ef4444;
  --bw-text: #1f2937;
  --bw-muted: #6b7280;
  --bw-primary: #6366f1;
  --bw-primary-hover: #4f46e5;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--bw-text);
  background: var(--bw-bg);
  border-radius: 16px;
  padding: 14px;
  max-width: 1500px;
  min-height: calc(100vh - 16px);
  margin: 0 auto;
  box-sizing: border-box;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  display: flex;
  flex-direction: column;
}

.bw-wrap * {
  box-sizing: border-box;
}

.bw-head {
  position: relative;
  text-align: center;
  margin-bottom: 12px;
  padding-inline: 220px;
  flex: 0 0 auto;
}

.bw-title {
  margin: 0;
  font-weight: 850;
  font-size: clamp(1.55rem, 2.7vw, 2.35rem);
  line-height: 1.1;
  background: linear-gradient(135deg, #0891b2, #6366f1, #10b981);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.025em;
}

.bw-subtitle {
  color: var(--bw-muted);
  font-size: clamp(0.82rem, 1.25vw, 1.05rem);
  margin: 5px 0 0;
  font-weight: 600;
}

.bw-head-actions {
  position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  display: flex;
  gap: 7px;
}

.bw-head-btn {
  border: 1px solid #cbd5e1;
  border-radius: 999px;
  padding: 7px 13px;
  background: #ffffff;
  color: #334155;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.bw-head-btn:hover {
  border-color: var(--bw-primary);
  color: var(--bw-primary);
  background: #eef2ff;
}

.bw-fullscreen-icon {
  font-size: 1.05rem;
  line-height: 1;
}

.bw-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  width: min(760px, 100%);
  margin: 0 auto 10px;
  padding: 4px;
  border: 1px solid var(--bw-border);
  border-radius: 12px;
  background: #f1f3f5;
  flex: 0 0 auto;
}

.bw-tab {
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 8px 12px;
  background: transparent;
  color: var(--bw-muted);
  font: inherit;
  font-size: clamp(0.78rem, 1.1vw, 0.92rem);
  font-weight: 800;
  cursor: pointer;
}

.bw-tab:hover {
  color: var(--bw-primary);
  background: rgba(255, 255, 255, 0.65);
}

.bw-tab.is-active {
  border-color: #c7d2fe;
  background: #ffffff;
  color: var(--bw-primary);
  box-shadow: 0 2px 7px rgba(99, 102, 241, 0.1);
}

.is-hidden {
  display: none !important;
}

.bw-dashboard {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 270px);
  grid-template-rows: minmax(360px, 1fr) auto;
  gap: 12px;
  flex: 1 1 auto;
  min-height: 0;
}

.bw-viz,
.bw-parallel-demo {
  grid-column: 1;
  grid-row: 1;
}

.bw-card {
  min-width: 0;
  background: var(--bw-panel);
  border: 1px solid var(--bw-border);
  border-radius: 16px;
}

.bw-viz {
  padding: 12px;
  display: grid;
  grid-template-columns: minmax(230px, 0.9fr) minmax(250px, 1.1fr);
  align-items: center;
  gap: 12px;
  overflow: hidden;
  background: linear-gradient(160deg, #ecfeff 0%, #f8f9fa 48%, #eef2ff 100%);
}

.bw-bottle-stage {
  position: relative;
  height: min(55vh, 540px);
  min-height: 330px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bw-bottle {
  position: relative;
  z-index: 3;
  width: min(220px, 75%);
  height: 82%;
  min-height: 280px;
  border: 5px solid #94a3b8;
  border-radius: 42px 42px 52px 52px;
  background: rgba(255, 255, 255, 0.56);
  box-shadow: inset 10px 0 20px rgba(255, 255, 255, 0.75), 0 16px 28px rgba(15, 23, 42, 0.1);
  overflow: visible;
}

.is-boiling .bw-bottle {

  text-shadow: 0 2px 5px rgba(15, 23, 42, 0.32);
}

.bw-sample-liquid {
  display: none;
}

.bw-medium-animation.is-water .bw-heating-sample {
  height: 74px;
  border-top-width: 2px;
  border-radius: 8px 8px 17px 17px;
  background: rgba(255, 255, 255, 0.55);
  overflow: hidden;
}

.bw-medium-animation.is-water .bw-sample-liquid {
  display: block;
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 3px;
  height: 67%;
  border-radius: 4px 4px 11px 11px;
  background: linear-gradient(180deg, #67e8f9, #0ea5e9);
}

.bw-medium-animation.is-water .bw-sample-liquid::before {
  content: "";
  position: absolute;
  left: -8%;
  top: -4px;
  width: 116%;
  height: 9px;
  border-radius: 50%;
  background: #cffafe;
  animation: bw-mini-wave calc(1.5s - 0.7s * var(--sample-heat)) ease-in-out infinite;
}

.bw-sample-heat-waves {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 78px;
  width: 120px;
  height: 44px;
  transform: translateX(-50%);
  opacity: calc(0.14 + var(--sample-heat) * 0.86);
}

.bw-sample-heat-waves i {
  position: absolute;
  bottom: 0;
  width: 8px;
  height: calc(22px + 18px * var(--sample-heat));
  border-left: 5px solid rgba(249, 115, 22, 0.62);
  border-radius: 50%;
  animation: bw-mini-heat 0.85s ease-in-out infinite;
}

.bw-sample-heat-waves i:nth-child(1) { left: 25%; animation-delay: -0.2s; }
.bw-sample-heat-waves i:nth-child(2) { left: 50%; animation-delay: -0.55s; }
.bw-sample-heat-waves i:nth-child(3) { left: 75%; animation-delay: -0.36s; }

.bw-mini-hotplate {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: 12px;
  width: 128px;
  height: 20px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #334155;
  box-shadow: 0 5px 0 #0f172a, 0 7px 12px rgba(15, 23, 42, 0.22);
}

.bw-mini-hotplate span {
  position: absolute;
  inset: 5px 15px;
  border-radius: 50%;
  background: color-mix(in srgb, #ef4444 calc(20% + var(--sample-heat) * 80%), #64748b);
  box-shadow: 0 0 calc(3px + 15px * var(--sample-heat)) rgba(239, 68, 68, 0.8);
}

.bw-heat-energy {
  padding: 11px 13px;
  border: 1px solid #fed7aa;
  border-radius: 14px;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.bw-heat-energy > span {
  color: var(--bw-muted);
  font-size: 0.78rem;
  font-weight: 850;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.bw-heat-energy strong {
  color: #ea580c;
  font-family: ui-monospace, "Cascadia Code", monospace;
  font-size: clamp(1.8rem, 3.4vw, 3rem);
  line-height: 1.05;
}

.bw-heat-energy small {
  color: var(--bw-green);
  font-weight: 800;
}

.bw-heat-energy small.is-high {
  color: var(--bw-yellow);
}

.bw-property-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.bw-property-grid > div {
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--bw-border);
  border-radius: 11px;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.bw-property-grid span {
  color: var(--bw-muted);
  font-size: 0.7rem;
  font-weight: 750;
}

.bw-property-grid strong {
  overflow-wrap: anywhere;
  color: #334155;
  font-size: clamp(0.75rem, 1vw, 0.9rem);
}

.bw-formula-card {
  grid-column: 1 / -1;
  padding: 12px 16px;
  display: grid;
  grid-template-columns: minmax(270px, 0.75fr) minmax(420px, 1.25fr);
  align-items: center;
  gap: 14px;
}

.bw-formula-heading {
  margin: 0 0 3px;
  color: var(--bw-muted);
  font-size: 0.78rem;
  font-weight: 850;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.bw-formula-main {
  color: var(--bw-primary);
  font-family: ui-monospace, "Cascadia Code", monospace;
  font-size: clamp(1.65rem, 3vw, 3rem);
  font-weight: 850;
  line-height: 1.1;
}

.bw-worked {
  padding: 11px 14px;
  background: #ffffff;
  border: 1px solid var(--bw-border);
  border-radius: 12px;
  font-family: ui-monospace, "Cascadia Code", monospace;
  font-size: clamp(1rem, 1.9vw, 1.65rem);
  font-weight: 800;
  text-align: center;
  color: #334155;
}

.bw-worked strong {
  color: var(--bw-cyan);
}

@keyframes bw-wave {
  0%, 100% { transform: translateX(-2%) rotate(-1deg); }
  50% { transform: translateX(2%) rotate(1deg); }
}

@keyframes bw-water-flow {
  from { background-position: 50% 0%; }
  to { background-position: 50% 100%; }
}

@keyframes bw-convection-rise {
  0%, 100% { transform: translateY(16px) skewX(-8deg); opacity: 0.18; }
  50% { transform: translateY(-22px) skewX(10deg); opacity: 0.8; }
}

@keyframes bw-bubble-rise {
  0% { transform: translate(0, 10px) scale(0.55); opacity: 0; }
  14% { opacity: 0.88; }
  70% { opacity: 0.72; }
  100% { transform: translate(9px, -190px) scale(1.12); opacity: 0; }
}

@keyframes bw-steam-rise {
  0% { transform: translateY(18px) scale(0.7); opacity: 0; }
  25% { opacity: 0.65; }
  100% { transform: translateY(-35px) translateX(10px) scale(1.25); opacity: 0; }
}

@keyframes bw-heat-ray {
  0%, 100% { transform: translateY(10px) skewX(-9deg); opacity: 0.28; }
  50% { transform: translateY(-18px) skewX(10deg); opacity: 0.88; }
}

@keyframes bw-bar-grow {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

@keyframes bw-sample-warm {
  from { filter: saturate(1) brightness(1); }
  to { filter: saturate(calc(1 + var(--sample-heat) * 0.4)) brightness(calc(1 + var(--sample-heat) * 0.08)); }
}

@keyframes bw-mini-wave {
  0%, 100% { transform: translateX(-3%) rotate(-2deg); }
  50% { transform: translateX(3%) rotate(2deg); }
}

@keyframes bw-mini-heat {
  0%, 100% { transform: translateY(5px) skewX(-9deg); opacity: 0.25; }
  50% { transform: translateY(-10px) skewX(10deg); opacity: 0.9; }
}

@keyframes bw-water-pulse {
  from { filter: saturate(1); }
  to { filter: saturate(1.28) brightness(1.05); }
}

@keyframes bw-flame {
  from { transform: rotate(42deg) scaleX(0.9) scaleY(0.88); }
  to { transform: rotate(48deg) translateY(-5px) scaleX(1.08) scaleY(1.14); }
}

@keyframes bw-bottle-boil {
  from { transform: translateX(-1px) rotate(-0.18deg); }
  to { transform: translateX(1px) rotate(0.18deg); }
}

@keyframes bw-splash {
  0% { transform: translate(0, 8px) scale(0.5); opacity: 0; }
  18% { opacity: 0.9; }
  100% { transform: translate(var(--splash-x), -66px) rotate(120deg) scale(1); opacity: 0; }
}

      mediumGlass: "\u73BB\u7483",
      energyDemandLow: "\u6240\u9700\u80FD\u91CF\u8F03\u4F4E",
      energyDemandHigh: "\u6240\u9700\u80FD\u91CF\u8F03\u9AD8"
    }
  };
  var root = document.getElementById("app");
  var lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";
  var power = 0;
  var duration = 0;
  var elapsed = 0;
  var running = false;
  var animationFrame = 0;
  var lastFrame = 0;
  var activeTab = "powerTime";
  var controlsCollapsed = sessionStorage.getItem("s3phy-boiling-water-controls-collapsed") === "true";
  var mass = 1;
  var inputEnergyJ = 2e4;
  var shcProgress = 0;
  var shcRunning = false;
  var shcAnimationFrame = 0;
  var shcLastFrame = 0;
  function t(key) {
    return STRINGS[lang][key] ?? key;
  }
  function formatEnergy(joules) {
    if (joules >= 1e3) {
      const digits = joules >= 1e5 ? 0 : 1;
      return `${(joules / 1e3).toFixed(digits)} ${t("kilojoules")}`;
    }
    return `${Math.round(joules)} ${t("joules")}`;
  }
  function renderMaterialCard(key, label) {
    const material = MEDIA[key];
    return `
    <article class="bw-material-card" data-material-card="${key}" style="--card-color:${material.color}">
      <div class="bw-material-card-head">
        <strong>${label}</strong>
        <small>${t("specificHeat")}</small>
        <span><b>c = ${material.c}</b><em>J kg\u207B\xB9 \xB0C\u207B\xB9</em></span>
      </div>
      <div class="bw-parallel-stage">
        <div class="bw-parallel-heat" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="bw-demo-sample ${material.kind === "water" ? "is-water" : ""}">
          <div class="bw-demo-liquid"></div>
          <b>${material.symbol}</b>
        </div>
        <div class="bw-demo-heater"></div>
        <div class="bw-demo-thermometer">
          <div class="bw-demo-thermometer-fill" data-material-temp-fill="${key}"></div>
        </div>
      </div>
      <div class="bw-material-rise">\u0394T = <strong data-material-rise="${key}">0.0\xB0C</strong></div>
    </article>`;
  }
  function render() {
    if (!root) return;
    document.documentElement.lang = lang === "zh" ? "zh-HK" : "en";
    root.innerHTML = `
    <main class="bw-wrap">
      <header class="bw-head">
        <h1 class="bw-title">${t("title")}</h1>
        <p class="bw-subtitle">${t("subtitle")}</p>
        <div class="bw-head-actions">
          <button class="bw-head-btn" type="button" data-fullscreen aria-pressed="false">
            <span class="bw-fullscreen-icon" aria-hidden="true">\u26F6</span>
            <span data-fullscreen-label>${t("fullscreen")}</span>
          </button>
          <button class="bw-head-btn" type="button" data-language>${t("switchLanguage")}</button>
        </div>
      </header>

      <nav class="bw-tabs" aria-label="Energy labs">
        <button class="bw-tab ${activeTab === "powerTime" ? "is-active" : ""}" type="button" data-tab="powerTime">
          ${t("tabPowerTime")}
        </button>
        <button class="bw-tab ${activeTab === "heatCapacity" ? "is-active" : ""}" type="button" data-tab="heatCapacity">
          ${t("tabHeatCapacity")}
        </button>
      </nav>

      <section class="bw-dashboard ${controlsCollapsed ? "controls-collapsed" : ""} ${activeTab === "powerTime" ? "" : "is-hidden"}" data-panel="powerTime">
        <div class="bw-card bw-viz">
          <button class="bw-controls-toggle bw-controls-toggle--overlay" type="button" data-toggle-controls aria-expanded="${String(!controlsCollapsed)}">
            <span aria-hidden="true">\u2699</span>
            <strong>${controlsCollapsed ? t("showControls") : t("hideControls")}</strong>
          </button>
          <div class="bw-bottle-stage" data-stage>
            <div class="bw-bottle" data-bottle>
              <div class="bw-steam" aria-hidden="true"><span></span><span></span><span></span></div>
              <div class="bw-splash" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
              <div class="bw-water-clip">
                <div class="bw-water" data-water>
                  <div class="bw-convection" aria-hidden="true"><span></span><span></span><span></span></div>
                  <div class="bw-bubbles" aria-hidden="true">
                    ${Array.from({ length: 18 }, () => "<span></span>").join("")}
                  </div>
                </div>
              </div>
            </div>
            <div class="bw-fire" data-fire aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="bw-heater" aria-hidden="true">
              <span class="bw-heater-label">${t("heater")}</span>
            </div>
            <div class="bw-power-hero bw-heater-power-callout">
              <span>${t("powerLevel")}</span>
              <strong data-power-hero>${power} ${t("watts")}</strong>
            </div>
          </div>

          <div class="bw-viz-info">
            <div class="bw-status-row">
              <div class="bw-status" data-status data-state="ready">
                <span class="bw-status-dot"></span>
                <span data-status-label>${t("statusReady")}</span>
              </div>
            </div>
            <div class="bw-energy-meter">
              <div class="bw-meter-label">
                <span>${t("energyProgress")}</span>
                <span class="bw-meter-reading">
                  <strong data-live-energy>0 ${t("kilojoules")}</strong>
                  <i>/</i>
                  <span>${formatEnergy(ENERGY_METER_MAX_J)}</span>
                </span>
              </div>
              <div class="bw-meter-track" role="progressbar" aria-valuemin="0" aria-valuemax="${ENERGY_METER_MAX_J / 1e3}" aria-valuenow="0" data-progress>
                <div class="bw-meter-fill" data-progress-fill></div>
                <span class="bw-meter-target-marker" style="--target-position:${BOILING_THRESHOLD_J / ENERGY_METER_MAX_J * 100}%">
                  <span>${formatEnergy(BOILING_THRESHOLD_J)} ${t("boilingTarget")}</span>
                </span>
              </div>
              <div class="bw-meter-scale">
                <span>0 ${t("kilojoules")}</span>
                <strong><span>${t("energyRemaining")}</span> <b data-energy-remaining>${formatEnergy(BOILING_THRESHOLD_J)}</b></strong>
                <span>${formatEnergy(ENERGY_METER_MAX_J)}</span>
              </div>
            </div>
          </div>
        </div>

        <aside class="bw-card bw-controls ${controlsCollapsed ? "is-collapsed" : ""}">
          <h2 class="bw-card-title">${t("controls")}</h2>
          <div class="bw-control-group">
            <label class="bw-control-label" for="power">
              <span>${t("power")}</span>
              <output class="bw-badge" data-power-output>${power} ${t("watts")}</output>
            </label>
            <div class="bw-slider-row">
              <button class="bw-step-btn" type="button" data-step="power" data-delta="-100" aria-label="-100 W">\u2212</button>
              <input id="power" data-power type="range" min="0" max="3000" step="100" value="${power}">
              <button class="bw-step-btn" type="button" data-step="power" data-delta="100" aria-label="+100 W">+</button>
            </div>
          </div>
          <div class="bw-control-group">
            <label class="bw-control-label" for="duration">
              <span>${t("time")}</span>
              <output class="bw-badge" data-duration-output>${duration} ${t("seconds")}</output>
            </label>
            <div class="bw-slider-row">
              <button class="bw-step-btn" type="button" data-step="duration" data-delta="-10" aria-label="-10 s">\u2212</button>
              <input id="duration" data-duration type="range" min="0" max="300" step="10" value="${duration}">
              <button class="bw-step-btn" type="button" data-step="duration" data-delta="10" aria-label="+10 s">+</button>
            </div>
          </div>

          <div class="bw-prediction">
            <span class="bw-prediction-label">${t("predictedEnergy")}</span>
            <strong class="bw-prediction-value" data-predicted-energy></strong>
            <div class="bw-prediction-result" data-prediction-result></div>
          </div>

          <div class="bw-preset-grid">
            <button class="bw-btn bw-preset bw-no-boil-preset" type="button" data-no-boil-preset>${t("setNoBoil")}</button>
            <button class="bw-btn bw-preset bw-boil-preset" type="button" data-boil-preset>${t("setJustEnough")}</button>
          </div>
          <div class="bw-actions">
            <button class="bw-btn primary" type="button" data-start>${t("start")}</button>
            <button class="bw-btn" type="button" data-reset>${t("reset")}</button>
          </div>
        </aside>

      </section>

      <section class="bw-dashboard bw-heat-dashboard ${controlsCollapsed ? "controls-collapsed" : ""} ${activeTab === "heatCapacity" ? "" : "is-hidden"}" data-panel="heatCapacity">
        <div class="bw-card bw-parallel-demo">
          <button class="bw-controls-toggle bw-controls-toggle--overlay" type="button" data-toggle-controls aria-expanded="${String(!controlsCollapsed)}">
            <span aria-hidden="true">\u2699</span>
            <strong>${controlsCollapsed ? t("showControls") : t("hideControls")}</strong>
          </button>
          <div class="bw-parallel-heading">
            <span>${t("commonConditions")}</span>
            <strong>${t("coreRelationship")}</strong>
          </div>
          <div class="bw-material-grid">
            ${renderMaterialCard("water", t("mediumWater"))}
            ${renderMaterialCard("aluminium", t("mediumAluminium"))}
            ${renderMaterialCard("glass", t("mediumGlass"))}
            ${renderMaterialCard("copper", t("mediumCopper"))}
          </div>
        </div>

        <aside class="bw-card bw-controls bw-heat-controls ${controlsCollapsed ? "is-collapsed" : ""}">
          <h2 class="bw-card-title">${t("heatCapacityControls")}</h2>
          <div class="bw-control-group">
            <label class="bw-control-label" for="mass">
              <span>${t("mass")}</span>
              <output class="bw-badge" data-mass-output>${mass.toFixed(1)} ${t("kilograms")}</output>
            </label>
            <div class="bw-slider-row">
              <button class="bw-step-btn" type="button" data-heat-step="mass" data-delta="-0.1">\u2212</button>
              <input id="mass" data-mass type="range" min="0.1" max="2" step="0.1" value="${mass}">
              <button class="bw-step-btn" type="button" data-heat-step="mass" data-delta="0.1">+</button>
            </div>
          </div>

          <div class="bw-control-group">
            <label class="bw-control-label" for="input-energy">
              <span>${t("inputEnergy")}</span>
              <output class="bw-badge" data-input-energy-output>${formatEnergy(inputEnergyJ)}</output>
            </label>
            <div class="bw-slider-row">
              <button class="bw-step-btn" type="button" data-heat-step="energy" data-delta="-5000">\u2212</button>
              <input id="input-energy" data-input-energy type="range" min="5000" max="50000" step="5000" value="${inputEnergyJ}">
              <button class="bw-step-btn" type="button" data-heat-step="energy" data-delta="5000">+</button>
            </div>
          </div>
          <div class="bw-actions">
            <button class="bw-btn primary" type="button" data-shc-start>${t("heatAll")}</button>
            <button class="bw-btn" type="button" data-shc-reset>${t("resetHeating")}</button>
          </div>
          <p class="bw-threshold-note">${t("heatCapacityNote")}</p>
        </aside>

      </section>
    </main>`;
    bindEvents();
    updateDisplay();
    updateHeatCapacityDisplay();
  }
  function bindEvents() {
    root.querySelectorAll("[data-tab]").forEach((button) => {
      button.addEventListener("click", () => {
        activeTab = button.dataset.tab;
        running = false;
        shcRunning = false;
        cancelAnimationFrame(animationFrame);
        cancelAnimationFrame(shcAnimationFrame);
        render();
      });
    });
    root.querySelector("[data-language]")?.addEventListener("click", () => {
      lang = lang === "en" ? "zh" : "en";
      render();
    });
    root.querySelector("[data-fullscreen]")?.addEventListener("click", toggleFullscreen);
    root.querySelectorAll("[data-toggle-controls]").forEach((button) => {
      button.addEventListener("click", () => {
        controlsCollapsed = !controlsCollapsed;
        sessionStorage.setItem("s3phy-boiling-water-controls-collapsed", String(controlsCollapsed));
        render();
      });
    });
    root.querySelector("[data-power]")?.addEventListener("input", (event) => {
      power = Number(event.target.value);
      if (!running) elapsed = 0;
      updateDisplay();
    });
    root.querySelector("[data-duration]")?.addEventListener("input", (event) => {
      duration = Number(event.target.value);
      if (elapsed > duration) elapsed = duration;
      if (!running) elapsed = 0;
      updateDisplay();
    });
    root.querySelectorAll("[data-step]").forEach((button) => {
      button.addEventListener("click", () => {
        const target = button.dataset.step;
        const delta = Number(button.dataset.delta);
        if (target === "power") power = Math.max(0, Math.min(3e3, power + delta));
        if (target === "duration") duration = Math.max(0, Math.min(300, duration + delta));
        if (!running) elapsed = 0;
        updateDisplay();
      });
    });
    root.querySelector("[data-no-boil-preset]")?.addEventListener("click", setNoBoilPreset);
    root.querySelector("[data-boil-preset]")?.addEventListener("click", setJustEnoughToBoil);
    root.querySelector("[data-start]")?.addEventListener("click", toggleRunning);
    root.querySelector("[data-reset]")?.addEventListener("click", resetExperiment);
    root.querySelector("[data-mass]")?.addEventListener("input", (event) => {
      mass = Number(event.target.value);
      shcProgress = 0;
      updateHeatCapacityDisplay();
    });
    root.querySelector("[data-input-energy]")?.addEventListener("input", (event) => {
      inputEnergyJ = Number(event.target.value);
      shcProgress = 0;
      updateHeatCapacityDisplay();
    });
    root.querySelectorAll("[data-heat-step]").forEach((button) => {
      button.addEventListener("click", () => {
        const target = button.dataset.heatStep;
        const delta = Number(button.dataset.delta);
        if (target === "mass") mass = Math.max(0.1, Math.min(2, Number((mass + delta).toFixed(1))));
        if (target === "energy") inputEnergyJ = Math.max(5e3, Math.min(5e4, inputEnergyJ + delta));
        shcProgress = 0;
        updateHeatCapacityDisplay();
      });
    });
    root.querySelector("[data-shc-start]")?.addEventListener("click", toggleShcHeating);
    root.querySelector("[data-shc-reset]")?.addEventListener("click", resetShcHeating);
  }
  async function toggleFullscreen() {
    try {
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) {
        const request = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
        await request?.call(document.documentElement);
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        await exit?.call(document);
      }
    } catch {
    }
    updateFullscreenButton();
  }
  function updateFullscreenButton() {
    const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    const button = root?.querySelector("[data-fullscreen]");
    const label = root?.querySelector("[data-fullscreen-label]");
    const text = active ? t("exitFullscreen") : t("fullscreen");
    if (button) {
      button.setAttribute("aria-pressed", String(active));
      button.setAttribute("aria-label", text);
    }
    if (label) label.textContent = text;
  }
  function toggleRunning() {
    if (elapsed >= duration) elapsed = 0;
    running = !running;
    lastFrame = performance.now();
    if (running) {
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(step);
    } else {
      cancelAnimationFrame(animationFrame);
    }
    updateDisplay();
  }
  function resetExperiment() {
    running = false;
    power = 0;
    duration = 0;
    elapsed = 0;
    lastFrame = 0;
    cancelAnimationFrame(animationFrame);
    updateDisplay();
  }
  function applyPowerTimePreset(nextPower, nextDuration) {
    running = false;
    power = nextPower;
    duration = nextDuration;
    elapsed = 0;
    lastFrame = 0;
    cancelAnimationFrame(animationFrame);
    updateDisplay();
  }
  function setNoBoilPreset() {
    applyPowerTimePreset(NON_BOIL_POWER_W, PRESET_DURATION_S);
  }
  function setJustEnoughToBoil() {
    applyPowerTimePreset(JUST_BOIL_POWER_W, PRESET_DURATION_S);
  }
  function step(now) {
    if (!running) return;
    const deltaSeconds = Math.min((now - lastFrame) / 1e3, 0.1) * SIMULATION_SPEED;
    lastFrame = now;
    elapsed = Math.min(duration, elapsed + deltaSeconds);
    if (elapsed >= duration) running = false;
    updateDisplay();
    if (running) animationFrame = requestAnimationFrame(step);
  }
  function toggleShcHeating() {
    if (shcProgress >= 1) shcProgress = 0;
    shcRunning = !shcRunning;
    shcLastFrame = performance.now();
    if (shcRunning) {
      cancelAnimationFrame(shcAnimationFrame);
      shcAnimationFrame = requestAnimationFrame(stepShcHeating);
    } else {
      cancelAnimationFrame(shcAnimationFrame);
    }
    updateHeatCapacityDisplay();
  }
  function resetShcHeating() {
    shcRunning = false;
    shcProgress = 0;
    shcLastFrame = 0;
    cancelAnimationFrame(shcAnimationFrame);
    updateHeatCapacityDisplay();
  }
  function stepShcHeating(now) {
    if (!shcRunning) return;
    const delta = Math.min((now - shcLastFrame) / 4e3, 0.04);
    shcLastFrame = now;
    shcProgress = Math.min(1, shcProgress + delta);
    if (shcProgress >= 1) shcRunning = false;
    updateHeatCapacityDisplay();
    if (shcRunning) shcAnimationFrame = requestAnimationFrame(stepShcHeating);
  }
  function updateDisplay() {
    if (!root) return;
    const energy = power * elapsed;
    const predictedEnergy = power * duration;
    const boilingProgress = Math.min(energy / BOILING_THRESHOLD_J, 1);
    const meterProgress = Math.min(energy / ENERGY_METER_MAX_J, 1);
    const remainingEnergy = Math.max(BOILING_THRESHOLD_J - energy, 0);
    const hasBoiled = energy >= BOILING_THRESHOLD_J;
    const finished = elapsed >= duration && duration > 0;
    const stage = root.querySelector("[data-stage]");
    const water = root.querySelector("[data-water]");
    const status = root.querySelector("[data-status]");
    const statusLabel = root.querySelector("[data-status-label]");
    const startButton = root.querySelector("[data-start]");
    root.querySelector("[data-power-output]").textContent = `${power} ${t("watts")}`;
    root.querySelector("[data-power-hero]").textContent = `${power} ${t("watts")}`;
    root.querySelector("[data-duration-output]").textContent = `${duration} ${t("seconds")}`;
    root.querySelector("[data-power]").value = String(power);
    root.querySelector("[data-duration]").value = String(duration);
    root.querySelector("[data-predicted-energy]").textContent = formatEnergy(predictedEnergy);
    root.querySelector("[data-live-energy]").textContent = formatEnergy(energy);
    root.querySelector("[data-energy-remaining]").textContent = formatEnergy(remainingEnergy);
    const progressPercent = meterProgress * 100;
    const progressBar = root.querySelector("[data-progress]");
    progressBar.setAttribute("aria-valuenow", String(Math.round(Math.min(energy, ENERGY_METER_MAX_J) / 1e3)));
    root.querySelector("[data-progress-fill]").style.width = `${progressPercent}%`;
    const predictionResult = root.querySelector("[data-prediction-result]");
    const predictedToBoil = predictedEnergy >= BOILING_THRESHOLD_J;
    predictionResult.textContent = predictedToBoil ? t("willBoil") : t("willNotBoil");
    predictionResult.classList.toggle("will-not-boil", !predictedToBoil);
    stage.classList.toggle("is-heating", running && power > 0);
    stage.classList.toggle("is-near-boiling", boilingProgress >= 0.72);
    stage.classList.toggle("is-almost-boiling", boilingProgress >= 0.88);
    stage.classList.toggle("is-boiling", hasBoiled);
    stage.style.setProperty("--heat", boilingProgress.toFixed(2));
    stage.style.setProperty("--temp-level", boilingProgress.toFixed(3));
    stage.style.setProperty("--water-speed", `${Math.max(0.38, 2.2 - boilingProgress * 1.75).toFixed(2)}s`);
    stage.style.setProperty("--power-level", (power / 3e3).toFixed(3));
    water.classList.toggle("is-warm", boilingProgress >= 0.2);
    water.classList.toggle("is-hot", boilingProgress >= 0.45);
    water.classList.toggle("is-boiling", hasBoiled);
    let state = "ready";
    let statusText = t("statusReady");
    if (finished) {
      state = "finished";
      statusText = hasBoiled ? t("statusBoiled") : t("statusFinished");
    } else if (running && hasBoiled) {
      state = "boiling";
      statusText = t("statusBoiling");
    } else if (running || elapsed > 0) {
      state = "heating";
      statusText = t("statusHeating");
    }
    status.dataset.state = state;
    statusLabel.textContent = statusText;
    if (running) startButton.textContent = t("pause");
    else if (finished) startButton.textContent = t("replay");
    else if (elapsed > 0) startButton.textContent = t("continue");
    else startButton.textContent = t("start");
    updateFullscreenButton();
  }
  function updateHeatCapacityDisplay() {
    if (!root) return;
    const deliveredEnergy = inputEnergyJ * shcProgress;
    const maximumTargetRise = inputEnergyJ / (mass * MEDIA.copper.c);
    root.querySelector("[data-mass]").value = String(mass);
    root.querySelector("[data-input-energy]").value = String(inputEnergyJ);
    root.querySelector("[data-mass-output]").textContent = `${mass.toFixed(1)} ${t("kilograms")}`;
    root.querySelector("[data-input-energy-output]").textContent = formatEnergy(inputEnergyJ);
    Object.entries(MEDIA).forEach(([key, item]) => {
      const rise = deliveredEnergy / (mass * item.c);
      const relativeRise = maximumTargetRise > 0 ? rise / maximumTargetRise : 0;
      root.querySelector(`[data-material-rise="${key}"]`).textContent = `${rise.toFixed(1)}\xB0C`;
      root.querySelector(`[data-material-temp-fill="${key}"]`).style.height = `${8 + relativeRise * 88}%`;
      const card = root.querySelector(`[data-material-card="${key}"]`);
      card.style.setProperty("--card-heat", shcProgress.toFixed(3));
      card.classList.toggle("is-heating", shcRunning);
    });
    const startButton = root.querySelector("[data-shc-start]");
    if (shcRunning) startButton.textContent = t("pauseHeating");
    else if (shcProgress >= 1) startButton.textContent = t("replayHeating");
    else startButton.textContent = t("heatAll");
  }
  window.addEventListener("message", (event) => {
    if (event.data?.type !== "s3phy:lang") return;
    const next = event.data.lang === "en" ? "en" : "zh";
    if (next === lang) return;
    lang = next;
    render();
  });
  document.addEventListener("fullscreenchange", updateFullscreenButton);
  document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
  render();
})();

  </script>
</body>
</html>
