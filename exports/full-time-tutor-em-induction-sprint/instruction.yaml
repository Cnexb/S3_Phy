the task: FIXED. The candidate does not choose a topic.
  1. an interactive HTML tool on ELECTROMAGNETIC INDUCTION (HKDSE SPEM07)
     folder: starter_kit/task_em_induction_interactive_tool
     hand-in: interactive-tool.html in that same folder

learning goal: magnetic flux Phi = BA cos theta, Faraday emf = -dPhi/dt, and Lenz's law for direction. The student is corrected when wrong.

tool requirements:
  - change at least two quantities
  - commit to an answer before the result is shown
  - right or wrong, plus a short explanation
  - Show worked example, and Try another with fresh clean numbers
  - single HTML file, no external libraries
  - English, with Traditional Chinese labels where useful
  - readable on a laptop

demonstration on the brief site: S3 stacked-boxes lab (Force III), a different topic, so it cannot be copied.
  path: demos/stacked-boxes/index.html

