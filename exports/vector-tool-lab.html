/* S3_Phy embed mode — shared chrome for iframe labs inside Hub */

html.s3phy-embed {
  font-family: var(--s3-font);
  font-size: var(--s3-font-size-base);
  line-height: var(--s3-line-height);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}

html.s3phy-embed:has(.lab-section) {
  height: 100%;
}

html.s3phy-embed body {
  font-family: var(--s3-font);
  font-size: max(var(--s3-font-min), 1rem);
  line-height: var(--s3-line-height);
  margin: 0;
}

/* Interactive lab iframe — flex fill (not quiz/worksheet) */
html.s3phy-embed body:has(.lab-section),
html.s3phy-embed body.embed-mode:has(.sim-main-col),
html.s3phy-embed body:has(.sim-main-col):not(:has(#quiz-layout)) {
  height: 100%;
  min-height: 0 !important;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

html.s3phy-embed body:has(.lab-section) > main,
html.s3phy-embed body.embed-mode main.flex-grow,
html.s3phy-embed body:has(.sim-main-col):not(:has(#quiz-layout)) > main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  width: 100%;
  overflow: hidden;
}

/* Quiz / worksheet iframe — preserve two-column grid */
html.s3phy-embed body:has(#quiz-layout) {
  height: auto;
  min-height: 100%;
  display: block;
  overflow: auto;
}

html.s3phy-embed #quiz-layout {
  display: grid !important;
  grid-template-columns: 1fr;
  gap: 1.5rem;
  max-width: none !important;
  width: 100%;
  margin: 0;
  align-items: start;
  box-sizing: border-box;
}

@media (min-width: 1101px) {
  html.s3phy-embed #quiz-layout {
    grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  }
}

@media (max-width: 1100px) {
  html.s3phy-embed #quiz-layout > aside#settings-panel {
    position: static;

    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
}

html.s3phy-embed #quiz-layout > aside#settings-panel {
  position: sticky;
  top: 0.5rem;
  align-self: start;
  max-height: calc(100dvh - 1rem);
  overflow-y: auto;
}

html.s3phy-embed #quiz-layout > .min-w-0 {
  min-width: 0;
  width: 100%;
}

html.s3phy-embed .lab-section {
  flex: 1 1 auto;
  min-height: 0 !important;
  height: 100%;
  align-content: stretch;
  align-items: stretch;
}

html.s3phy-embed .lab-viz,
html.s3phy-embed .lab-steps {
  height: 100% !important;
  min-height: 0;
  max-height: none !important;
}

html.s3phy-embed .lab-viz {
  display: flex;
  flex-direction: column;
}

html.s3phy-embed .lab-viz-canvas {
  flex: 1 1 auto;
  min-height: 200px;
  max-height: none !important;
}

html.s3phy-embed .lab-steps {
  overflow-y: auto;
}

html.s3phy-embed .lab-viz.lab-viz-dual {
  display: grid !important;
  height: 100% !important;
}

html.s3phy-embed .lab-viz-dual {
  max-height: none !important;
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
  align-content: stretch;
  overflow: hidden;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel-chart {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel:first-child .lab-viz-canvas {
  flex: 1 1 auto !important;
  min-height: 120px !important;
  max-height: none !important;
  aspect-ratio: unset;
  height: auto;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel-chart .lab-viz-chart-wrap {
  flex: 1 1 auto;
  min-height: 0;
  height: auto !important;
  margin-top: 0;
  aspect-ratio: unset;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

html.s3phy-embed header,
html.s3phy-embed footer {
  flex-shrink: 0;
}

html.s3phy-embed .max-w-7xl {
  max-width: none;
  width: 100%;
}

html.s3phy-embed .sim-main-col,
html.s3phy-embed .glass-panel.flex-grow {
  flex: 1 1 auto;
  min-height: 0;
}

html.s3phy-embed .canvas-container {
  flex: 1 1 auto;
  min-height: 0 !important;
  height: auto !important;
  max-height: none;
}

html.s3phy-embed .main-container,
html.s3phy-embed .lab-wrap,
html.s3phy-embed .dashboard,
html.s3phy-embed .app-root {
  max-width: none;
  width: 100%;
  margin: 0;
}

/* Floating controls panel (heat labs + shared script) */
.lab-section {
  position: relative;
  min-height: 0;
}

@media (min-width: 768px) {
  /* Keep grid items as 2 parallel columns at >= 768px */
  html.s3phy-embed .lab-section,
  html.s3phy-embed .main-grid {
    grid-template-columns: repeat(12, minmax(0, 1fr)) !important;
  }
  html.s3phy-embed .lab-section.controls-floating .lab-viz,
  html.s3phy-embed .main-grid .sim-main-col {
    grid-column: span 6 / span 6 !important;
  }
  html.s3phy-embed .lab-section.controls-floating .lab-steps,
  html.s3phy-embed .main-grid .tab-sidebar-col {
    grid-column: span 6 / span 6 !important;
  }
  /* Specially for heat transfer conduction / convection / radiation simulation */
  html.s3phy-embed .main-grid > div:first-of-type {
    grid-column: span 6 / span 6 !important;
  }
  html.s3phy-embed .main-grid > div:last-of-type {
    grid-column: span 6 / span 6 !important;
  }

  html.s3phy-embed .lab-controls.lab-controls-float,
  html.s3phy-embed .control-panel {
    position: absolute !important;
    z-index: 50 !important;
    width: var(--s3-float-panel-w) !important;
    max-width: var(--s3-float-panel-w) !important;
  }
}

@media (max-width: 767px) {
  html.s3phy-embed .lab-section.controls-floating .lab-viz,
  html.s3phy-embed .lab-section.controls-floating .lab-steps {
    grid-column: 1 / -1;
  }

  html.s3phy-embed .lab-controls.lab-controls-float {
    position: relative;
    left: auto !important;
    top: auto !important;
    width: 100% !important;
    max-width: none;
    margin-bottom: 0.75rem;
  }
}

.lab-controls.lab-controls-float {
  position: absolute;
  z-index: 40;
  width: var(--s3-float-panel-w);
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
}

.lab-controls-body {
  transition: max-height 0.25s ease, opacity 0.2s ease;
}

.lab-controls-desc {
  transition: max-height 0.25s ease, opacity 0.2s ease;
}

.lab-controls.controls-collapsed .lab-controls-body,
.lab-controls.controls-collapsed .lab-controls-desc {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  pointer-events: none;
  margin: 0;
  padding-top: 0;
  padding-bottom: 0;
}

.lab-controls:not(.controls-collapsed) .lab-controls-body {
  max-height: min(70vh, 520px);
  opacity: 1;
  overflow-y: auto;
}

.lab-controls:not(.controls-collapsed) .lab-controls-desc {
  opacity: 1;
  max-height: 4rem;
}

.lab-controls.controls-collapsed .lab-controls-title-text {
  display: none;
}

.lab-controls-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.lab-controls-actions {
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 0.5rem;
  width: 100%;
}

.lab-controls-actions button {
  padding: 0.625rem 0.75rem;
  justify-content: center;
}

.lab-controls-actions button:not(.flex-1) {
  flex-shrink: 0;
}

.lab-controls-actions button.flex-1 {
  white-space: nowrap;
  min-width: max-content;
}

.lab-controls-drag-handle {
  display: none;
  cursor: grab;
  touch-action: none;
  color: #94a3b8;
  padding: 0.25rem;
  border-radius: 0.375rem;
  flex-shrink: 0;
  background: none;
  border: none;
}

@media (min-width: 900px) {
  .lab-controls.lab-controls-float .lab-controls-drag-handle {
    display: flex;
    align-items: center;
    justify-content: center;
  }
}

.lab-controls-drag-handle:active {
  cursor: grabbing;
}

/* Hub iframe — standalone labs (rotating-mirror, rgb, thermometer) */
html.s3phy-embed:has(#app > .rml),
html.s3phy-embed:has(#app > .rgb-mixer),
html.s3phy-embed:has(#app > .tl-wrap) {
  height: 100%;
}

html.s3phy-embed body:has(#app > .rml),
html.s3phy-embed body:has(#app > .rgb-mixer),
html.s3phy-embed body:has(#app > .tl-wrap) {

  min-height: 0 !important;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

html.s3phy-embed body:has(#app > .rml) #app,
html.s3phy-embed body:has(#app > .rgb-mixer) #app,
html.s3phy-embed body:has(#app > .tl-wrap) #app {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

html.s3phy-embed .rml,
html.s3phy-embed .rgb-mixer,
html.s3phy-embed .tl-wrap {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

html.s3phy-embed .rml .rml-head,
html.s3phy-embed .tl-wrap .tl-head {
  display: none;
}

html.s3phy-embed .rml {
  display: flex;
  flex-direction: column;
}

html.s3phy-embed .rml .rml-dash {
  flex: 1 1 auto;
  min-height: 0;
  align-items: stretch;
  flex-wrap: nowrap;
  max-width: none;
  width: 100%;
  margin: 0;
}

html.s3phy-embed .rml .rml-viz {
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  display: flex;
  align-items: stretch;
}

html.s3phy-embed .rml .rml-canvas {
  width: 100%;
  height: 100%;
  max-width: none;
  flex: 1;
  object-fit: contain;
}

html.s3phy-embed .rml .rml-controls {
  flex: 0 0 auto;
  max-height: 100%;
  overflow-y: auto;
}

html.s3phy-embed .tl-wrap {
  display: flex;
  flex-direction: column;
}

html.s3phy-embed .tl-wrap .tl-dash,
html.s3phy-embed .tl-wrap .tl-dash--faulty {
  flex: 1 1 auto;

}

  min-height: 0;
}

  display: grid;

  grid-template-rows: 1fr;
  align-items: stretch;
  gap: 14px;
}

html.s3phy-embed .tl-wrap--faulty-cal .tl-faulty-hero {
  grid-column: 1;
  grid-row: 1;
}

html.s3phy-embed .tl-wrap--faulty-cal .tl-faulty-live {
  grid-column: 2;
  grid-row: 1;
  overflow-y: auto;
  min-height: 0;
}

html.s3phy-embed .tl-wrap--faulty-cal .tl-controls {
  grid-column: 1 / -1;
}

html.s3phy-embed .rgb-mixer {
  display: flex;
  flex-direction: column;
}

html.s3phy-embed .rgb-mixer-body {
  flex: 1 1 auto;
  min-height: 0 !important;
  height: auto;
  max-height: none;
  align-items: stretch;
}

html.s3phy-embed .rgb-mixer-stage {
  min-height: 0 !important;
  height: 100%;
}

html.s3phy-embed .rgb-mixer-canvas {
  width: 100%;
  height: 100%;
}

html.s3phy-embed .rgb-mixer-controls {
  overflow-y: auto;
  max-height: 100%;
}

/* Lens simulator embed compact chrome */
html.s3phy-embed .controls-panel,
html.s3phy-embed .control-panel {
  width: var(--s3-float-panel-w) !important;
  max-width: var(--s3-float-panel-w) !important;
}

/* Minimum readable text in embed controls */
html.s3phy-embed label,
html.s3phy-embed .control label,
html.s3phy-embed button,
html.s3phy-embed input,
html.s3phy-embed select {
  font-size: max(var(--s3-font-min), 0.875rem);
}

/* Height adaptive scaling for compact/low-height viewports (height < 720px) */
@media (max-height: 720px) {

  /* Compact header & tabs */

  /* KaTeX mathematical formulas scaling and tight margins */

  /* Shrink canvas and containers to prevent overflow */

  /* Compact parameters/controls — keep panel wide enough for action buttons */

      color: var(--vt-text);
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .stamp-btn:hover { border-color: #94a3b8; background: #f8fafc; }
    .stamp-btn.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .stamp-btn.remove-mode {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .stamp-btn.remove-mode:hover {
      background: #222;
      color: #fff;
      border-color: #222;
    }
    .slope-ends {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--vt-muted);
      margin-top: -4px;
    }
    .vt-controls { gap: 12px; }
    .vt-hint {
      margin: 0;
      font-size: 0.78rem;
      color: var(--vt-muted);
      text-align: center;
    }

    .vt-controls {
      flex: 1;
      min-width: min(100%, 280px);
      max-width: min(360px, calc(100% - 24px));
      background: var(--vt-panel);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--vt-border);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(26, 28, 44, 0.04);
    }
    .vt-section-title {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--primary);
    }
    .vt-section-title.muted { color: var(--vt-muted); }

    .vt-cg {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #slope-controls[hidden] { display: none !important; }
    .vt-lr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
      gap: 8px;
    }
    .vt-lr label { color: var(--vt-muted); }
    .vt-lr .polar-label { color: var(--primary); }
    .vt-lr .angle-label { color: var(--angle); }

    input[type="number"] {
      width: 72px;
      padding: 4px 6px;
      border: 1px solid var(--vt-border);
      border-radius: 6px;
      text-align: center;
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--vt-text);
      background: #fff;
    }
    .polar-input input[type="number"] {
      border-color: var(--primary);
      color: var(--primary);
      background: #f0f8ff;
    }
    .angle-input input[type="number"] {
      border-color: var(--angle);
      color: var(--angle);
      background: #fff8e1;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      margin: 2px 0;
      cursor: pointer;
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #e8eaed;
      border-radius: 3px;
    }
    input[type="range"]::-webkit-slider-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 1px 4px rgba(26, 28, 44, 0.15);
      border: 2px solid #2563eb;
    }
    input[type="range"]::-moz-range-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #e8eaed;
      border-radius: 3px;
      border: none;
    }
    input[type="range"]::-moz-range-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border: 2px solid #2563eb;
      box-shadow: 0 1px 4px rgba(26, 28, 44, 0.15);
    }

    .field-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--vt-muted);
      display: block;
      margin-bottom: 4px;
    }

    .vt-reset {
      background: transparent;
      border: 1px solid var(--vt-border);
      color: var(--vt-muted);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      width: 100%;
      font-weight: 600;
    }
    .vt-reset:hover {
      background: #f1f3f5;
      color: var(--vt-text);
      border-color: #cbd5e1;
    }

    .vt-divider {
      height: 1px;
      background: var(--vt-border);
      margin: 2px 0;
    }

    @media (max-width: 720px) {
      .vt-dash { flex-direction: column; }
      .vt-controls {
        max-width: 100%;
        width: 100%;
      }
      .vt-head-btns {
        position: static;
        justify-content: center;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="lab-section">
      <div class="vt-head">
        <h1 class="vt-title" id="page-title">Vector Tool — Force Diagram</h1>
        <p class="vt-sub" id="page-sub">Set force size and direction, then place objects</p>
        <div class="vt-head-btns">
          <button type="button" class="fs-btn" id="btn-fullscreen">Full screen</button>
          <button type="button" class="lang-btn" id="lang-toggle">中文</button>
        </div>
      </div>

      <div class="vt-dash">
        <div class="vt-viz">
          <canvas id="vectorCanvas" class="vt-canvas" width="900" height="640"></canvas>
          <p class="vt-hint" id="drag-hint">Drag the blue arrow tip · Drag the black origin</p>
        </div>

        <div class="vt-controls">
          <h4 class="vt-section-title" id="sec-vector">① Force and direction</h4>

          <div class="vt-cg polar-input">
            <div class="vt-lr">
              <label class="polar-label" id="label-mag">Force size F</label>
              <input type="number" id="numMag" value="7.2" step="0.1" min="0">
            </div>
            <input type="range" id="sliderMag" min="0" max="25" step="0.1" value="7.2">
          </div>

          <div class="vt-cg angle-input">
            <div class="vt-lr">
              <label class="angle-label" id="label-angle">Direction angle θ°</label>
              <input type="number" id="numAngle" value="45" step="1" min="0" max="90">
            </div>
            <input type="range" id="sliderAngle" min="0" max="360" step="1" value="45">
          </div>

          <p class="vt-hint" id="panel-tip" style="text-align:left;margin:0;">You can also drag the blue arrow tip on the graph.</p>

          <div class="vt-divider"></div>
          <h4 class="vt-section-title muted" id="sec-stamps">② Box and slope</h4>
          <div class="vt-cg">
            <div class="stamp-row" id="stamp-row">
              <button type="button" class="stamp-btn" data-kind="box" id="stamp-box">Place a box</button>
            </div>
            <button type="button" class="stamp-btn" id="stamp-slope">Box with slope</button>
            <div class="vt-cg slope-input" id="slope-controls" hidden>
              <div class="vt-lr">
                <label class="angle-label" id="label-slope">Slope to the horizontal</label>
                <input type="number" id="numSlope" value="0" step="1" min="0" max="90">
              </div>
              <input type="range" id="sliderSlope" min="-90" max="90" step="1" value="0">
              <div class="slope-ends"><span>90°</span><span>0°</span><span>90°</span></div>
            </div>
          </div>

          <button type="button" class="vt-reset" id="btn-reset" onclick="resetView()">Reset</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  const dict = {
    zh: {
      docTitle: '矢量工具 — 受力圖',
      pageTitle: '矢量工具 — 受力圖',
      pageSub: '調力的大小同方向，再放物件示範',
      dragHint: '拖藍色箭嘴改力 · 拖黑點移原點',
      secVector: '① 力與方向',
      panelTip: '亦可直接拖圖上藍色箭嘴尖端。',
      secStamps: '② 箱子與斜面',
      stampBox: '放置箱子',
      stampRemove: '移除箱子',
      stampSlopeOn: '有斜面的箱子',
      stampSlopeOff: '取消斜面',
      labelMag: '力的大小 F',
      labelAngle: '方向角度 θ°',
      labelSlope: '斜面與水平的夾角',
      btnReset: '重設',
      langBtn: 'English',
      fsEnter: '全螢幕',
      fsExit: '離開',
      smoothFloor: '光滑地面'
    },
    en: {
      docTitle: 'Vector Tool — Force Diagram',
      pageTitle: 'Vector Tool — Force Diagram',
      pageSub: 'Set force size and direction, then place objects',
      dragHint: 'Drag the blue arrow tip · Drag the black origin',
      secVector: '① Force and direction',
      panelTip: 'You can also drag the blue arrow tip on the graph.',
      secStamps: '② Box and slope',
      stampBox: 'Place a box',
      stampRemove: 'Remove the box',
      stampSlopeOn: 'Box with slope',
      stampSlopeOff: 'Box without slope',
      labelMag: 'Force size F',
      labelAngle: 'Direction angle θ°',
      labelSlope: 'Slope to the horizontal',
      btnReset: 'Reset',
      langBtn: '中文',
      fsEnter: 'Full screen',
      fsExit: 'Exit',
      smoothFloor: 'Smooth floor'
    }
  };

  function hubLangToLocal(lang) {
    if (lang === 'en') return 'en';
    return 'zh';
  }

  const params = new URLSearchParams(location.search);
  let currentLang = hubLangToLocal(params.get('lang') || 'en');
  const t = () => dict[currentLang] || dict.zh;

  function updateLanguageUI() {
    const tr = t();
    document.documentElement.lang = currentLang === 'zh' ? 'zh-HK' : 'en';
    document.title = tr.docTitle;
    document.getElementById('page-title').textContent = tr.pageTitle;
    document.getElementById('page-sub').textContent = tr.pageSub;
    document.getElementById('drag-hint').textContent = tr.dragHint;
    document.getElementById('lang-toggle').textContent = tr.langBtn;
    syncFullscreenButton();
    document.getElementById('sec-vector').textContent = tr.secVector;
    document.getElementById('panel-tip').textContent = tr.panelTip;
    document.getElementById('sec-stamps').textContent = tr.secStamps;
    syncBoxButton();
    syncSlopeButton();
    document.getElementById('label-mag').textContent = tr.labelMag;
    document.getElementById('label-angle').textContent = tr.labelAngle;
    const slopeLabel = document.getElementById('label-slope');
    if (slopeLabel) slopeLabel.textContent = tr.labelSlope;
    document.getElementById('btn-reset').textContent = tr.btnReset;
    draw();
  }

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function syncFullscreenButton() {
    const tr = t();
    const btn = document.getElementById('btn-fullscreen');
    if (btn) btn.textContent = isFullscreen() ? tr.fsExit : tr.fsEnter;
  }

  function toggleFullscreen() {
    const root = document.documentElement;
    if (isFullscreen()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    } else {
      const req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (req) req.call(root);
    }
  }

  document.getElementById('lang-toggle').addEventListener('click', () => {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    updateLanguageUI();
  });
  document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
  function onFullscreenChange() {
    document.documentElement.classList.toggle('is-fullscreen', isFullscreen());
    syncFullscreenButton();
    fitCanvas();
    draw();
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);

  window.addEventListener('message', (ev) => {
    if (ev.data?.type !== 's3phy:lang') return;
    currentLang = hubLangToLocal(ev.data.lang);
    updateLanguageUI();
  });

  // --- Configuration (logical CSS pixels; buffer scaled by DPR) ---
  const canvas = document.getElementById('vectorCanvas');
  const ctx = canvas.getContext('2d');
  let width = 900;
  let height = 640;
  let dpr = 1;
  let scale = 30; // px per graph square
  const NEWTONS_PER_GRID = 2;

  // State
  let lastAngleDeg = 45;
  let vector = { x: 5.091, y: -5.091 }; // 45°, F ≈ 7.2; Y is canvas down
  let paperOrigin = { x: width / 2, y: height / 2 };
  let origin = { x: width / 2, y: height / 2 };
  let axisAngle = 0;
  let bgImage = null;
  let showGrid = true;
  let angleRef = 'x';
  let axisPolarity = 1;
  let compStyle = 'origin';
  let decompOrder = 'yx';

  /** @type {{ id: number, kind: string, x: number, y: number }[]} */
  let sceneObjects = [];
  let nextObjId = 1;
  let stampKind = null;
  let selectedObjId = null;
  let isDraggingObject = false;
  let objDragOff = { x: 0, y: 0 };
  const GRID_BOX = { left: -2, top: 1, w: 4, h: 2 };

  let slopeMode = false;
  let slopeDeg = 0;

  let drawnLabels = [];
  let isDraggingVector = false;
  let isDraggingOrigin = false;

  const inputs = {
    mag: document.getElementById('numMag'),
    sliderMag: document.getElementById('sliderMag'),
    angle: document.getElementById('numAngle'),
    sliderAngle: document.getElementById('sliderAngle'),
    slope: document.getElementById('numSlope'),
    sliderSlope: document.getElementById('sliderSlope')
  };

  function fitCanvas() {
    const parent = canvas.parentElement;
    const cssW = Math.max(320, Math.floor((parent?.clientWidth || 900) - 4));
    let cssH = Math.round(cssW * (640 / 900));
    if (parent && parent.clientHeight > 80) {
      cssH = Math.max(360, Math.min(cssH, parent.clientHeight - 40));
    }
    cssH = Math.max(360, Math.min(720, cssH));
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    width = cssW;
    height = cssH;
    canvas.style.width = `${cssW}px`;
    canvas.style.height = `${cssH}px`;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    // Keep origin roughly centered on first layout / if off-canvas
    if (paperOrigin.x < 0 || paperOrigin.x > width || paperOrigin.y < 0 || paperOrigin.y > height) {
      paperOrigin = { x: width / 2, y: height / 2 };
    }
    if (origin.x < 0 || origin.x > width || origin.y < 0 || origin.y > height) {
      origin = { x: width / 2, y: height / 2 };
    }
    draw();
  }

  function resetLogicalTransform() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // --- Logic ---

  function getAngleFromRef() {
    let mathAngle = Math.atan2(-vector.y, vector.x);
    let baseOffset = (angleRef === 'x') ? 0 : (Math.PI / 2);
    if (axisPolarity === -1) baseOffset += Math.PI;

    let relAngle = mathAngle - baseOffset;
    let deg = relAngle * 180 / Math.PI;
    while (deg < 0) deg += 360;
    while (deg >= 360) deg -= 360;
    return deg;
  }

  function setVectorFromRef(mag, angleDeg) {
    let angleRad = angleDeg * Math.PI / 180;
    let baseOffset = (angleRef === 'x') ? 0 : (Math.PI / 2);
    if (axisPolarity === -1) baseOffset += Math.PI;

    let mathAngle = angleRad + baseOffset;
    vector.x = mag * Math.cos(mathAngle);
    vector.y = -mag * Math.sin(mathAngle);
  }

  function angleToHorizontal(deg) {
    let a = ((deg % 180) + 180) % 180;
    return a > 90 ? 180 - a : a;
  }

  function isForceOnAxis() {
    let d = lastAngleDeg;
    while (d < 0) d += 360;
    while (d >= 360) d -= 360;
    const axes = [0, 90, 180, 270];
    return axes.some((a) => Math.abs(d - a) < 0.5 || Math.abs(d - 360) < 0.5);
  }

  function isForceZero() {
    return Math.hypot(vector.x, vector.y) < 0.05;
  }

  function setAcuteInCurrentQuadrant(acute) {
    const a = Math.max(0, Math.min(90, acute));
    const q = lastAngleDeg;
    if (q <= 90) lastAngleDeg = a;
    else if (q <= 180) lastAngleDeg = 180 - a;
    else if (q <= 270) lastAngleDeg = 180 + a;
    else lastAngleDeg = 360 - a;
  }

  function updateUI(skipActiveElement = null) {
    const mag = Math.hypot(vector.x, vector.y);
    const displayAngle = angleToHorizontal(lastAngleDeg);

    if (skipActiveElement !== inputs.mag) inputs.mag.value = mag.toFixed(1);
    if (skipActiveElement !== inputs.sliderMag) inputs.sliderMag.value = mag;

    if (skipActiveElement !== inputs.angle) inputs.angle.value = displayAngle.toFixed(1);
    if (skipActiveElement !== inputs.sliderAngle) inputs.sliderAngle.value = lastAngleDeg;

    if (inputs.slope && skipActiveElement !== inputs.slope) inputs.slope.value = Math.abs(slopeDeg).toFixed(0);
    if (inputs.sliderSlope && skipActiveElement !== inputs.sliderSlope) inputs.sliderSlope.value = slopeDeg;

    draw();
  }

  function onMagnitudeInput(e) {
    let newMag = parseFloat(e.target.value);
    if (isNaN(newMag) || newMag < 0) newMag = 0;
    setVectorFromRef(newMag, lastAngleDeg);
    updateUI(e.target);
  }

  function onAngleSliderInput(e) {
    let newAngle = parseFloat(e.target.value);
    if (isNaN(newAngle)) newAngle = 0;
    while (newAngle < 0) newAngle += 360;
    while (newAngle >= 360) newAngle -= 360;
    lastAngleDeg = newAngle;
    setVectorFromRef(Math.hypot(vector.x, vector.y), lastAngleDeg);
    updateUI(e.target);
  }

  function onAngleNumberInput(e) {
    let newAcute = parseFloat(e.target.value);
    if (isNaN(newAcute)) newAcute = 0;
    setAcuteInCurrentQuadrant(newAcute);
    setVectorFromRef(Math.hypot(vector.x, vector.y), lastAngleDeg);
    updateUI(e.target);
  }

  inputs.sliderMag.addEventListener('input', onMagnitudeInput);
  inputs.mag.addEventListener('input', onMagnitudeInput);
  inputs.sliderAngle.addEventListener('input', onAngleSliderInput);
  inputs.angle.addEventListener('input', onAngleNumberInput);

  function applySlopeDeg(deg) {
    slopeDeg = Math.max(-90, Math.min(90, deg));
    axisAngle = slopeMode ? slopeDeg : 0;
    if (slopeMode && hasBox()) pinOriginToBoxTopRight();
  }

  function onSlopeSliderInput(e) {
    let v = parseFloat(e.target.value);
    if (isNaN(v)) v = 0;
    applySlopeDeg(v);
    updateUI(e.target);
  }

  function onSlopeNumberInput(e) {
    let a = parseFloat(e.target.value);
    if (isNaN(a)) a = 0;
    a = Math.max(0, Math.min(90, a));
    const sign = slopeDeg < 0 ? -1 : 1;
    applySlopeDeg(a * sign);
    updateUI(e.target);
  }

  if (inputs.sliderSlope) inputs.sliderSlope.addEventListener('input', onSlopeSliderInput);
  if (inputs.slope) inputs.slope.addEventListener('input', onSlopeNumberInput);

  function hasBox() {
    return sceneObjects.some((o) => o.kind === 'box');
  }

  function syncBoxButton() {
    const btn = document.getElementById('stamp-box');
    const tr = t();
    if (!btn) return;
    const placed = hasBox();
    btn.textContent = placed ? tr.stampRemove : tr.stampBox;
    btn.classList.toggle('remove-mode', placed);
  }

  function syncSlopeButton() {
    const btn = document.getElementById('stamp-slope');
    const panel = document.getElementById('slope-controls');
    if (btn) btn.style.display = 'none';
    if (panel) panel.hidden = !slopeMode;
  }

  function currentSlopeDeg() {
    return slopeMode ? slopeDeg : 0;
  }

  function boxLocalToPaper(lx, ly) {
    const pivX = 0;
    const pivY = GRID_BOX.top + GRID_BOX.h;
    const rad = currentSlopeDeg() * Math.PI / 180;
    const dx = lx - pivX;
    const dy = ly - pivY;
    const c = Math.cos(rad);
    const s = Math.sin(rad);
    return { x: pivX + dx * c - dy * s, y: pivY + dx * s + dy * c };
  }

  function paperToBoxLocal(px, py) {
    const pivX = 0;
    const pivY = GRID_BOX.top + GRID_BOX.h;
    const rad = -currentSlopeDeg() * Math.PI / 180;
    const dx = px - pivX;
    const dy = py - pivY;
    const c = Math.cos(rad);
    const s = Math.sin(rad);
    return { x: pivX + dx * c - dy * s, y: pivY + dx * s + dy * c };
  }

  function boxLocalToScreen(lx, ly) {
    const p = boxLocalToPaper(lx, ly);
    return { x: paperOrigin.x + p.x * scale, y: paperOrigin.y + p.y * scale };
  }

  function pinOriginToBoxTopRight() {
    const p = boxLocalToScreen(GRID_BOX.left + GRID_BOX.w, GRID_BOX.top);
    origin = { x: p.x, y: p.y };
  }

  function placeCenterBox() {
    sceneObjects = sceneObjects.filter((o) => o.kind !== 'box');
    sceneObjects.push({
      id: nextObjId++,
      kind: 'box',
      left: GRID_BOX.left,
      top: GRID_BOX.top,
      w: GRID_BOX.w,
      h: GRID_BOX.h
    });
    selectedObjId = nextObjId - 1;
    stampKind = null;
    canvas.style.cursor = 'crosshair';
    pinOriginToBoxTopRight();
    syncBoxButton();
    draw();
  }

  function removeTheBox() {
    sceneObjects = sceneObjects.filter((o) => o.kind !== 'box');
    selectedObjId = null;
    origin = { x: paperOrigin.x, y: paperOrigin.y };
    syncBoxButton();
    draw();
  }

  function enterSlopeMode() {
    slopeMode = true;
    if (!hasBox()) placeCenterBox();
    axisAngle = slopeDeg;
    pinOriginToBoxTopRight();
    syncBoxButton();
    syncSlopeButton();
    updateUI();
  }

  function exitSlopeMode() {
    slopeMode = false;
    slopeDeg = 0;
    axisAngle = 0;
    if (hasBox()) pinOriginToBoxTopRight();
    syncBoxButton();
    syncSlopeButton();
    updateUI();
  }

  document.getElementById('stamp-box').addEventListener('click', () => {
    if (hasBox()) {
      removeTheBox();
      if (slopeMode) exitSlopeMode();
    } else {
      enterSlopeMode();
    }
  });

  document.getElementById('stamp-slope').addEventListener('click', () => {
    if (slopeMode) exitSlopeMode();
    else enterSlopeMode();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      stampKind = null;
      canvas.style.cursor = 'crosshair';
    }
  });

  window.resetView = function () {
    paperOrigin = { x: width / 2, y: height / 2 };
    origin = { x: width / 2, y: height / 2 };
    axisAngle = 0;
    slopeMode = false;
    slopeDeg = 0;
    lastAngleDeg = 45;
    setVectorFromRef(7.2, 45);
    angleRef = 'x';
    axisPolarity = 1;
    compStyle = 'origin';
    decompOrder = 'yx';
    sceneObjects = [];
    selectedObjId = null;
    stampKind = null;
    canvas.style.cursor = 'crosshair';
    enterSlopeMode();
  };

  function screenToLocal(screenX, screenY) {
    let dx = screenX - origin.x;
    let dy = screenY - origin.y;
    let rad = -axisAngle * Math.PI / 180;
    let localX = dx * Math.cos(rad) - dy * Math.sin(rad);
    let localY = dx * Math.sin(rad) + dy * Math.cos(rad);
    return { x: localX / scale, y: localY / scale };
  }

  function screenToPaper(screenX, screenY) {
    return {
      x: (screenX - paperOrigin.x) / scale,
      y: (screenY - paperOrigin.y) / scale
    };
  }

  function getPointerPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (width / rect.width),
      y: (clientY - rect.top) * (height / rect.height)
    };
  }

  function getMousePos(evt) {
    return getPointerPos(evt.clientX, evt.clientY);
  }

  function tipScreenPos() {
    let rad = axisAngle * Math.PI / 180;
    let tipLocalX = (vector.x / NEWTONS_PER_GRID) * scale;
    let tipLocalY = (vector.y / NEWTONS_PER_GRID) * scale;
    return {
      x: origin.x + (tipLocalX * Math.cos(rad) - tipLocalY * Math.sin(rad)),
      y: origin.y + (tipLocalX * Math.sin(rad) + tipLocalY * Math.cos(rad))
    };
  }

  function hitTestObject(pos) {
    const paper = screenToPaper(pos.x, pos.y);
    const local = paperToBoxLocal(paper.x, paper.y);
    for (let i = sceneObjects.length - 1; i >= 0; i--) {
      const o = sceneObjects[i];
      if (o.kind !== 'box') continue;
      if (
        local.x >= o.left && local.x <= o.left + o.w &&
        local.y >= o.top && local.y <= o.top + o.h
      ) return o;
    }
    return null;
  }

  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1e-6) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function isBoxInteriorPaper(px, py) {
    if (!hasBox()) return false;
    const b = GRID_BOX;
    const loc = paperToBoxLocal(px, py);
    return loc.x > b.left && loc.x < b.left + b.w && loc.y > b.top && loc.y < b.top + b.h;
  }

  function isBelowFloorPaper(px, py) {
    if (!hasBox()) return false;
    const loc = paperToBoxLocal(px, py);
    return loc.y > GRID_BOX.top + GRID_BOX.h;
  }

  function isIllegalOriginPaper(px, py) {
    return isBoxInteriorPaper(px, py) || isBelowFloorPaper(px, py);
  }

  function snapOriginToGrid(screenX, screenY) {
    const p = screenToPaper(screenX, screenY);
    let ix = Math.round(p.x);
    let iy = Math.round(p.y);
    if (isIllegalOriginPaper(ix, iy)) {
      let best = null;
      let bestD = Infinity;
      for (let dx = -8; dx <= 8; dx++) {
        for (let dy = -8; dy <= 8; dy++) {
          const x = ix + dx;
          const y = iy + dy;
          if (isIllegalOriginPaper(x, y)) continue;
          const d = (x - p.x) * (x - p.x) + (y - p.y) * (y - p.y);
          if (d < bestD) {
            bestD = d;
            best = { x, y };
          }
        }
      }
      if (best) {
        ix = best.x;
        iy = best.y;
      }
    }
    let ox = paperOrigin.x + ix * scale;
    let oy = paperOrigin.y + iy * scale;
    let bestDist = (ix - p.x) * (ix - p.x) + (iy - p.y) * (iy - p.y);

    if (slopeMode && hasBox()) {
      const corners = [
        boxLocalToPaper(GRID_BOX.left, GRID_BOX.top),
        boxLocalToPaper(GRID_BOX.left + GRID_BOX.w, GRID_BOX.top)
      ];
      for (const corner of corners) {
        const d = (corner.x - p.x) * (corner.x - p.x) + (corner.y - p.y) * (corner.y - p.y);
        if (d < bestDist) {
          bestDist = d;
          ox = paperOrigin.x + corner.x * scale;
          oy = paperOrigin.y + corner.y * scale;
        }
      }
    }

    origin.x = ox;
    origin.y = oy;
  }

  function beginDragAt(pos, forceOrigin) {
    selectedObjId = null;
    if (isForceZero()) {
      draw();
      return;
    }
    const distOrigin = Math.hypot(pos.x - origin.x, pos.y - origin.y);
    const tip = tipScreenPos();
    const distTip = Math.hypot(pos.x - tip.x, pos.y - tip.y);
    const distShaft = distToSegment(pos.x, pos.y, origin.x, origin.y, tip.x, tip.y);
    const grab = 16;

    if (distTip < grab) {
      isDraggingVector = true;
      isDraggingOrigin = false;
      return;
    }
    if (forceOrigin || distOrigin < grab || distShaft < grab) {
      isDraggingOrigin = true;
      isDraggingVector = false;
      snapOriginToGrid(pos.x, pos.y);
      draw();
      return;
    }

    const hit = hitTestObject(pos);
    if (hit) {
      selectedObjId = hit.id;
      isDraggingObject = false;
      isDraggingVector = false;
      isDraggingOrigin = false;
      draw();
      return;
    }
    draw();
  }

  function moveDragAt(pos) {
    if (isDraggingObject && selectedObjId != null) {
      const o = sceneObjects.find((x) => x.id === selectedObjId);
      if (o) {
        o.x = pos.x - objDragOff.x;
        o.y = pos.y - objDragOff.y;
        draw();
      }
    } else if (isDraggingOrigin) {
      snapOriginToGrid(pos.x, pos.y);
      draw();
    } else if (isDraggingVector) {
      const local = screenToLocal(pos.x, pos.y);
      vector.x = Math.max(-40, Math.min(40, local.x * NEWTONS_PER_GRID));
      vector.y = Math.max(-40, Math.min(40, local.y * NEWTONS_PER_GRID));
      lastAngleDeg = getAngleFromRef();
      updateUI();
    }
  }

  function endDrag() {
    isDraggingVector = false;
    isDraggingOrigin = false;
    isDraggingObject = false;
  }

  canvas.addEventListener('mousedown', (e) => {
    beginDragAt(getMousePos(e), e.button === 2 || e.shiftKey);
  });
  canvas.addEventListener('mousemove', (e) => moveDragAt(getMousePos(e)));
  window.addEventListener('mouseup', endDrag);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    e.preventDefault();
    const touch = e.touches[0];
    beginDragAt(getPointerPos(touch.clientX, touch.clientY), false);
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    if (!isDraggingOrigin && !isDraggingVector && !isDraggingObject) return;
    e.preventDefault();
    const touch = e.touches[0];
    moveDragAt(getPointerPos(touch.clientX, touch.clientY));
  }, { passive: false });
  canvas.addEventListener('touchend', endDrag);
  canvas.addEventListener('touchcancel', endDrag);

  // --- Drawing ---

  function drawBackground(c) {
    if (!bgImage) return;
    const hRatio = width / bgImage.width;
    const vRatio = height / bgImage.height;
    const ratio = Math.min(hRatio, vRatio);
    const centerShift_x = (width - bgImage.width * ratio) / 2;
    const centerShift_y = (height - bgImage.height * ratio) / 2;
    c.save();
    c.globalAlpha = 0.5;
    c.drawImage(bgImage, 0, 0, bgImage.width, bgImage.height,
      centerShift_x, centerShift_y, bgImage.width * ratio, bgImage.height * ratio);
    c.restore();
  }

  function drawSceneObject(c, o) {
    if (o.kind !== 'box') return;
    const x = o.left * scale;
    const y = o.top * scale;
    const w = o.w * scale;
    const h = o.h * scale;
    c.save();
    const fill = c.createLinearGradient(x, y, x + w, y + h);
    fill.addColorStop(0, '#d4b896');
    fill.addColorStop(0.45, '#c4a574');
    fill.addColorStop(1, '#a67c52');
    c.fillStyle = fill;
    c.fillRect(x, y, w, h);
    c.save();
    c.beginPath();
    c.rect(x, y, w, h);
    c.clip();
    c.strokeStyle = 'rgba(120, 80, 40, 0.18)';
    c.lineWidth = 1;
    for (let gx = x + 8; gx < x + w; gx += 10) {
      c.beginPath();
      c.moveTo(gx, y);
      c.lineTo(gx - 6, y + h);
      c.stroke();
    }
    c.restore();
    c.strokeStyle = '#6b4423';
    c.lineWidth = 2.5;
    c.strokeRect(x, y, w, h);
    c.restore();
  }

  function drawSmoothFloor(c) {
    if (!hasBox()) return;
    const piv = boxLocalToScreen(0, GRID_BOX.top + GRID_BOX.h);
    const ang = currentSlopeDeg() * Math.PI / 180;
    const ext = Math.max(width, height) * 3;
    const dx = Math.cos(ang);
    const dy = Math.sin(ang);
    const nx = -Math.sin(ang);
    const ny = Math.cos(ang);
    const x1 = piv.x - dx * ext;
    const y1 = piv.y - dy * ext;
    const x2 = piv.x + dx * ext;
    const y2 = piv.y + dy * ext;
    c.save();
    resetLogicalTransform();
    c.beginPath();
    c.moveTo(x1, y1);
    c.lineTo(x2, y2);
    c.lineTo(x2 + nx * ext, y2 + ny * ext);
    c.lineTo(x1 + nx * ext, y1 + ny * ext);
    c.closePath();
    c.fillStyle = '#f1f5f9';
    c.fill();
    c.strokeStyle = '#94a3b8';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x1, y1);
    c.lineTo(x2, y2);
    c.stroke();
    c.strokeStyle = 'rgba(100,116,139,0.45)';
    c.lineWidth = 1;
    for (let s = -ext; s < ext; s += 18) {
      const fx = piv.x + dx * s;
      const fy = piv.y + dy * s;
      c.beginPath();
      c.moveTo(fx + nx * 6, fy + ny * 6);
      c.lineTo(fx + nx * 18 - dx * 8, fy + ny * 18 - dy * 8);
      c.stroke();
    }
    let fx;
    let fy;
    if (Math.abs(dx) > 0.05) {
      const t = (16 - piv.x) / dx;
      fx = 16;
      fy = piv.y + t * dy;
    } else {
      fx = piv.x;
      fy = Math.min(height - 40, Math.max(40, piv.y));
    }
    const labelX = fx + nx * 34;
    const labelY = fy + ny * 34;
    c.translate(labelX, labelY);
    c.rotate(ang);
    c.fillStyle = '#0f172a';
    c.font = '800 16px Plus Jakarta Sans, system-ui, sans-serif';
    c.textAlign = 'left';
    c.textBaseline = 'alphabetic';
    c.fillText(t().smoothFloor, 0, 0);
    c.restore();
  }

  function drawSlopeHorizontalArc(c) {
    if (!hasBox() || !slopeMode) return;
    const phi = Math.abs(slopeDeg);
    if (phi < 1) return;
    const piv = boxLocalToScreen(0, GRID_BOX.top + GRID_BOX.h);
    const ang = currentSlopeDeg() * Math.PI / 180;
    const dx = Math.cos(ang);
    const dy = Math.sin(ang);
    const PHI = '#1e3a8a';
    let ax;
    let ay;
    let needHoriz = false;
    if (Math.abs(dy) > 0.08) {
      const t = (height - piv.y) / dy;
      const x = piv.x + dx * t;
      if (x >= 0 && x <= width) {
        ax = x;
        ay = height;
      }
    }
    if (ax == null) {
      needHoriz = true;
      const edgeX = slopeDeg > 0 ? width : 0;
      if (Math.abs(dx) < 0.08) return;
      const t = (edgeX - piv.x) / dx;
      ax = edgeX;
      ay = Math.max(0, Math.min(height, piv.y + dy * t));
    }

    const floorAng = Math.atan2(piv.y - ay, piv.x - ax);
    const horizAng = (piv.x - ax) < 0 ? Math.PI : 0;
    let diff = floorAng - horizAng;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;

    c.save();
    resetLogicalTransform();
    const r = scale;
    const hdir = (piv.x - ax) < 0 ? -1 : 1;
    c.strokeStyle = PHI;
    if (needHoriz) {
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(ax, ay);
      c.lineTo(ax + hdir * (r + 8), ay);
      c.stroke();
    }
    c.lineWidth = 2.5;
    c.beginPath();
    c.arc(ax, ay, r, horizAng, floorAng, diff < 0);
    c.stroke();
    const midRad = horizAng + diff / 2;
    const lx = ax + (r + 12) * Math.cos(midRad);
    const ly = ay + (r + 12) * Math.sin(midRad);
    drawSmartLabel(c, `φ = ${phi.toFixed(1)}°`, lx, ly, hdir < 0 ? 'right' : 'left', 'middle', PHI, 0);
    c.restore();
  }

  function drawWeightArrow(c) {
    if (!hasBox()) return;
    const mid = boxLocalToScreen(GRID_BOX.left + GRID_BOX.w / 2, GRID_BOX.top + GRID_BOX.h / 2);
    const tipX = mid.x;
    const tipY = mid.y + 5 * scale;
    c.save();
    resetLogicalTransform();
    drawArrow(c, mid.x, mid.y, tipX, tipY, '#111', 4, false);
    drawSmartLabel(c, 'W', tipX, tipY + 18, 'center', 'top', '#111');
    c.restore();
  }

  function drawWeightComponents(c) {
    if (!hasBox() || !slopeMode) return;
    const phi = Math.abs(slopeDeg);
    if (phi < 1) return;
    const phiRad = phi * Math.PI / 180;
    const wLen = 5;
    const cosLen = wLen * Math.cos(phiRad);
    const sinLen = wLen * Math.sin(phiRad);
    const sign = slopeDeg >= 0 ? 1 : -1;
    const cx = GRID_BOX.left + GRID_BOX.w / 2;
    const cy = GRID_BOX.top + GRID_BOX.h / 2;
    const mid = boxLocalToScreen(cx, cy);
    const cosTip = boxLocalToScreen(cx, cy + cosLen);
    const sinTip = boxLocalToScreen(cx + sign * sinLen, cy);
    const turn = currentSlopeDeg();
    const GREEN = '#14532d';

    c.save();
    resetLogicalTransform();
    drawArrow(c, mid.x, mid.y, cosTip.x, cosTip.y, GREEN, 2.5, false);
    drawArrow(c, mid.x, mid.y, sinTip.x, sinTip.y, GREEN, 2.5, false);

    function beyondTip(from, to, extra) {
      const vx = to.x - from.x;
      const vy = to.y - from.y;
      const len = Math.hypot(vx, vy) || 1;
      return { x: to.x + extra * vx / len, y: to.y + extra * vy / len };
    }
    const cosLab = beyondTip(mid, cosTip, 16);
    drawSmartLabel(c, 'W cos φ', cosLab.x, cosLab.y, 'center', 'middle', GREEN, turn);
    const svx = sinTip.x - mid.x;
    const svy = sinTip.y - mid.y;
    const slen = Math.hypot(svx, svy) || 1;
    const past = 16;
    let shaftAng = Math.atan2(svy, svx);
    let align = 'left';
    if (Math.cos(shaftAng) < 0) {
      shaftAng += Math.PI;
      align = 'right';
    }
    c.save();
    resetLogicalTransform();
    c.font = 'bold 14px system-ui, sans-serif';
    c.fillStyle = GREEN;
    c.textAlign = align;
    c.textBaseline = 'middle';
    c.translate(sinTip.x + past * svx / slen, sinTip.y + past * svy / slen);
    c.rotate(shaftAng);
    c.fillText('W sin φ', 0, 0);
    c.restore();
    c.restore();
  }

  function drawNormalArrow(c) {
    if (!hasBox()) return;
    const phi = slopeMode ? Math.abs(slopeDeg) : 0;
    const wCos = 5 * Math.cos(phi * Math.PI / 180);
    const nSquares = wCos + vector.y / NEWTONS_PER_GRID;
    if (nSquares < 0.05) return;
    const nx = GRID_BOX.left + GRID_BOX.w / 2 - 0.5;
    const floorY = GRID_BOX.top + GRID_BOX.h;
    const tail = boxLocalToScreen(nx, floorY);
    const tip = boxLocalToScreen(nx, floorY - nSquares);
    c.save();
    resetLogicalTransform();
    drawArrow(c, tail.x, tail.y, tip.x, tip.y, '#7c3aed', 4, false);
    const vx = tip.x - tail.x;
    const vy = tip.y - tail.y;
    const len = Math.hypot(vx, vy) || 1;
    drawSmartLabel(c, 'N', tip.x + 10 * vx / len, tip.y + 10 * vy / len, 'center', 'bottom', '#7c3aed', currentSlopeDeg());
    c.restore();
  }

  function drawArrow(c, fromX, fromY, toX, toY, color, lineW, dashed) {
    const headLen = 14;
    const angle = Math.atan2(toY - fromY, toX - fromX);
    const inset = headLen * Math.cos(Math.PI / 6);
    const backX = toX - inset * Math.cos(angle);
    const backY = toY - inset * Math.sin(angle);
    c.beginPath();
    c.lineWidth = lineW;
    c.lineCap = 'butt';
    c.strokeStyle = color;
    c.fillStyle = color;
    if (dashed) c.setLineDash([5, 5]); else c.setLineDash([]);
    c.moveTo(fromX, fromY); c.lineTo(backX, backY); c.stroke();
    c.setLineDash([]);
    c.beginPath();
    c.moveTo(toX, toY);
    c.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
    c.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
    c.closePath();
    c.fill();
  }

  function isIntersecting(r1, r2) {
    return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
  }

  function drawSmartLabel(c, text, x, y, align, baseline, color = "#444", rotDeg = 0) {
    c.save();
    resetLogicalTransform();
    c.font = "bold 14px system-ui, sans-serif";
    if (rotDeg) {
      c.fillStyle = color;
      c.textAlign = align === "right" ? "right" : align === "center" ? "center" : "left";
      c.textBaseline = baseline === "middle" ? "middle" : baseline === "bottom" ? "bottom" : "top";
      c.translate(x, y);
      c.rotate(rotDeg * Math.PI / 180);
      c.fillText(text, 0, 0);
      c.restore();
      return;
    }
    c.textAlign = "left";
    c.textBaseline = "top";

    const metrics = c.measureText(text);
    const textWidth = metrics.width;
    const textHeight = 14;
    const padding = 4;

    let boxX = x;
    let boxY = y;
    if (align === "right") boxX = x - textWidth;
    else if (align === "center") boxX = x - textWidth / 2;
    if (baseline === "middle") boxY = y - textHeight / 2;
    else if (baseline === "bottom") boxY = y - textHeight;

    let box = { x: boxX - padding, y: boxY - padding, w: textWidth + padding * 2, h: textHeight + padding * 2 };
    let attempts = 0;
    let overlapFound = true;
    while (overlapFound && attempts < 10) {
      overlapFound = false;
      for (let other of drawnLabels) {
        if (isIntersecting(box, other)) {
          overlapFound = true;
          box.y = other.y + other.h + 2;
          break;
        }
      }
      attempts++;
    }
    drawnLabels.push(box);
    c.fillStyle = color;
    c.fillText(text, box.x + padding, box.y + padding);
    c.restore();
  }

  function drawGrid(c) {
    if (!showGrid) return;
    const gridSize = 40;
    c.strokeStyle = 'rgba(0,0,0,0.12)';
    c.lineWidth = 1;
    for (let i = -gridSize; i <= gridSize; i++) {
      c.beginPath(); c.moveTo(i * scale, -gridSize * scale); c.lineTo(i * scale, gridSize * scale); c.stroke();
      c.beginPath(); c.moveTo(-gridSize * scale, i * scale); c.lineTo(gridSize * scale, i * scale); c.stroke();
    }
  }

  function drawAngle(c, tipX, tipY) {
    if (isForceOnAxis()) return;
    const radius = scale;
    const mathAngle = Math.atan2(tipY, tipX);
    c.beginPath();
    c.strokeStyle = '#f39c12';
    c.lineWidth = 2.5;
    const deg = lastAngleDeg;
    let startAngle = (deg <= 90 || deg > 270) ? 0 : Math.PI;
    if (startAngle === Math.PI && mathAngle < 0) startAngle = -Math.PI;

    let diff = mathAngle - startAngle;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    c.arc(0, 0, radius, startAngle, mathAngle, diff < 0);
    c.stroke();

    let midRad = startAngle + diff / 2;
    const labelRadius = radius + 8;
    const lx = labelRadius * Math.cos(midRad);
    const ly = labelRadius * Math.sin(midRad);
    let rad = axisAngle * Math.PI / 180;
    let gx = origin.x + (lx * Math.cos(rad) - ly * Math.sin(rad));
    let gy = origin.y + (lx * Math.sin(rad) + ly * Math.cos(rad));
    const theta = angleToHorizontal(lastAngleDeg);
    const q2q3 = lastAngleDeg > 90 && lastAngleDeg < 270;
    c.save();
    resetLogicalTransform();
    c.font = 'bold 14px system-ui, sans-serif';
    c.fillStyle = '#f39c12';
    c.textAlign = q2q3 ? 'right' : 'left';
    c.textBaseline = 'middle';
    c.translate(gx, gy);
    c.rotate(currentSlopeDeg() * Math.PI / 180);
    c.fillText(`θ = ${theta.toFixed(1)}°`, q2q3 ? -6 : 6, 0);
    c.restore();
  }

  function drawLabels(c, tipX, tipY) {
    let rad = axisAngle * Math.PI / 180;
    function localToGlobal(lx, ly) {
      return {
        x: origin.x + (lx * Math.cos(rad) - ly * Math.sin(rad)),
        y: origin.y + (lx * Math.sin(rad) + ly * Math.cos(rad))
      };
    }
    function beyond(from, to, extra) {
      const vx = to.x - from.x;
      const vy = to.y - from.y;
      const len = Math.hypot(vx, vy) || 1;
      return { x: to.x + extra * vx / len, y: to.y + extra * vy / len };
    }
    const originG = { x: origin.x, y: origin.y };
    const cosTip = localToGlobal(tipX, 0);
    const sinTip = localToGlobal(0, tipY);
    const mag = Math.hypot(vector.x, vector.y);
    const tipLen = Math.hypot(tipX, tipY) || 1;
    const gR = localToGlobal(tipX + 18 * tipX / tipLen, tipY + 18 * tipY / tipLen);
    const q2q3 = lastAngleDeg > 90 && lastAngleDeg < 270;
    const fAlign = q2q3 ? "right" : "left";
    const RED = "#e74c3c";
    const past = 16;

    c.save();
    resetLogicalTransform();
    const turn = currentSlopeDeg();
    if (!isForceOnAxis()) {
      const sinLab = beyond(originG, sinTip, past);
      drawSmartLabel(c, "F sin θ", sinLab.x, sinLab.y, "center", "middle", RED, turn);

      const cvx = cosTip.x - originG.x;
      const cvy = cosTip.y - originG.y;
      const clen = Math.hypot(cvx, cvy) || 1;
      let shaftAng = Math.atan2(cvy, cvx);
      let align = "left";
      if (Math.cos(shaftAng) < 0) {
        shaftAng += Math.PI;
        align = "right";
      }
      c.save();
      resetLogicalTransform();
      c.font = "bold 14px system-ui, sans-serif";
      c.fillStyle = RED;
      c.textAlign = align;
      c.textBaseline = "middle";
      c.translate(cosTip.x + past * cvx / clen, cosTip.y + past * cvy / clen);
      c.rotate(shaftAng);
      c.fillText("F cos θ", 0, 0);
      c.restore();
    }
    drawSmartLabel(c, `F = ${mag.toFixed(1)} N`, gR.x, gR.y, fAlign, "middle", "#2563eb", turn);
    c.restore();
  }

  function drawComponents(c, tipX, tipY) {
    if (compStyle === 'head-to-tail') {
      if (decompOrder === 'xy') {
        drawArrow(c, 0, 0, tipX, 0, '#e74c3c', 2.5, false);
        drawArrow(c, tipX, 0, tipX, tipY, '#e74c3c', 2.5, false);
      } else {
        drawArrow(c, 0, 0, 0, tipY, '#e74c3c', 2.5, false);
        drawArrow(c, 0, tipY, tipX, tipY, '#e74c3c', 2.5, false);
      }
    } else {
      drawArrow(c, 0, 0, tipX, 0, '#e74c3c', 2.5, false);
      drawArrow(c, 0, 0, 0, tipY, '#e74c3c', 2.5, false);
    }
  }

  function draw() {
    drawnLabels = [];
    resetLogicalTransform();
    ctx.clearRect(0, 0, width, height);

    drawBackground(ctx);

    ctx.translate(paperOrigin.x, paperOrigin.y);
    drawGrid(ctx);
    resetLogicalTransform();
    drawSmoothFloor(ctx);
    drawSlopeHorizontalArc(ctx);
    ctx.translate(paperOrigin.x, paperOrigin.y);
    const slopeRad = currentSlopeDeg() * Math.PI / 180;
    if (slopeRad) {
      ctx.translate(0, (GRID_BOX.top + GRID_BOX.h) * scale);
      ctx.rotate(slopeRad);
      ctx.translate(0, -(GRID_BOX.top + GRID_BOX.h) * scale);
    }
    sceneObjects.forEach((o) => drawSceneObject(ctx, o));

    resetLogicalTransform();
    drawWeightArrow(ctx);
    drawWeightComponents(ctx);
    drawNormalArrow(ctx);

    if (!isForceZero()) {
      resetLogicalTransform();
      ctx.translate(origin.x, origin.y);
      ctx.rotate(axisAngle * Math.PI / 180);

      const tipX = (vector.x / NEWTONS_PER_GRID) * scale;
      const tipY = (vector.y / NEWTONS_PER_GRID) * scale;

      drawAngle(ctx, tipX, tipY);
      if (!isForceOnAxis()) drawComponents(ctx, tipX, tipY);
      drawArrow(ctx, 0, 0, tipX, tipY, '#4a90e2', 4, false);
      drawLabels(ctx, tipX, tipY);

      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fillStyle = "#333";
      ctx.fill();
    }
  }

  window.addEventListener('resize', () => {
    const pox = paperOrigin.x / width;
    const poy = paperOrigin.y / height;
    const ox = origin.x / width;
    const oy = origin.y / height;
    fitCanvas();
    paperOrigin.x = pox * width;
    paperOrigin.y = poy * height;
    if (hasBox()) pinOriginToBoxTopRight();
    else {
      origin.x = ox * width;
      origin.y = oy * height;
    }
    draw();
  });

  updateLanguageUI();
  fitCanvas();
  paperOrigin = { x: width / 2, y: height / 2 };
  origin = { x: width / 2, y: height / 2 };
  setVectorFromRef(7.2, 45);
  enterSlopeMode();
})();
</script>
</body>
