  <style>
/* S3_Phy embed mode — shared chrome for iframe labs inside Hub */

html.s3phy-embed {
  font-family: var(--s3-font);
  font-size: var(--s3-font-size-base);
  line-height: var(--s3-line-height);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}

html.s3phy-embed:has(.lab-section) {
  height: 100%;
}

html.s3phy-embed body {
  font-family: var(--s3-font);
  font-size: max(var(--s3-font-min), 1rem);
  line-height: var(--s3-line-height);
  margin: 0;
}

/* Interactive lab iframe — flex fill (not quiz/worksheet) */
html.s3phy-embed body:has(.lab-section),
html.s3phy-embed body.embed-mode:has(.sim-main-col),
html.s3phy-embed body:has(.sim-main-col):not(:has(#quiz-layout)) {
  height: 100%;
  min-height: 0 !important;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

html.s3phy-embed body:has(.lab-section) > main,
html.s3phy-embed body.embed-mode main.flex-grow,
html.s3phy-embed body:has(.sim-main-col):not(:has(#quiz-layout)) > main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  width: 100%;
  overflow: hidden;
}

/* Quiz / worksheet iframe — preserve two-column grid */
html.s3phy-embed body:has(#quiz-layout) {
  height: auto;
  min-height: 100%;
  display: block;
  overflow: auto;
}

html.s3phy-embed #quiz-layout {
  display: grid !important;
  grid-template-columns: 1fr;
  gap: 1.5rem;
  max-width: none !important;
  width: 100%;
  margin: 0;
  align-items: start;
  box-sizing: border-box;
}

@media (min-width: 1101px) {
  html.s3phy-embed #quiz-layout {
    grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  }
}

@media (max-width: 1100px) {
  html.s3phy-embed #quiz-layout > aside#settings-panel {
    position: static;
    max-height: min(42dvh, 420px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
}

html.s3phy-embed #quiz-layout > aside#settings-panel {
  position: sticky;
  top: 0.5rem;
  align-self: start;
  max-height: calc(100dvh - 1rem);
  overflow-y: auto;
}

html.s3phy-embed #quiz-layout > .min-w-0 {
  min-width: 0;
  width: 100%;
}

html.s3phy-embed .lab-section {
  flex: 1 1 auto;
  min-height: 0 !important;
  height: 100%;
  align-content: stretch;
  align-items: stretch;
}

html.s3phy-embed .lab-viz,
html.s3phy-embed .lab-steps {
  height: 100% !important;
  min-height: 0;
  max-height: none !important;
}

html.s3phy-embed .lab-viz {
  display: flex;
  flex-direction: column;
}

html.s3phy-embed .lab-viz-canvas {
  flex: 1 1 auto;
  min-height: 200px;
  max-height: none !important;
}

html.s3phy-embed .lab-steps {
  overflow-y: auto;
}

html.s3phy-embed .lab-viz.lab-viz-dual {
  display: grid !important;
  height: 100% !important;
}

html.s3phy-embed .lab-viz-dual {
  max-height: none !important;
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
  align-content: stretch;
  overflow: hidden;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel-chart {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel:first-child .lab-viz-canvas {
  flex: 1 1 auto !important;
  min-height: 120px !important;
  max-height: none !important;
  aspect-ratio: unset;
  height: auto;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel-chart .lab-viz-chart-wrap {
  flex: 1 1 auto;
  min-height: 0;
  height: auto !important;
  margin-top: 0;
  aspect-ratio: unset;
}

html.s3phy-embed .lab-viz-dual .lab-viz-panel {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

html.s3phy-embed header,
html.s3phy-embed footer {
  flex-shrink: 0;
}

html.s3phy-embed .max-w-7xl {
  max-width: none;
  width: 100%;
}

html.s3phy-embed .sim-main-col,
html.s3phy-embed .glass-panel.flex-grow {
  flex: 1 1 auto;
  min-height: 0;
}

html.s3phy-embed .canvas-container {
  flex: 1 1 auto;

  height: auto !important;
  max-height: none;
}

html.s3phy-embed .main-container,
html.s3phy-embed .lab-wrap,
html.s3phy-embed .dashboard,
html.s3phy-embed .app-root {
  max-width: none;

}

/* Floating controls panel (heat labs + shared script) */
.lab-section {
  position: relative;
  min-height: 0;
}

@media (min-width: 768px) {
  /* Keep grid items as 2 parallel columns at >= 768px */

.lab-controls.lab-controls-float {

.lab-controls-body {

}

.lab-controls-desc {

}

.lab-controls.controls-collapsed .lab-controls-body,

.lab-controls:not(.controls-collapsed) .lab-controls-body {

}

.lab-controls:not(.controls-collapsed) .lab-controls-desc {
  opacity: 1;

}

.lab-controls.controls-collapsed .lab-controls-title-text {

}

.lab-controls-header {
  display: flex;

}

.lab-controls-actions {
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 0.5rem;
  width: 100%;
}

.lab-controls-actions button {
  padding: 0.625rem 0.75rem;
  justify-content: center;
}

.lab-controls-actions button:not(.flex-1) {
  flex-shrink: 0;
}

.lab-controls-actions button.flex-1 {
  white-space: nowrap;
  min-width: max-content;
}

.lab-controls-drag-handle {
  display: none;
  cursor: grab;
  touch-action: none;
  color: #94a3b8;
  padding: 0.25rem;
  border-radius: 0.375rem;
  flex-shrink: 0;
  background: none;
  border: none;
}

@media (min-width: 900px) {
  .lab-controls.lab-controls-float .lab-controls-drag-handle {
    display: flex;
    align-items: center;
    justify-content: center;
  }
}

.lab-controls-drag-handle:active {
  cursor: grabbing;
}

/* Hub iframe — standalone labs (rotating-mirror, rgb, thermometer) */
html.s3phy-embed:has(#app > .rml),
html.s3phy-embed:has(#app > .rgb-mixer),
html.s3phy-embed:has(#app > .tl-wrap) {

html.s3phy-embed body:has(#app > .rml),

html.s3phy-embed .rml,
html.s3phy-embed .rgb-mixer,
html.s3phy-embed .tl-wrap {

}

html.s3phy-embed .rml .rml-head,
html.s3phy-embed .tl-wrap .tl-head {

}

html.s3phy-embed .tl-wrap .tl-dash,

html.s3phy-embed .tl-wrap--faulty-cal .tl-faulty-hero {

html.s3phy-embed .tl-wrap--faulty-cal .tl-controls {

html.s3phy-embed .rgb-mixer {

html.s3phy-embed .rgb-mixer-body {

html.s3phy-embed .rgb-mixer-stage {

html.s3phy-embed .rgb-mixer-canvas {

}

html.s3phy-embed .rgb-mixer-controls {

}

/* Lens simulator embed compact chrome */
html.s3phy-embed .controls-panel,
html.s3phy-embed .control-panel {
  width: var(--s3-float-panel-w) !important;
  max-width: var(--s3-float-panel-w) !important;
}

/* Minimum readable text in embed controls */
html.s3phy-embed label,
html.s3phy-embed .control label,
html.s3phy-embed button,

/* Height adaptive scaling for compact/low-height viewports (height < 720px) */

/* Floating fullscreen — universal control for standalone labs */
.s3phy-fs-btn {
  position: fixed;
  top: max(16px, env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: auto;
  z-index: 2147483646;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border: 1px solid rgba(148, 163, 184, 0.5);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.97);
  color: #0f172a;
  font-family: var(--s3-font, system-ui, sans-serif);
  font-size: 0.82rem;
  font-weight: 700;
  line-height: 1.2;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(15, 23, 42, 0.2);
  pointer-events: auto;
}

.s3phy-fs-btn:hover {
  background: #ffffff;
  border-color: #64748b;
}

.s3phy-fs-btn:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}

.s3phy-fs-btn--active {
  background: #0f172a;
  color: #f8fafc;
  border-color: #334155;
}

.s3phy-fs-btn--active:hover {
  background: #1e293b;
  border-color: #475569;
}

.s3phy-fs-btn__icon {
  font-size: 1.05rem;
  line-height: 1;
}

.s3phy-fs-btn__icon.material-symbols-outlined {
  font-size: 1.15rem;
}

/* Per-lab fullscreen controls replaced by universal button */
#fullscreen-btn,
#fullscreenBtn,
.el-fs-btn,
[data-fullscreen],
.tl-fullscreen-btn {
  display: none !important;
}


html, body { margin: 0; padding: 0; background: #f8f9fa; }
#app { padding: 8px; }

.lang-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  padding: 0;
  background: transparent;
  border: none;
  flex-shrink: 0;
}

.lang-btn {
  background: transparent;
  border: 1px solid #e8eaed;
  color: #6b7280;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.lang-btn:hover {
  border-color: #cbd5e1;
  color: #1a1c2c;
}

.lang-btn.active {
  background: #2563eb;
  border-color: #2563eb;
  color: #ffffff;
}

html.s3phy-embed .lang-bar {
  display: none !important;
}

html.s3phy-embed,
html.s3phy-embed body {
  height: auto !important;
  min-height: 100% !important;
  overflow-y: auto !important;
  background: #f8f9fa;
}
html.s3phy-embed #app {
  padding: 4px;
  height: auto !important;
  min-height: 100% !important;
  box-sizing: border-box;
}

.tirlab {
  --tirlab-bg: #f8f9fa;
  --tirlab-panel: #ffffff;
  --tirlab-border: #e8eaed;
  --tirlab-green: #16a34a;
  --tirlab-cyan: #0891b2;
  --tirlab-yellow: #ca8a04;
  --tirlab-text: #1a1c2c;
  --tirlab-muted: #6b7280;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--tirlab-text);
  background: var(--tirlab-bg);
  border-radius: 12px;
  padding: 12px;
  max-width: 100%;
  box-sizing: border-box;
}
.tirlab * { box-sizing: border-box; }
.tirlab-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  margin: 0 0 10px;
  min-height: 0;
}
.tirlab-head-main {
  grid-column: 2;
  text-align: center;
}
.tirlab-head .lang-bar {
  grid-column: 3;
  justify-self: end;
  flex-wrap: wrap;
}
.tirlab-title {
  margin: 0;
  font-weight: 800;
  font-size: 1.35rem;
  background: linear-gradient(90deg, #2563eb, #16a34a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.tirlab-sub { color: var(--tirlab-muted); font-size: 0.82rem; margin-top: 4px; }

html.s3phy-embed .tirlab-head {
  display: none;
}
html.s3phy-embed .tirlab {
  padding: 4px;
}
html.s3phy-embed .tirlab-viz {
  padding: 6px;
}
.tirlab-dash {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  align-items: stretch;
}
.tirlab-viz {
  position: relative;
  width: 100%;
  background: var(--tirlab-panel);
  padding: 10px;
  border-radius: 16px;
  border: 1px solid var(--tirlab-border);
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 2px 12px rgba(26, 28, 44, 0.04);
}

.tirlab-mode-toggle {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 12;
  display: inline-flex;
  gap: 0;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid var(--tirlab-border);
  border-radius: 999px;
  padding: 3px;
  box-shadow: 0 2px 10px rgba(26, 28, 44, 0.08);
}

.tirlab-mode-btn {
  border: none;

  <script>
    (function () {
      var params = new URLSearchParams(location.search);

<body>
  <div id="app"></div>
  <script>
(() => {
  // labs/tir-escape/js/app.js
  var N_GLASS = 1.5;
  var N_AIR = 1;
  var DEFAULTS = { angle: 30, fromBottom: true };
  var CRITICAL_BAND = 0.05;
  function initTirEscapeLab(root2, t) {
    const params = new URLSearchParams(location.search);
    function clampNum(raw, fallback, min, max) {
      const n = parseFloat(raw);
      if (!Number.isFinite(n)) return fallback;
      return Math.max(min, Math.min(max, n));
    }
    const n1Val = N_GLASS;
    const n2Val = N_AIR;
    let theta1Deg = Math.round(clampNum(params.get("angle"), DEFAULTS.angle, 0, 90) * 10) / 10;
    let incidentFromBottom = DEFAULTS.fromBottom;
    document.title = t("tools.tir.title");
    const wrap = document.createElement("div");
    wrap.className = "tirlab";
    wrap.innerHTML = `
    <div class="tirlab-head">
      <div class="tirlab-head-main">
        <h2 class="tirlab-title">${t("tools.tir.title")}</h2>
        <div class="tirlab-sub">${t("tools.tir.subtitle")}</div>
      </div>
      <div class="lang-bar">
        <button type="button" class="lang-btn" data-set-lang="en">English</button>
        <button type="button" class="lang-btn" data-set-lang="zh">\u7E41\u9AD4\u4E2D\u6587</button>
      </div>
    </div>
    <div class="tirlab-dash">
      <div class="tirlab-viz">
        <div class="tirlab-mode-toggle">
          <button type="button" class="tirlab-mode-btn active" data-dir="up">${t("tools.tir.dirUp")}</button>
          <button type="button" class="tirlab-mode-btn" data-dir="down">${t("tools.tir.dirDown")}</button>
        </div>
        <canvas id="simCanvas" class="tirlab-canvas" width="800" height="480" aria-label="${t("tools.tir.title")}"></canvas>

        <div class="tirlab-medium-tag tirlab-medium-tag--air">${t("tools.tir.canvas.air")}  n\u2082 = ${formatN(n2Val)}</div>
        <div class="tirlab-medium-tag tirlab-medium-tag--glass">${t("tools.tir.canvas.glass")}  n\u2081 = ${formatN(n1Val)}</div>

        <div class="tirlab-canvas-hud-stack tirlab-canvas-hud-stack--right">
          <div class="tirlab-canvas-hud tirlab-canvas-hud--angle">
            <div class="tirlab-hud-label">${t("tools.tir.angleI")}</div>
            <div class="tirlab-slider-row">
              <input type="range" id="angle-slider" data-angle-slider min="0" max="90" step="0.1" value="${theta1Deg.toFixed(1)}" aria-label="theta1" />
              <input type="number" data-angle-input min="0" max="90" step="0.1" value="${theta1Deg.toFixed(1)}" class="tirlab-num-input" />
            </div>
            <strong class="tirlab-n-live" data-angle hidden>${theta1Deg.toFixed(1)}\xB0</strong>
          </div>

          <div class="tirlab-canvas-hud tirlab-canvas-hud--critical">
            <div class="tirlab-hud-label" data-critical-label>${t("tools.tir.critical")}</div>
            <div class="tirlab-sr" data-critical-row>
              <span class="tirlab-sv" data-critical>\u2014</span>
            </div>
            <div class="tirlab-hud-actions">
              <button type="button" id="btn-set-critical" class="tirlab-set-c" data-set-critical>${t("tools.tir.setCritical")}</button>
              <button type="button" class="tirlab-reset tirlab-reset--compact" data-reset>${t("tools.tir.reset")}</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  `;
    const canvas = (
      /** @type {HTMLCanvasElement} */
      wrap.querySelector("#simCanvas")
    );
    const ctx = (
      /** @type {CanvasRenderingContext2D} */
      canvas.getContext("2d")
    );
    const angleSlider = (
      /** @type {HTMLInputElement} */
      wrap.querySelector("[data-angle-slider]")
    );
    const angleInput = (
      /** @type {HTMLInputElement} */
      wrap.querySelector("[data-angle-input]")
    );
    const angleEl = wrap.querySelector("[data-angle]");
    const critHud = wrap.querySelector(".tirlab-canvas-hud--critical");
    const critEl = wrap.querySelector("[data-critical]");
    const critLabel = wrap.querySelector("[data-critical-label]");
    const setCritBtn = (
      /** @type {HTMLButtonElement} */
      wrap.querySelector("[data-set-critical]")
    );
    const COLOR_INCIDENT = "#b45309";
    const COLOR_REFRACTED = "#0e7490";
    const COLOR_REFLECTED = "#b91c1c";
    const COLOR_CRITICAL = "#ca8a04";
    const COLOR_AXIS = "#374151";
    const COLOR_LABEL = "#1a1c2c";
    function toRad(deg) {
      return deg * Math.PI / 180;
    }
    function toDeg(rad) {
      return rad * 180 / Math.PI;
    }
    function formatN(n) {
      return n.toFixed(2);
    }
    function getOptics() {
      const nI = incidentFromBottom ? n1Val : n2Val;
      const nT = incidentFromBottom ? n2Val : n1Val;
      const tc = nI > nT ? toDeg(Math.asin(nT / nI)) : null;
      const sin2 = nI * Math.sin(toRad(theta1Deg)) / nT;
      let state = (
        /** @type {'refract' | 'critical' | 'tir' | 'noTir'} */
        "refract"
      );
      let theta2Deg = null;
      if (tc == null) {
        state = "noTir";
        theta2Deg = toDeg(Math.asin(Math.min(1, Math.max(-1, sin2))));
      } else if (Math.abs(theta1Deg - tc) < CRITICAL_BAND) {
        state = "critical";
        theta2Deg = 90;
      } else if (sin2 >= 1) {
        state = "tir";
      } else {
        theta2Deg = toDeg(Math.asin(sin2));
      }
      return {
        nI,
        nT,
        tc,
        state,
        theta2Deg,
        canShowReflection: nI > nT && theta1Deg > 0.05
      };
    }
    function paintDirection() {
      wrap.querySelectorAll("[data-dir]").forEach((btn) => {
        const up = btn.getAttribute("data-dir") === "up";
        btn.classList.toggle("active", up === incidentFromBottom);
      });
    }
    function updateReadouts() {
      const opt = getOptics();
      if (angleEl) angleEl.textContent = `${theta1Deg.toFixed(1)}\xB0`;
      if (angleSlider) angleSlider.value = String(theta1Deg);
      if (angleInput && document.activeElement !== angleInput) angleInput.value = theta1Deg.toFixed(1);
      if (critEl && critLabel) {
        if (opt.tc != null) {
          critLabel.textContent = t("tools.tir.critical");
          critEl.textContent = `${opt.tc.toFixed(1)}\xB0`;
          critEl.hidden = false;
        } else {
          critLabel.textContent = t("tools.tir.noCritical");
          critEl.textContent = "";
          critEl.hidden = true;
        }
      }
      if (critHud) critHud.classList.toggle("is-at-critical", opt.state === "critical");
      if (setCritBtn) setCritBtn.disabled = opt.tc == null;
    }
    let drawPending = false;
    function requestDraw() {
      if (drawPending) return;
      drawPending = true;
      requestAnimationFrame(() => {
        drawPending = false;
        draw();
      });
    }
    function applyState() {
      paintDirection();
      updateReadouts();
      requestDraw();
    }
    function mediumFill(n, alpha) {
      if (n < 1.15) return `rgba(120, 160, 220, ${alpha})`;
      if (n < 1.42) return `rgba(40, 120, 200, ${alpha})`;
      return `rgba(160, 200, 230, ${alpha})`;
    }
    let cssW = 800;
    let cssH = 480;
    function currentDpr() {
      return Math.min(window.devicePixelRatio || 1, 3);
    }
    function getGeom() {
      const W = cssW;
      const H = cssH;
      const cx = W / 2;
      const cy = Math.round(H * 0.5);
      const radius = Math.min(W * 0.28, H * 0.38);
      return { W, H, cx, cy, radius };
    }
    function drawArrow(x1, y1, x2, y2, color, width = 5.5) {
      ctx.save();
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len >= 1) {
        const ux = dx / len;
        const uy = dy / len;
        const size = 26;
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        const tipX = mx + ux * (size * 0.35);
        const tipY = my + uy * (size * 0.35);
        const baseX = tipX - ux * size;
        const baseY = tipY - uy * size;
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(baseX - uy * size * 0.55, baseY + ux * size * 0.55);
        ctx.lineTo(baseX + uy * size * 0.55, baseY - ux * size * 0.55);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
    function drawTextWithOutline(text, x, y, textColor, align = "center", baseline = "middle", font = "bold 15px system-ui, sans-serif") {
      ctx.save();
      ctx.font = font;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      ctx.miterLimit = 2;
      ctx.strokeText(text, x, y);
      ctx.fillStyle = textColor;
      ctx.fillText(text, x, y);
      ctx.restore();
    }
    function labelAlongRay(x1, y1, x2, y2, text, color, side = 1) {
      const mx = x1 + (x2 - x1) * 0.62;
      const my = y1 + (y2 - y1) * 0.62;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const ox = -dy / len * 28 * side;
      const oy = dx / len * 28 * side;
      drawTextWithOutline(text, mx + ox, my + oy, color, "center", "middle", "bold 14px system-ui, sans-serif");
    }
    function drawAngleArc(cx, cy, r, start, end, text, color) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.arc(cx, cy, r, start, end);
      ctx.stroke();
      const mid = (start + end) / 2;
      const tx = cx + (r + 22) * Math.cos(mid);
      const ty = cy + (r + 22) * Math.sin(mid);
      drawTextWithOutline(text, tx, ty, color, "center", "middle", "bold 14px system-ui, sans-serif");
    }
    function drawRightAngle(x, y, size, text, color, dirX, dirY) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.moveTo(x, y + dirY * size);
      ctx.lineTo(x + dirX * size, y + dirY * size);
      ctx.lineTo(x + dirX * size, y);
      ctx.stroke();
      drawTextWithOutline(text, x + dirX * (size + 26), y + dirY * (size + 8), color, "center", "middle", "bold 14px system-ui, sans-serif");
    }
    function draw() {
      const dpr = currentDpr();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      if ("imageSmoothingQuality" in ctx) ctx.imageSmoothingQuality = "high";
      const { W, H, cx, cy, radius } = getGeom();
      if (!W || !H) return;
      const opt = getOptics();
      const theta1 = toRad(theta1Deg);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#f8f9fa";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = mediumFill(n2Val, 0.22);
      ctx.fillRect(0, 0, W, cy);
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI, false);
      ctx.closePath();
      ctx.fillStyle = mediumFill(n1Val, 0.28);
      ctx.fill();
      ctx.strokeStyle = COLOR_AXIS;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.strokeStyle = COLOR_AXIS;
      ctx.lineWidth = 3;
      ctx.moveTo(cx - radius - 40, cy);
      ctx.lineTo(cx + radius + 40, cy);
      ctx.stroke();
      ctx.beginPath();
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = COLOR_AXIS;
      ctx.lineWidth = 2.5;
      ctx.moveTo(cx, cy - radius * 0.85);
      ctx.lineTo(cx, cy + radius * 0.85);
      ctx.stroke();
      ctx.setLineDash([]);
      drawTextWithOutline(t("tools.tir.canvas.normal"), cx + 12, cy - radius * 0.72, COLOR_LABEL, "start", "middle", "bold 13px system-ui, sans-serif");
      const startX = cx - radius * Math.sin(theta1);
      const startY = incidentFromBottom ? cy + radius * Math.cos(theta1) : cy - radius * Math.cos(theta1);
      const reflectX = cx + radius * Math.sin(theta1);
      const reflectY = startY;
      const showRayNames = radius >= 140;
      drawArrow(startX, startY, cx, cy, COLOR_INCIDENT, 5.5);
      if (showRayNames) {
        labelAlongRay(startX, startY, cx, cy, t("tools.tir.canvas.incident"), COLOR_INCIDENT, incidentFromBottom ? 1 : -1);
      }
      if (opt.state === "critical" && opt.tc != null) {
        if (Math.abs(opt.tc - 90) < 0.1) {
          drawRightAngle(cx, cy, 22, `\u03B8c = ${opt.tc.toFixed(1)}\xB0`, "#2563eb", -1, incidentFromBottom ? 1 : -1);
        } else if (incidentFromBottom) {
          drawAngleArc(cx, cy, radius * 0.26, Math.PI / 2, Math.PI / 2 + theta1, `\u03B8c = ${opt.tc.toFixed(1)}\xB0`, "#2563eb");
        } else {
          drawAngleArc(cx, cy, radius * 0.26, -Math.PI / 2 - theta1, -Math.PI / 2, `\u03B8c = ${opt.tc.toFixed(1)}\xB0`, "#2563eb");
        }
      } else if (Math.abs(theta1Deg - 90) < 0.1) {
        drawRightAngle(cx, cy, 18, "\u03B8\u2081 = 90.0\xB0", COLOR_INCIDENT, -1, incidentFromBottom ? 1 : -1);
      } else if (incidentFromBottom) {
        drawAngleArc(cx, cy, radius * 0.22, Math.PI / 2, Math.PI / 2 + theta1, `\u03B8\u2081 = ${theta1Deg.toFixed(1)}\xB0`, COLOR_INCIDENT);
      } else {
        drawAngleArc(cx, cy, radius * 0.22, -Math.PI / 2 - theta1, -Math.PI / 2, `\u03B8\u2081 = ${theta1Deg.toFixed(1)}\xB0`, COLOR_INCIDENT);
      }
      if (opt.state === "critical") {
        const endX = cx + radius * 1.45;
        drawArrow(cx, cy, endX, cy, COLOR_CRITICAL, 5.5);
        if (showRayNames) {
          labelAlongRay(cx, cy, endX, cy, t("tools.tir.canvas.refracted"), COLOR_CRITICAL, incidentFromBottom ? -1 : 1);
        }
        drawRightAngle(cx, cy, 18, "\u03B8\u2082 = 90.0\xB0", COLOR_CRITICAL, 1, incidentFromBottom ? -1 : 1);
      } else if (opt.state !== "tir" && opt.theta2Deg != null) {
        const theta2 = toRad(opt.theta2Deg);
        const rayLen = radius * 1.45;
        const endX = cx + rayLen * Math.sin(theta2);
        const endY = incidentFromBottom ? cy - rayLen * Math.cos(theta2) : cy + rayLen * Math.cos(theta2);
        drawArrow(cx, cy, endX, endY, COLOR_REFRACTED, 5.5);
        if (showRayNames) {
          labelAlongRay(cx, cy, endX, endY, t("tools.tir.canvas.refracted"), COLOR_REFRACTED, 1);
        }
        if (incidentFromBottom) {
          drawAngleArc(cx, cy, radius * 0.16, -Math.PI / 2, -Math.PI / 2 + theta2, `\u03B8\u2082 = ${opt.theta2Deg.toFixed(1)}\xB0`, COLOR_REFRACTED);
        } else {
          drawAngleArc(cx, cy, radius * 0.16, Math.PI / 2 - theta2, Math.PI / 2, `\u03B8\u2082 = ${opt.theta2Deg.toFixed(1)}\xB0`, COLOR_REFRACTED);
        }
      }
      if (opt.canShowReflection) {
        drawArrow(cx, cy, reflectX, reflectY, COLOR_REFLECTED, 5.5);
        if (showRayNames) {
          labelAlongRay(cx, cy, reflectX, reflectY, t("tools.tir.canvas.reflected"), COLOR_REFLECTED, incidentFromBottom ? -1 : 1);
        }
        if (Math.abs(theta1Deg - 90) < 0.1) {
          drawRightAngle(cx, cy, 18, "\u03B8\u1D63 = 90.0\xB0", COLOR_REFLECTED, 1, incidentFromBottom ? 1 : -1);
        } else if (incidentFromBottom) {
          drawAngleArc(cx, cy, radius * 0.16, Math.PI / 2 - theta1, Math.PI / 2, `\u03B8\u1D63 = ${theta1Deg.toFixed(1)}\xB0`, COLOR_REFLECTED);
        } else {
          drawAngleArc(cx, cy, radius * 0.16, -Math.PI / 2, -Math.PI / 2 + theta1, `\u03B8\u1D63 = ${theta1Deg.toFixed(1)}\xB0`, COLOR_REFLECTED);
        }
      }
    }
    angleSlider.addEventListener("input", () => {
      theta1Deg = Math.round(Number(angleSlider.value) * 10) / 10;
      applyState();
    });
    angleInput.addEventListener("change", () => {
      let val = Number(angleInput.value);
      if (Number.isNaN(val)) return;
      theta1Deg = Math.round(Math.min(90, Math.max(0, val)) * 10) / 10;
      applyState();
    });
    wrap.querySelectorAll("[data-dir]").forEach((btn) => {
      btn.addEventListener("click", () => {
        incidentFromBottom = btn.getAttribute("data-dir") === "up";
        applyState();
      });
    });
    setCritBtn.addEventListener("click", () => {
      const opt = getOptics();
      if (opt.tc == null) return;
      theta1Deg = Math.round(opt.tc * 10) / 10;
      applyState();
    });
    wrap.querySelector("[data-reset]").addEventListener("click", () => {
      theta1Deg = DEFAULTS.angle;
      incidentFromBottom = DEFAULTS.fromBottom;
      applyState();
    });
    function canvasPointerPos(ev) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (ev.clientX - rect.left) * (cssW / rect.width),
        y: (ev.clientY - rect.top) * (cssH / rect.height)
      };
    }
    function distPointToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len2 = dx * dx + dy * dy;
      if (len2 < 1e-9) return Math.hypot(px - x1, py - y1);
      let u = ((px - x1) * dx + (py - y1) * dy) / len2;
      u = Math.min(1, Math.max(0, u));
      return Math.hypot(px - (x1 + u * dx), py - (y1 + u * dy));
    }
    function theta1FromPoint(px, py) {
      const { cx, cy } = getGeom();
      const dx = px - cx;
      const dy = py - cy;
      let deg = incidentFromBottom ? toDeg(Math.atan2(-dx, dy)) : toDeg(Math.atan2(-dx, -dy));
      if (deg < 0) deg = 0;
      return Math.min(90, deg);
    }
    let dragging = false;
    function hitIncident(px, py) {
      const { cx, cy, radius } = getGeom();
      const theta1 = toRad(theta1Deg);
      const startX = cx - radius * Math.sin(theta1);
      const startY = incidentFromBottom ? cy + radius * Math.cos(theta1) : cy - radius * Math.cos(theta1);
      return distPointToSegment(px, py, startX, startY, cx, cy) <= 16;
    }
    canvas.addEventListener("pointerdown", (ev) => {
      if (ev.button != null && ev.button !== 0) return;
      const { x, y } = canvasPointerPos(ev);
      if (!hitIncident(x, y)) return;
      dragging = true;
      canvas.setPointerCapture(ev.pointerId);
      theta1Deg = Math.round(theta1FromPoint(x, y) * 10) / 10;
      applyState();
      ev.preventDefault();
    });
    canvas.addEventListener("pointermove", (ev) => {
      const { x, y } = canvasPointerPos(ev);
      canvas.style.cursor = dragging || hitIncident(x, y) ? "grab" : "default";
      if (!dragging) return;
      theta1Deg = Math.round(theta1FromPoint(x, y) * 10) / 10;
      applyState();
      ev.preventDefault();
    });
    function endDrag(ev) {
      if (!dragging) return;
      dragging = false;
      try {
        canvas.releasePointerCapture(ev.pointerId);
      } catch (_) {
      }
    }
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);
    function fitCanvas() {
      const viz = wrap.querySelector(".tirlab-viz");
      if (!viz) return;
      const w = Math.max(320, viz.clientWidth - 20);
      const h = Math.round(w * (480 / 800));
      const dpr = currentDpr();
      const bw = Math.round(w * dpr);
      const bh = Math.round(h * dpr);
      if (canvas.width !== bw || canvas.height !== bh || cssW !== w || cssH !== h) {
        canvas.width = bw;
        canvas.height = bh;
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;
        cssW = w;
        cssH = h;
      }
      requestDraw();
    }
    applyState();
    root2.appendChild(wrap);
    const ro = new ResizeObserver(() => fitCanvas());
    ro.observe(wrap);
    const vizEl = wrap.querySelector(".tirlab-viz");
    if (vizEl) ro.observe(vizEl);
    fitCanvas();
  }

  // labs/tir-escape/js/i18n.js
  var currentLang = "zh";
  var STORAGE_KEY = "s3phy.tir.lang";
  function hubLangToLocal(hubLang) {
    if (hubLang === "zh-Hant" || hubLang === "zh") return "zh";
    return "en";
  }
  function initLangFromUrl() {
    const lang = new URLSearchParams(location.search).get("lang");
    if (lang) {
      currentLang = hubLangToLocal(lang);
    } else {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored === "en" || stored === "zh") {
          currentLang = stored;
        }
      } catch (e) {
      }
    }
  }
  function setLang(lang) {
    currentLang = lang === "en" ? "en" : "zh";
    try {
      localStorage.setItem(STORAGE_KEY, currentLang);
    } catch (e) {
    }
    document.documentElement.lang = currentLang === "zh" ? "zh-HK" : "en";
    return currentLang;
  }
  function getLang() {
    return currentLang;
  }
  var STRINGS = {
    en: {
      "tools.tir.title": "Total internal reflection",
      "tools.tir.subtitle": "Change the incident angle to find the critical angle for glass to air.",
      "tools.tir.angleI": "Incident angle \u03B8\u2081 (\xB0)",
      "tools.tir.critical": "Critical angle \u03B8c",
      "tools.tir.noCritical": "No critical angle",
      "tools.tir.reset": "Reset",
      "tools.tir.setCritical": "Set to \u03B8<sub>c</sub>",
      "tools.tir.dirUp": "Glass \u2192 Air upward",
      "tools.tir.dirDown": "Air \u2192 Glass downward",
      "tools.tir.canvas.incident": "Incident",
      "tools.tir.canvas.refracted": "Refracted",
      "tools.tir.canvas.reflected": "Reflected",
      "tools.tir.canvas.normal": "Normal",
      "tools.tir.canvas.air": "Air",
      "tools.tir.canvas.glass": "Glass",
      "tools.tir.canvas.critical": "\u03B8c"
    },
    zh: {
      "tools.tir.title": "\u5168\u5167\u53CD\u5C04",
      "tools.tir.subtitle": "\u8ABF\u6821\u5165\u5C04\u89D2\uFF0C\u627E\u51FA\u73BB\u7483\u5C0D\u7A7A\u6C23\u7684\u81E8\u754C\u89D2\u3002",
      "tools.tir.angleI": "\u5165\u5C04\u89D2 \u03B8\u2081\uFF08\xB0\uFF09",
      "tools.tir.critical": "\u81E8\u754C\u89D2 \u03B8c",
      "tools.tir.noCritical": "\u6C92\u6709\u81E8\u754C\u89D2",
      "tools.tir.reset": "\u91CD\u8A2D",
      "tools.tir.setCritical": "\u8A2D\u70BA \u03B8<sub>c</sub>",
      "tools.tir.dirUp": "\u73BB\u7483 \u2192 \u7A7A\u6C23 \u7531\u4E0B\u5411\u4E0A",
      "tools.tir.dirDown": "\u7A7A\u6C23 \u2192 \u73BB\u7483 \u7531\u4E0A\u5411\u4E0B",
      "tools.tir.canvas.incident": "\u5165\u5C04",
      "tools.tir.canvas.refracted": "\u6298\u5C04",
      "tools.tir.canvas.reflected": "\u53CD\u5C04",
      "tools.tir.canvas.normal": "\u6CD5\u7DDA",
      "tools.tir.canvas.air": "\u7A7A\u6C23",
      "tools.tir.canvas.glass": "\u73BB\u7483",
      "tools.tir.canvas.critical": "\u03B8c"
    }
  };
  function createT(lang = currentLang) {
    const map = STRINGS[lang === "en" ? "en" : "zh"] || STRINGS.zh;
    return (key) => map[key] ?? key;
  }

  // labs/tir-escape/js/boot.js
  var root = document.getElementById("app");
  function updateLangButtons(activeLang) {
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      const lang = btn.getAttribute("data-set-lang");
      btn.classList.toggle("active", lang === activeLang);
    });
  }
  function mount() {
    if (!root) return;
    root.replaceChildren();
    const current = getLang();
    initTirEscapeLab(root, createT(current));
    updateLangButtons(current);
  }
  function applyLang(lang) {
    setLang(lang);
    mount();
  }
  initLangFromUrl();
  applyLang(getLang());
  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".lang-btn");
    if (!btn || !btn.hasAttribute("data-set-lang")) return;
    const lang = btn.getAttribute("data-set-lang");
    if (lang) applyLang(lang);
  });
  window.addEventListener("message", (ev) => {
    if (ev.data?.type !== "s3phy:lang") return;
    const next = hubLangToLocal(ev.data.lang);
    if (next === getLang()) return;
    applyLang(next);
  });
})();

  </script>
