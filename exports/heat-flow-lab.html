  <style>
/* S3_Phy shared design tokens — single source for Hub + iframe labs */
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap");

:root {
  /* Layout */
  --s3-content-max: min(1600px, calc(100dvw - var(--s3-vp-pad) * 2));
  --s3-bp-sm: 768px;
  --s3-bp-md: 1024px;
  --s3-bp-ws: 1100px;
  --s3-safe-top: env(safe-area-inset-top, 0px);
  --s3-safe-bottom: env(safe-area-inset-bottom, 0px);
  --s3-tool-min-h: clamp(480px, calc(100dvh - var(--s3-nav-offset, 96px) - 48px - var(--s3-safe-bottom)), 1600px);
  --s3-nav-offset: calc(var(--s3-vp-pad) + var(--s3-safe-top) + 72px + 12px);
  --s3-panel-pad: 18px;
  --s3-radius: 14px;
  --s3-vp-pad: clamp(12px, 2vw, 24px);

  /* Typography */
  --s3-font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
  --s3-font-display: "Montserrat", "Inter", system-ui, sans-serif;
  --s3-font-size-base: 16px;
  --s3-font-size-sm: 0.875rem;
  --s3-font-size-h2: 1.15rem;
  --s3-font-size-h1: 1.5rem;
  --s3-line-height: 1.5;
  --s3-font-min: 15px;

  /* Hub light theme */
  --s3-bg: #f8f9fa;
  --s3-surface: #ffffff;
  --s3-surface2: #f1f3f5;
  --s3-border: #e8eaed;
  --s3-text: #1a1c2c;
  --s3-muted: #6b7280;
  --s3-accent: #2563eb;
  --s3-accent-soft: #dbeafe;
  --s3-navy: #1a1c2c;

  /* Lab chrome — light / ivory (match Hub) */
  --s3-lab-bg: #f8f9fa;
  --s3-lab-surface: #ffffff;
  --s3-lab-surface2: #f1f3f5;
  --s3-lab-border: #e8eaed;
  --s3-lab-text: #1a1c2c;
  --s3-lab-muted: #6b7280;
  --s3-lab-accent: #2563eb;
  --s3-lab-success: #16a34a;
  --s3-lab-cyan: #0891b2;

  /* Breakpoints (for reference in media queries) */
  --s3-bp-sm: 768px;
  --s3-bp-md: 1024px;
  --s3-bp-ws: 1100px;
  --s3-float-panel-w: min(440px, calc(100% - 24px));
}


/* S3_Phy embed mode — shared chrome for iframe labs inside Hub */

html.s3phy-embed {
  font-family: var(--s3-font);
  font-size: var(--s3-font-size-base);
  line-height: var(--s3-line-height);

}

html.s3phy-embed:has(.lab-section) {

}

html.s3phy-embed body {

  font-size: max(var(--s3-font-min), 1rem);
  line-height: var(--s3-line-height);
  margin: 0;
}

/* Interactive lab iframe — flex fill (not quiz/worksheet) */
html.s3phy-embed body:has(.lab-section),
html.s3phy-embed body.embed-mode:has(.sim-main-col),
html.s3phy-embed body:has(.sim-main-col):not(:has(#quiz-layout)) {

html.s3phy-embed body:has(.lab-section) > main,

html.s3phy-embed #quiz-layout {

@media (min-width: 1101px) {

html.s3phy-embed .sim-main-col,

html.s3phy-embed .main-container,

/* Floating controls panel (heat labs + shared script) */
.lab-section {

}

@media (min-width: 768px) {

:root {
  color-scheme: light;
  font-family: var(--s3-font, "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #fff; color: #1f2937; }
body { padding: 8px; }
#app { min-height: calc(100vh - 16px); }

.hf-wrap {
  --hf-border: #e4e4e7;
  --hf-panel: #f8fafc;
  --hf-text: #1f2937;
  --hf-muted: #64748b;
  --hf-primary: #6366f1;
  --hf-hot: #ef4444;
  --hf-cold: #0ea5e9;
  width: 100%;
  min-height: calc(100vh - 16px);
  padding: 16px;
  font-size: clamp(18px, 1.15vw, 22px);
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
}

.hf-head {
  position: relative;
  max-width: 1800px;
  margin: 0 auto 16px;
  padding-inline: 80px;
  text-align: center;
}

.hf-head h1 {
  margin: 0;
  font-family: var(--s3-font-display, "Montserrat", "Inter", system-ui, sans-serif);
  font-size: clamp(1.35rem, 3vw, 1.7rem);
  font-weight: 800;
  letter-spacing: -0.025em;
  background: linear-gradient(135deg, #ef4444, #6366f1 55%, #0ea5e9);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.hf-head p { margin: 5px 0 0; color: var(--hf-muted); font-size: 0.88rem; }
.hf-language {
  position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  padding: 6px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 999px;
  background: #fff;
  color: #334155;
  font: inherit;
  font-size: 0.78rem;
  font-weight: 800;
  cursor: pointer;
}

.hf-language:hover { border-color: var(--hf-primary); color: var(--hf-primary); background: #eef2ff; }
.hf-language:focus-visible,
.hf-wrap button:focus-visible,
.hf-wrap input:focus-visible,
.hf-wrap select:focus-visible { outline: 3px solid rgba(99, 102, 241, 0.28); outline-offset: 2px; }

.hf-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.8fr) minmax(500px, 0.9fr);
  gap: 16px;
  width: 100%;
  max-width: 1800px;
  margin: 0 auto;
  align-items: stretch;
  transition: grid-template-columns 0.3s ease;
}

.hf-wrap.controls-collapsed .hf-layout {
  grid-template-columns: minmax(0, 1fr);
}

.hf-main { display: flex; min-width: 0; }
.hf-stage,
.hf-chart-card,
.hf-sidebar > section,
.hf-control-card {
  border: 1px solid var(--hf-border);
  border-radius: 15px;
  background: var(--hf-panel);
}

.hf-stage {
  position: relative;
  width: 100%;

.hf-status {

.hf-object-wrap {

.hf-object {

  justify-content: center;

  border-radius: 19px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.8), rgba(255,255,255,0.25)),
    color-mix(in srgb, var(--object-colour), #fff 72%);
  box-shadow:
    0 12px 28px color-mix(in srgb, var(--object-colour), transparent 78%),
    inset 0 0 24px rgba(255,255,255,0.6);

  will-change: transform;
  z-index: 2;
}

.hf-object--hot { transform: translateX(-34px); }
.hf-object--cold { transform: translateX(34px); }
.is-contacting .hf-object--hot { transform: translateX(0); border-radius: 19px 4px 4px 19px; }
.is-contacting .hf-object--cold { transform: translateX(0); border-radius: 4px 19px 19px 4px; }
.hf-object-symbol { font-size: 3.2rem; font-weight: 900; color: color-mix(in srgb, var(--object-colour), #0f172a 30%); }
.hf-object strong {
  margin-top: 7px;
  color: #0f172a;
  font-size: clamp(1.75rem, 2.3vw, 2.25rem);
  letter-spacing: -0.02em;
  white-space: nowrap;
  transition: color 0.25s;
}
.hf-object strong sub,
.hf-temperature-change strong sub {
  font-size: 0.65em;
}
.hf-object.is-role-hot strong { color: #b91c1c; }
.hf-object.is-role-cold strong { color: #0369a1; }
.hf-object.is-role-equal strong { color: #15803d; }
.hf-object-label {
  display: block;
  width: 100%;
  min-height: 1.4em;
  font-size: 1.55rem;
  font-weight: 900;
  line-height: 1.2;
  text-align: center;
}
.hf-object--hot + .hf-object-label { color: #dc2626; }
.hf-object--cold + .hf-object-label { color: #0284c7; }
.hf-object.is-role-hot + .hf-object-label { color: #dc2626; }
.hf-object.is-role-cold + .hf-object-label { color: #0284c7; }
.hf-object.is-role-equal + .hf-object-label { color: #15803d; }
.hf-initial-temp {
  display: block;
  margin-top: -8px;
  font-size: 1.05rem;
  font-weight: 800;
  line-height: 1.2;
  color: #64748b;
}
.hf-initial-temp.is-initial-hot { color: #dc2626; }
.hf-initial-temp.is-initial-cold { color: #0284c7; }
.hf-initial-temp.is-initial-equal { color: #111827; }

.hf-thermometer {
  position: absolute;
  left: 18px;
  bottom: 28px;
  width: 17px;
  height: 185px;
  overflow: hidden;
  border: 2px solid rgba(15,23,42,0.24);
  border-radius: 999px;
  background: rgba(255,255,255,0.7);
}

.hf-thermometer span { position: absolute; inset: auto 0 0; min-height: 5%; transition: height 0.25s, background 0.25s; }
.hf-flow {
  position: relative;
  width: clamp(88px, 14%, 140px);
  height: 100px;
  margin-top: 95px;
  flex: 0 0 auto;
  text-align: center;
  z-index: 3;
  transition: width 0.7s cubic-bezier(.2,.8,.2,1);
}
.is-contacting .hf-flow { width: 0; }
.hf-temperature-change {
  position: relative;
  display: grid;
  width: min(100%, 250px);
  max-width: 100%;
  min-height: 52px;
  margin: -4px auto 0;
  padding: 8px 13px;
  border: 2px solid transparent;
  border-radius: 11px;
  background: transparent;
  color: #475569;
  text-align: center;
  transition:
    border-color 0.65s ease,
    background 0.65s ease,
    color 0.65s ease;
}
.is-equilibrium .hf-temperature-change {
  border-color: currentColor;
  background: rgba(255, 255, 255, 0.92);
}
.hf-temperature-change--hot { color: #b91c1c; }
.hf-temperature-change--cold { color: #0369a1; }
.hf-temperature-change--equal { color: #15803d; }
.hf-stage:not(.is-equilibrium) .hf-temperature-change { color: #475569; }
.hf-final-question {
  align-self: center;
  font-size: 0.95rem;
  font-weight: 850;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.hf-delta-result {
  position: absolute;
  inset: 6px 8px;
  display: grid;
  align-content: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.65s ease, transform 0.65s ease;
}
.is-equilibrium .hf-final-question {
  opacity: 0;
  transform: translateY(-6px);
}
.is-equilibrium .hf-delta-result {
  opacity: 1;
  transform: translateY(0);
}
.hf-delta-result span {
  font-size: 0.78rem;
  font-weight: 800;
  line-height: 1.1;
}
.hf-delta-result strong {
  margin-top: 3px;
  font-size: 1.12rem;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
}
.hf-flow-track {
  position: absolute;
  top: -22px;
  left: calc(50% - 155px);
  width: 310px;
  height: 145px;
  overflow: visible;
  pointer-events: none;
}
.hf-flow-track i {
  --delay: calc(var(--i) * -0.075s);
  position: absolute;
  top: calc(8px + var(--row) * 18px);
  left: 0;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: var(--hf-hot);
  opacity: 0;
  box-shadow: 0 0 9px rgba(239, 68, 68, 0.55);
  will-change: transform, opacity;
}

.is-flowing .hf-flow-track i {
  animation: hf-energy var(--particle-duration, 1.3s) linear var(--delay) infinite;
}
.is-flowing.is-flow-reverse .hf-flow-track i { animation-direction: reverse; }
.hf-flow-indicator {
  display: flex;
  min-height: 90px;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 4px;
  color: #111827;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s;
}
.hf-flow-indicator .hf-arrow {
  color: #111827;
  font-size: clamp(5rem, 8vw, 7rem);
  font-weight: 950;
  line-height: 1;
}
.hf-flow-indicator strong {
  font-size: 1.45rem;
  font-weight: 950;
  letter-spacing: 0.01em;
}
.hf-flow-hot {
  color: var(--hf-hot);
  text-transform: uppercase;
}
.hf-flow-cold {
  color: var(--hf-cold);
  text-transform: uppercase;
}
.is-flowing .hf-flow-indicator,
.is-equilibrium .hf-flow-indicator {
  opacity: 1;
  visibility: visible;
}
.is-flowing .hf-flow-indicator .hf-arrow {
  animation: hf-pulse 0.9s ease-in-out infinite alternate;
}
.is-flowing.is-flow-reverse .hf-flow-indicator .hf-arrow {
  animation-name: hf-pulse-left;
}
@keyframes hf-energy {
  0% { transform: translateX(0) scale(0.65); opacity: 0; }
  15% { opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateX(300px) scale(1); opacity: 0; }
}

.hf-readouts span { display: block; color: var(--hf-muted); font-size: 1em; font-weight: 750; }
.hf-readouts strong { display: block; margin-top: 4px; font-size: 1.55em; font-variant-numeric: tabular-nums; }

.hf-chart-card { min-height: 190px; padding: 11px 14px 8px; background: #fff; overflow: hidden; }
.hf-section-title { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; }
.hf-legend { display: flex; gap: 15px; font-size: 0.67rem; font-weight: 750; }

.hf-legend .hot::before { background: var(--hf-hot); }
.hf-legend .cold::before { background: var(--hf-cold); }

.hf-control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.hf-control-card { min-width: 0; padding: 16px; background: #fff; }

.hf-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--hf-hot); box-shadow: 0 0 0 3px #fee2e2; }
.hf-control-card--cold .hf-dot { background: var(--hf-cold); box-shadow: 0 0 0 3px #e0f2fe; }

.hf-control-card.is-role-hot [data-output$="Initial"],

    const query = (selector) => root2.querySelector(selector);

      pauseButton.textContent = phase === "paused" ? t("resume") : t("pause");

      if (phase === "running") {

        stagePlayIcon.textContent = "\u2161";
      } else if (phase === "paused") {
        stagePlayText.textContent = t("resume");
        stagePlayIcon.textContent = "\u25B6";
      } else if (phase === "equilibrium") {

        stagePlayIcon.textContent = "\u21BB";

      const newDifference = oldDifference * Math.exp(-decayRate * simulatedDelta);

      if (action === "massTemperaturePreset") {
        Object.assign(state, MASS_TEMPERATURE_PRESET);
        reset();
      }
      if (action === "toggleControls") {
        controlsCollapsed = !controlsCollapsed;
        render();
      }
      if (action === "language") options.onLanguageToggle?.();
    }
    root2.addEventListener("input", onInput);
    root2.addEventListener("change", onInput);
    root2.addEventListener("click", onClick);
    reset();
    root2.destroy = () => {
      cancelAnimationFrame(animationFrame);
      clearTimeout(joinTimer);
      root2.removeEventListener("input", onInput);
      root2.removeEventListener("change", onInput);
      root2.removeEventListener("click", onClick);
    };
    return root2;
  }

  function hubLangToLocal(lang) {
    return lang === "zh" || lang === "zh-Hant" ? "zh" : "en";
  }
  function initLangFromUrl() {
    const lang = new URLSearchParams(location.search).get("lang");
    if (lang) currentLang = hubLangToLocal(lang);
  }
  function setLang(lang) {
    currentLang = lang === "en" ? "en" : "zh";
    document.documentElement.lang = currentLang === "zh" ? "zh-HK" : "en";
  }
  function getLang() {
    return currentLang;
  }
  function createT(lang = currentLang) {
    const strings = STRINGS[lang === "en" ? "en" : "zh"];
    return (key) => strings[key] ?? key;
  }

  // labs/heat-flow/js/boot.js
  var root = document.getElementById("app");
  var cleanup = null;
  function mount() {
    cleanup?.();
    root.replaceChildren();
    const lab = createHeatFlowLab(createT(getLang()), {
      lang: getLang(),
      onLanguageToggle: () => {
        setLang(getLang() === "zh" ? "en" : "zh");
        mount();
      }
    });
    root.appendChild(lab);
    cleanup = lab.destroy;
  }
  initLangFromUrl();
  setLang(getLang());
  mount();
  window.addEventListener("message", (event) => {
    if (event.data?.type !== "s3phy:lang") return;
    const next = hubLangToLocal(event.data.lang);
    if (next === getLang()) return;
    setLang(next);
    mount();
  });
