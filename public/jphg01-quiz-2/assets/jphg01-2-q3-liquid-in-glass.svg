<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Liquid-in-glass thermometer. Labels mark the narrow glass tube, scale, liquid column, and bulb.">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <linearGradient id="liq" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c9242c"/>
      <stop offset="1" stop-color="#e85a4a"/>
    </linearGradient>
  </defs>

  <!-- left: realistic stick thermometer -->
  <rect x="78" y="28" width="18" height="310" rx="9" fill="#eef4fb" stroke="#7a8aa0" stroke-width="1.4"/>
  <rect x="84" y="40" width="6" height="250" rx="3" fill="#d7e3f2"/>
  <!-- scale ticks -->
  <g stroke="#414753" stroke-width="0.9">
    <line x1="72" y1="70" x2="80" y2="70"/>
    <line x1="72" y1="110" x2="80" y2="110"/>
    <line x1="72" y1="150" x2="80" y2="150"/>
    <line x1="72" y1="190" x2="80" y2="190"/>
    <line x1="72" y1="230" x2="80" y2="230"/>
    <line x1="72" y1="270" x2="80" y2="270"/>
  </g>
  <rect x="84" y="248" width="6" height="90" rx="2" fill="url(#liq)"/>
  <ellipse cx="87" cy="352" rx="16" ry="22" fill="url(#liq)" stroke="#7a1a22" stroke-width="1"/>
  <ellipse cx="87" cy="344" rx="12" ry="8" fill="#e85a4a" opacity="0.45"/>

  <!-- right: structure diagram -->
  <rect x="318" y="28" width="28" height="310" rx="14" fill="#d7ecfb" stroke="#4a7aa8" stroke-width="1.6"/>
  <rect x="328" y="42" width="8" height="268" rx="4" fill="#9fd0f0"/>
  <rect x="328" y="168" width="8" height="142" rx="3" fill="url(#liq)"/>
  <ellipse cx="332" cy="352" rx="20" ry="26" fill="url(#liq)" stroke="#7a1a22" stroke-width="1.2"/>

  <!-- labels -->
  <g fill="#191c1e" font-family="Times New Roman, Times, serif" font-size="16">
    <text x="210" y="78" text-anchor="middle">narrow glass tube</text>
    <text x="210" y="178" text-anchor="middle">scale</text>
    <text x="210" y="248" text-anchor="middle">liquid</text>
    <text x="210" y="358" text-anchor="middle">bulb</text>
  </g>
  <g stroke="#191c1e" stroke-width="1.1" fill="none">
    <line x1="96" y1="72" x2="148" y2="72"/>
    <line x1="318" y1="72" x2="268" y2="72"/>
    <line x1="78" y1="150" x2="188" y2="172"/>
    <line x1="318" y1="150" x2="232" y2="172"/>
    <line x1="87" y1="268" x2="188" y2="242"/>
    <line x1="328" y1="230" x2="232" y2="242"/>
    <line x1="103" y1="352" x2="188" y2="352"/>
    <line x1="312" y1="352" x2="232" y2="352"/>
  </g>
</svg>
