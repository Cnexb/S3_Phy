<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-label="Graph of resistance R against temperature T. A solid straight line joins the lower and upper fixed points and passes through 100 ohm at 120 degrees Celsius. A dotted curve lies below the solid line between the fixed points.">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- axes -->
  <line x1="70" y1="340" x2="70" y2="36" stroke="#191c1e" stroke-width="1.8"/>
  <line x1="70" y1="340" x2="490" y2="340" stroke="#191c1e" stroke-width="1.8"/>
  <polygon points="70,28 66,40 74,40" fill="#191c1e"/>
  <polygon points="498,340 486,336 486,344" fill="#191c1e"/>
  <text x="42" y="28" font-size="16" font-family="Times New Roman, Times, serif" fill="#191c1e">R / ©</text>
  <text x="428" y="372" font-size="16" font-family="Times New Roman, Times, serif" fill="#191c1e">T / °C</text>

  <!-- R = 100 guide -->
  <line x1="70" y1="190" x2="268" y2="190" stroke="#727784" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="58" y="196" text-anchor="end" font-size="15" font-family="Times New Roman, Times, serif" fill="#191c1e">100</text>
  <!-- T = 120 guide -->
  <line x1="268" y1="340" x2="268" y2="190" stroke="#727784" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="268" y="362" text-anchor="middle" font-size="15" font-family="Times New Roman, Times, serif" fill="#191c1e">120</text>

  <!-- actual (dotted) curve: below the chord between fixed points -->
  <path d="M 130,250 C 190,232 230,214 268,206 C 310,196 370,168 430,110"
        fill="none" stroke="#191c1e" stroke-width="1.8" stroke-dasharray="5 5"/>

  <!-- assumed linear (solid) -->
  <line x1="118" y1="258" x2="442" y2="98" stroke="#191c1e" stroke-width="2"/>

  <!-- fixed-point markers -->
  <circle cx="148" cy="242" r="3.2" fill="#191c1e"/>
  <circle cx="410" cy="114" r="3.2" fill="#191c1e"/>
  <text x="88" y="268" font-size="14" font-family="Times New Roman, Times, serif" fill="#191c1e">lower fixed</text>
  <text x="108" y="286" font-size="14" font-family="Times New Roman, Times, serif" fill="#191c1e">point</text>
  <text x="336" y="78" font-size="14" font-family="Times New Roman, Times, serif" fill="#191c1e">upper fixed point</text>
</svg>
