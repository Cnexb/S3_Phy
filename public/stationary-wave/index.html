<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta name="google" content="notranslate">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stationary Wave (HKDSE Physics)</title>
  <link rel="stylesheet" href="../shared/s3phy-embed.css">
  <script src="../shared/s3phy-embed-init.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap");

:root {
  --s3-vp-pad: clamp(12px, 2vw, 24px);
  --s3-radius: 14px;
  --s3-font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
  --tab-accent: #f43f5e;
  --tab-accent-glow: rgba(244, 63, 94, 0.35);
  --glass-bg: rgba(255, 255, 255, 0.82);
}

html { scrollbar-gutter: stable; }
body {
  font-family: "Plus Jakarta Sans", var(--s3-font), sans-serif;
  background-color: #f8fafc;
  color: #0f172a;
  overflow-x: hidden;
}
.mono { font-family: "JetBrains Mono", monospace; }
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(15, 23, 42, 0.08);
  box-shadow: 0 8px 32px 0 rgba(15, 23, 42, 0.05);
}
.cdn-warning {
  background: linear-gradient(90deg, #b45309, #d97706);
  color: #fffbeb;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  padding: 6px 12px;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #f8fafc; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

.bg-slate-950, canvas.bg-slate-950 {
  background-color: #ffffff !important;
}
.bg-slate-950\/40 { background-color: rgba(255, 255, 255, 0.72) !important; }
.bg-slate-900, .bg-slate-900\/95, .bg-slate-900\/60 {
  background-color: #f1f5f9 !important;
}
.border-slate-800, .border-slate-800\/80, .border-slate-700 {
  border-color: #cbd5e1 !important;
}
.text-slate-100, .text-slate-200, .text-slate-300, h1.text-white, h3.text-white {
  color: #0f172a !important;
}
.text-slate-400 { color: #475569 !important; }
.text-slate-500 { color: #64748b !important; }
.bg-slate-800 { background-color: #e2e8f0 !important; color: #0f172a !important; }
.bg-slate-800:hover { background-color: #cbd5e1 !important; }
.lang-btn { color: #475569 !important; }
.lang-btn:hover { color: #0f172a !important; background-color: #cbd5e1 !important; }
.lang-active {
  background: linear-gradient(135deg, #cbd5e1 0%, #e2e8f0 100%) !important;
  color: #0f172a !important;
  box-shadow: 0 2px 10px -2px rgba(15, 23, 42, 0.1) !important;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 9999px;
  background: #e2e8f0;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #f43f5e;
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #f43f5e;
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
  cursor: pointer;
}

#btn-show-controls { display: none; }
#sw-fs-root:fullscreen #btn-show-controls,
#sw-fs-root:-webkit-full-screen #btn-show-controls {
  display: inline-flex;
}
#sw-fs-root:fullscreen,
#sw-fs-root:-webkit-full-screen {
  background: #f8fafc;
  padding: 12px;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
#sw-fs-root:fullscreen .sw-fs-grid,
#sw-fs-root:-webkit-full-screen .sw-fs-grid {
  display: flex;
  flex: 1;
  min-height: 0;
  height: 100%;
  gap: 0;
  align-items: stretch;
}
#sw-fs-root:fullscreen .sw-sim-col,
#sw-fs-root:-webkit-full-screen .sw-sim-col {
  flex: 1 1 100%;
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-height: 0;
}
#sw-fs-root:fullscreen .sw-sim-card,
#sw-fs-root:-webkit-full-screen .sw-sim-card {
  height: 100%;
  min-height: 0;
  overflow: hidden;
}
#sw-fs-root:fullscreen #sw-side-panel,
#sw-fs-root:-webkit-full-screen #sw-side-panel {
  display: none;
}
#sw-fs-root:fullscreen #sw-canvas-wrap,
#sw-fs-root:-webkit-full-screen #sw-canvas-wrap {
  flex: 1 1 auto;
  min-height: 0 !important;
  height: auto !important;
}
#sw-fs-root:fullscreen.show-fs-controls .sw-fs-grid,
#sw-fs-root:-webkit-full-screen.show-fs-controls .sw-fs-grid {
  flex-direction: row;
  align-items: flex-start;
  gap: 16px;
}
#sw-fs-root:fullscreen.show-fs-controls .sw-sim-col,
#sw-fs-root:-webkit-full-screen.show-fs-controls .sw-sim-col {
  flex: 1 1 auto;
  width: auto;
  max-width: none;
  height: calc(100% - 24px);
}
#sw-fs-root:fullscreen.show-fs-controls .sw-sim-card,
#sw-fs-root:-webkit-full-screen.show-fs-controls .sw-sim-card {
  height: 100%;
  overflow: hidden;
}
#sw-fs-root:fullscreen.show-fs-controls #sw-side-panel,
#sw-fs-root:-webkit-full-screen.show-fs-controls #sw-side-panel {
  display: flex;
  position: static;
  top: auto;
  right: auto;
  bottom: auto;
  width: min(380px, 36vw);
  height: calc(100% - 24px);
  flex-shrink: 0;
  overflow-y: auto;
  z-index: auto;
}
.hl-bar {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(16px * var(--sw-btn-scale, 1));
  z-index: 10;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.hl-btns { display: flex; gap: calc(12px * var(--sw-btn-scale, 1)); }
.hl-btn {
  border: calc(2px * var(--sw-btn-scale, 1)) solid #e5e7eb;
  background: #ffffff;
  padding: calc(8px * var(--sw-btn-scale, 1)) calc(20px * var(--sw-btn-scale, 1));
  border-radius: calc(16px * var(--sw-btn-scale, 1));
  cursor: pointer;
  font-weight: 700;
  font-size: calc(18px * var(--sw-btn-scale, 1));
  color: #475569;
  transition: all 0.15s;
  pointer-events: auto;
  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
}
.hl-btn:hover { border-color: #94a3b8; }
.hl-btn.active.in {
  border-color: #10b981;
  background: #ecfdf5;
  color: #047857;
  box-shadow: 0 0 14px 3px rgba(16, 185, 129, 0.55);
}
.hl-btn.active.anti {
  border-color: #e11d48;
  background: #fff1f2;
  color: #be123c;
  box-shadow: 0 0 14px 3px rgba(225, 29, 72, 0.5);
}
@media (prefers-reduced-motion: reduce) {
  .animate-ping, .animate-pulse { animation: none !important; }
}

html.s3phy-embed,
html.s3phy-embed body {
  height: 100%;
  min-height: 100%;
  overflow: hidden;
}
body.embed-mode {
  min-height: 100%;
  height: 100%;
  overflow: hidden;
}
body.embed-mode #cdn-warning,
body.embed-mode .deco-blob,
body.embed-mode footer,
body.embed-mode header {
  display: none !important;
}
body.embed-mode main {
  flex: 1 1 auto;
  min-height: 0;
  max-width: none;
  margin: 0;
  padding: 8px;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
body.embed-mode #sw-fs-root {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
}
body.embed-mode .sw-fs-grid {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  align-items: stretch;
}
body.embed-mode .sw-sim-col,
body.embed-mode .sw-sim-card {
  min-height: 0;
  height: 100%;
}
body.embed-mode #sw-canvas-wrap {
  height: auto !important;
  flex: 1 1 auto;
  min-height: 10rem;
}
body.embed-mode #sw-side-panel {
  max-height: 100%;
  overflow-y: auto;
}
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="cdn-warning" class="cdn-warning hidden" role="alert">Some CDN resources failed to load. Please connect to the internet and refresh.</div>
  <div class="deco-blob absolute top-0 left-1/4 w-96 h-96 rounded-full blur-[120px] pointer-events-none opacity-40" style="background: var(--tab-accent-glow);"></div>
  <div class="deco-blob absolute top-0 right-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <header class="border-b border-slate-800/80 bg-slate-950/40 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="p-2.5 bg-rose-500/10 rounded-2xl border border-rose-500/20 text-rose-500 shadow-inner">
          <i data-lucide="audio-lines" class="w-7 h-7 animate-pulse text-rose-500"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-extrabold tracking-tight text-white" data-i18n="app.title">Stationary Wave</h1>
            <span class="px-2 py-0.5 bg-rose-500/20 text-rose-700 border border-rose-500/30 rounded text-[10px] font-bold tracking-wider uppercase">HKDSE Physics</span>
          </div>
          <p class="text-xs text-slate-400 font-medium tracking-wide mt-0.5" data-i18n="app.subtitle">HKDSE Physics · Standing wave on a string</p>
        </div>
      </div>
      <div class="flex bg-slate-900/95 p-1 rounded-xl border border-slate-800/80">
        <button type="button" onclick="setLanguage('en')" id="lang-en" class="lang-btn px-3 py-2 rounded-lg text-xs font-bold transition-all duration-200 lang-active">EN</button>
        <button type="button" onclick="setLanguage('zh-Hant')" id="lang-zh" class="lang-btn px-3 py-2 rounded-lg text-xs font-bold transition-all duration-200">繁中</button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 sm:px-6 lg:px-8">
    <div id="sw-fs-root" class="relative">
    <div class="sw-fs-grid grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <div class="sw-sim-col lg:col-span-8 flex flex-col gap-6 w-full">
        <div class="sw-sim-card glass-panel rounded-2xl p-5 flex flex-col relative overflow-hidden">
          <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2.5">
              <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
              <h3 class="font-bold text-sm tracking-wide text-slate-200" data-i18n="sim.title">Stationary Wave Sandbox</h3>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" id="btn-pause" onclick="togglePause()" class="px-3.5 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold border border-red-700">
                <span id="lbl-pause">Pause</span>
              </button>
              <button type="button" id="btn-show-controls" onclick="toggleFsControls()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold border border-indigo-700">
                <span id="lbl-show-controls" data-i18n="common.showControls">Show controls</span>
              </button>
              <button type="button" id="btn-fullscreen" onclick="toggleFullscreen()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold border border-slate-700">
                <span id="lbl-fullscreen" data-i18n="common.fullscreen">Full screen</span>
              </button>
            </div>
          </div>
          <div id="sw-canvas-wrap" class="relative bg-slate-950 rounded-xl overflow-hidden border border-slate-800/80 h-[calc(100dvh-12.5rem)] min-h-[24rem]">
            <div class="hl-bar">
              <div class="hl-btns">
                <button type="button" id="hl-in" class="hl-btn" data-i18n="hl.in">In-phase</button>
                <button type="button" id="hl-anti" class="hl-btn" data-i18n="hl.anti">Antiphase</button>
              </div>
            </div>
            <canvas id="swCanvas" class="w-full h-full block bg-slate-950"></canvas>
          </div>
        </div>
      </div>

      <div id="sw-side-panel" class="lg:col-span-4 flex flex-col gap-4">
        <div class="glass-panel rounded-2xl p-5 border-l-4 border-l-rose-500">
          <div class="flex items-center justify-between mb-3">
            <h4 class="font-bold text-sm text-slate-800" data-i18n="ctrl.amplitude">Amplitude</h4>
            <span id="lbl-amp" class="mono text-xs font-bold text-rose-600">55</span>
          </div>
          <input type="range" id="amp-slider" min="20" max="90" step="1" value="55" aria-label="Amplitude">
        </div>

        <div class="glass-panel rounded-2xl p-5">
          <div class="flex items-center justify-between mb-3">
            <h4 class="font-bold text-sm text-slate-800" data-i18n="ctrl.loops">Number of loops</h4>
            <span id="lbl-loops" class="mono text-xs font-bold text-rose-600">2</span>
          </div>
          <input type="range" id="loops-slider" min="1" max="5" step="1" value="2" aria-label="Number of loops">
        </div>

        <button type="button" onclick="resetAll()" class="w-full px-3.5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md" data-i18n="ctrl.reset">Reset</button>
      </div>
    </div>
    </div>
  </main>

  <footer class="border-t border-slate-200 text-slate-500 py-5 text-center text-xs mt-auto">
    <span data-i18n="app.footer">© 2026 Stationary Wave Lab · HKDSE Physics classroom suite</span>
  </footer>

  <script>
(function () {
  'use strict';

  const VW = 800;
  const VH = 560;
  const OMEGA = 2 * Math.PI * 0.55;
  const AMP_DEFAULT = 55;
  const LOOPS_DEFAULT = 2;
  const STRING = { x0: 118, x1: 710, y: 280 };
  const L = STRING.x1 - STRING.x0;
  const WALL = { x: STRING.x1, w: 22, y: 88, h: 384 };
  const BOX = { w: 64, h: 64 };
  BOX.x = STRING.x0 - BOX.w / 2;
  BOX.y = STRING.y + 18;

  const PARTICLE_SPEC = [
    { id: 'A', color: '#e74c3c' },
    { id: 'B', color: '#e67e22' },
    { id: 'C', color: '#f1c40f' },
    { id: 'D', color: '#2ecc71' },
    { id: 'E', color: '#1abc9c' },
    { id: 'F', color: '#3498db' },
    { id: 'G', color: '#9b59b6' },
    { id: 'H', color: '#34495e' },
    { id: 'I', color: '#e91e63' },
    { id: 'J', color: '#ff8a65' },
    { id: 'K', color: '#d4e157' },
    { id: 'L', color: '#00897b' },
    { id: 'M', color: '#5c6bc0' },
    { id: 'N', color: '#8d6e63' },
    { id: 'O', color: '#ab47bc' },
    { id: 'P', color: '#78909c' },
    { id: 'Q', color: '#ef7350' },
    { id: 'R', color: '#42a5f5' },
    { id: 'S', color: '#66bb6a' },
    { id: 'T', color: '#6d4c41' }
  ];

  const I18N = {
    en: {
      app: {
        title: 'Stationary Wave',
        subtitle: 'HKDSE Physics · Standing wave on a string',
        pageTitle: 'Stationary Wave (HKDSE Physics)',
        footer: '© 2026 Stationary Wave Lab · HKDSE Physics classroom suite'
      },
      sim: { title: 'Stationary Wave Sandbox' },
      common: { fullscreen: 'Full screen', exitFullscreen: 'Exit', showControls: 'Show controls', hideControls: 'Hide controls', reset: 'Reset', pause: 'Pause', resume: 'Resume' },
      ctrl: { amplitude: 'Amplitude', loops: 'Number of loops', reset: 'Reset' },
      hl: { in: 'In-phase', anti: 'Antiphase' },
      draw: {
        equilibrium: 'Equilibrium',
        vibrator: 'VIBRATOR',
        nodeKey: 'N - node',
        antiKey: 'A - antinode'
      },
      suffix: { A: 'A', N: 'N' }
    },
    'zh-Hant': {
      app: {
        title: '駐波',
        subtitle: 'HKDSE 物理 · 弦上的駐波',
        pageTitle: '駐波 (HKDSE Physics)',
        footer: '© 2026 駐波實驗室 · HKDSE 物理課堂套件'
      },
      sim: { title: '駐波沙盒' },
      common: { fullscreen: '全畫面', exitFullscreen: '離開', showControls: '顯示控制', hideControls: '隱藏控制', reset: '重設', pause: '暫停', resume: '繼續' },
      ctrl: { amplitude: '振幅', loops: '圈數', reset: '重設' },
      hl: { in: '同相', anti: '反相' },
      draw: {
        equilibrium: '平衡位置',
        vibrator: '振子',
        nodeKey: 'N - 節',
        antiKey: 'A - 腹'
      },
      suffix: { A: '腹', N: '節' }
    }
  };

  function hubLangToLocal(lang) {
    if (lang === 'zh-Hant' || lang === 'zhHant' || lang === 'zh') return 'zh-Hant';
    return 'en';
  }

  (function initLangFromUrl() {
    const params = new URLSearchParams(location.search);
    const langParam = params.get('lang');
    if (langParam) {
      try { localStorage.setItem('sw-lang', hubLangToLocal(langParam)); } catch (e) { /* ignore */ }
    }
  })();

  let currentLang = hubLangToLocal(localStorage.getItem('sw-lang') || 'en');
  let amplitude = AMP_DEFAULT;
  let loops = LOOPS_DEFAULT;
  let running = true;
  let paused = false;
  let pauseAccum = 0;
  let pauseStarted = 0;
  let frozenTime = 0;
  let animId = 0;
  let fsControlsOpen = false;
  let canvas, ctx;
  let t0 = 0;
  let viewRect = { width: VW, height: VH };
  let highlightMode = 'off';
  let selectedIndex = null;
  let lastHit = [];

  function t(path) {
    const parts = path.split('.');
    let node = I18N[currentLang];
    for (const p of parts) node = node && node[p];
    return node || path;
  }

  function applyLanguage() {
    document.documentElement.lang = currentLang === 'zh-Hant' ? 'zh-Hant' : 'en';
    document.title = t('app.pageTitle');
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.getElementById('lang-en').classList.toggle('lang-active', currentLang === 'en');
    document.getElementById('lang-zh').classList.toggle('lang-active', currentLang === 'zh-Hant');
    syncHlButtons();
    syncPauseBtn();
    syncFsUi();
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  window.setLanguage = function (lang) {
    currentLang = hubLangToLocal(lang);
    try { localStorage.setItem('sw-lang', currentLang); } catch (e) { /* ignore */ }
    applyLanguage();
  };

  window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 's3phy:lang') {
      window.setLanguage(event.data.lang);
    }
  });

  function isFullscreen() {
    const root = document.getElementById('sw-fs-root');
    return document.fullscreenElement === root || document.webkitFullscreenElement === root;
  }

  function syncFsUi() {
    const root = document.getElementById('sw-fs-root');
    const fs = isFullscreen();
    const fsLbl = document.getElementById('lbl-fullscreen');
    const showLbl = document.getElementById('lbl-show-controls');
    if (fsLbl) fsLbl.textContent = fs ? t('common.exitFullscreen') : t('common.fullscreen');
    if (!fs) {
      fsControlsOpen = false;
      if (root) root.classList.remove('show-fs-controls');
    }
    if (showLbl) showLbl.textContent = fsControlsOpen ? t('common.hideControls') : t('common.showControls');
  }

  window.toggleFsControls = function () {
    if (!isFullscreen()) return;
    fsControlsOpen = !fsControlsOpen;
    document.getElementById('sw-fs-root').classList.toggle('show-fs-controls', fsControlsOpen);
    syncFsUi();
    requestAnimationFrame(() => { if (canvas) setupCanvas(canvas); });
  };

  function syncSliderLabels() {
    document.getElementById('lbl-amp').textContent = String(Math.round(amplitude));
    document.getElementById('lbl-loops').textContent = String(loops);
    document.getElementById('amp-slider').value = String(amplitude);
    document.getElementById('loops-slider').value = String(loops);
  }

  function syncHlButtons() {
    const inBtn = document.getElementById('hl-in');
    const antiBtn = document.getElementById('hl-anti');
    if (!inBtn || !antiBtn) return;
    inBtn.classList.toggle('active', highlightMode === 'in');
    inBtn.classList.toggle('in', highlightMode === 'in');
    antiBtn.classList.toggle('active', highlightMode === 'anti');
    antiBtn.classList.toggle('anti', highlightMode === 'anti');
  }

  function setHighlightMode(mode) {
    highlightMode = highlightMode === mode ? 'off' : mode;
    syncHlButtons();
  }

  function syncPauseBtn() {
    const lbl = document.getElementById('lbl-pause');
    if (lbl) lbl.textContent = paused ? t('common.resume') : t('common.pause');
  }

  window.togglePause = function () {
    const now = performance.now();
    if (!paused) {
      frozenTime = t0 ? (now - t0 - pauseAccum) / 1000 : 0;
      pauseStarted = now;
      paused = true;
    } else {
      if (pauseStarted) pauseAccum += now - pauseStarted;
      paused = false;
    }
    syncPauseBtn();
  };

  window.resetAll = function () {
    amplitude = AMP_DEFAULT;
    loops = LOOPS_DEFAULT;
    highlightMode = 'off';
    selectedIndex = null;
    paused = false;
    pauseAccum = 0;
    pauseStarted = 0;
    frozenTime = 0;
    t0 = 0;
    syncSliderLabels();
    syncHlButtons();
    syncPauseBtn();
  };

  window.toggleFullscreen = function () {
    const root = document.getElementById('sw-fs-root');
    if (!isFullscreen()) {
      const req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (req) req.call(root);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  };

  function setupCanvas(el) {
    if (!el) return null;
    const c = el.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = el.getBoundingClientRect();
    const nextW = Math.max(1, Math.round(rect.width * dpr));
    const nextH = Math.max(1, Math.round(rect.height * dpr));
    if (el.width !== nextW || el.height !== nextH) {
      el.width = nextW;
      el.height = nextH;
    }
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.scale(dpr, dpr);
    return { ctx: c, rect, dpr };
  }

  function viewMap(rect) {
    const s = Math.min(rect.width / VW, rect.height / VH);
    const ox = (rect.width - VW * s) / 2;
    const oy = (rect.height - VH * s) / 2;
    return { s, ox, oy };
  }

  function toScreen(x, y, vm) {
    return { x: vm.ox + x * vm.s, y: vm.oy + y * vm.s };
  }

  function waveY(xFromStart, time) {
    return amplitude * Math.sin(loops * Math.PI * xFromStart / L) * Math.cos(OMEGA * time);
  }

  function particleCount() {
    return loops <= 2 ? 8 : 4 * loops;
  }

  function visibleParticles() {
    return PARTICLE_SPEC.slice(0, particleCount());
  }

  function particleX(index) {
    return STRING.x0 + ((index + 1) / particleCount()) * L;
  }

  function uiScale(rect) {
    return Math.min(rect.width / VW, rect.height / VH);
  }

  function viewportScale() {
    let w = window.innerWidth;
    let h = window.innerHeight;
    const root = document.getElementById('sw-fs-root');
    if (isFullscreen() && root) {
      w = root.clientWidth;
      h = root.clientHeight;
    }
    return Math.min(w / 1280, h / 800);
  }

  function syncUiScale() {
    const wrap = document.getElementById('sw-canvas-wrap');
    if (!wrap) return;
    wrap.style.setProperty('--sw-btn-scale', String(viewportScale()));
  }

  function particleRole(id, index) {
    if (loops === 1) {
      if (id === 'H') return 'N';
      if (id === 'D') return 'A';
      return null;
    }
    const slot = index % 4;
    if (slot === 3) return 'N';
    if (slot === 1) return 'A';
    return null;
  }

  function particleLabel(id, index) {
    const role = particleRole(id, index);
    if (!role) return id;
    return id + ' (' + t('suffix.' + role) + ')';
  }

  function isNode(id, index) {
    return particleRole(id, index) === 'N';
  }

  function particleLoop(index) {
    const spec = PARTICLE_SPEC[index];
    if (isNode(spec.id, index)) return null;
    const x = particleX(index) - STRING.x0;
    return Math.floor((loops * x) / L + 1e-9);
  }

  function isPartner(index) {
    if (highlightMode === 'off' || selectedIndex === null) return false;
    if (index === selectedIndex) return false;
    if (isNode(PARTICLE_SPEC[index].id, index) || isNode(PARTICLE_SPEC[selectedIndex].id, selectedIndex)) return false;
    const a = particleLoop(selectedIndex);
    const b = particleLoop(index);
    if (a === null || b === null) return false;
    if (highlightMode === 'in') return (a % 2) === (b % 2);
    if (highlightMode === 'anti') return (a % 2) !== (b % 2);
    return false;
  }

  function highlightActive() {
    return highlightMode !== 'off' && selectedIndex !== null;
  }

  function drawRoundedRect(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function drawVibrator(vm) {
    const box = toScreen(BOX.x, BOX.y, vm);
    const bw = BOX.w * vm.s;
    const bh = BOX.h * vm.s;
    const rod0 = toScreen(STRING.x0, BOX.y, vm);
    const rod1 = toScreen(STRING.x0, STRING.y, vm);

    ctx.strokeStyle = '#475569';
    ctx.lineWidth = Math.max(3, 4 * vm.s);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(rod0.x, rod0.y);
    ctx.lineTo(rod1.x, rod1.y);
    ctx.stroke();

    drawRoundedRect(ctx, box.x, box.y, bw, bh, 8 * vm.s);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = Math.max(2, 2.5 * vm.s);
    ctx.stroke();

    const cx = box.x + bw / 2;
    const cy = box.y + bh / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 11 * vm.s, 0, Math.PI * 2);
    ctx.fillStyle = '#334155';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, 4.5 * vm.s, 0, Math.PI * 2);
    ctx.fillStyle = '#94a3b8';
    ctx.fill();

    ctx.fillStyle = '#475569';
    ctx.font = 'bold ' + Math.max(10, 11 * vm.s) + 'px "Plus Jakarta Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(t('draw.vibrator'), cx, box.y + bh + 8 * vm.s);
  }

  function drawWall(vm) {
    const p = toScreen(WALL.x, WALL.y, vm);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(p.x, p.y, WALL.w * vm.s, WALL.h * vm.s);
  }

  function drawScene(rect, time) {
    const vm = viewMap(rect);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, rect.width, rect.height);

    const left = toScreen(STRING.x0, STRING.y, vm);
    const right = toScreen(STRING.x1, STRING.y, vm);

    ctx.beginPath();
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = Math.max(1.5, 2 * vm.s);
    ctx.setLineDash([6 * vm.s, 4 * vm.s]);
    ctx.moveTo(left.x, left.y);
    ctx.lineTo(right.x, right.y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#64748b';
    ctx.font = 'bold ' + Math.max(11, 12 * vm.s) + 'px "Plus Jakarta Sans", sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText(t('draw.equilibrium'), right.x - 10 * vm.s, left.y - 8 * vm.s);

    const uiS = uiScale(rect);
    const keyPad = 14 * uiS;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.font = 'bold ' + (12 * uiS) + 'px "Plus Jakarta Sans", "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#334155';
    const keyX = rect.width - keyPad;
    const keyY = keyPad;
    ctx.fillText(t('draw.nodeKey'), keyX, keyY);
    ctx.fillText(t('draw.antiKey'), keyX, keyY + 18 * uiS);

    ctx.beginPath();
    ctx.strokeStyle = '#e879f9';
    ctx.lineWidth = Math.max(3, 4 * vm.s);
    ctx.shadowColor = 'rgba(232, 121, 249, 0.55)';
    ctx.shadowBlur = 8 * vm.s;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    const steps = 220;
    for (let i = 0; i <= steps; i++) {
      const x = STRING.x0 + (L * i) / steps;
      const y = STRING.y - waveY(x - STRING.x0, time);
      const p = toScreen(x, y, vm);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    drawVibrator(vm);
    drawWall(vm);

    const r = Math.max(5.5, 7 * vm.s);
    const fontPx = loops >= 4
      ? Math.max(9, 10 * vm.s)
      : Math.max(10, 12 * vm.s);
    const hlOn = highlightActive();
    lastHit = [];

    visibleParticles().forEach((spec, index) => {
      const x = particleX(index);
      const y = STRING.y - waveY(x - STRING.x0, time);
      const p = toScreen(x, y, vm);
      lastHit.push({ index: index, x: p.x, y: p.y, r: r });

      const isSelected = selectedIndex === index;
      const partner = isPartner(index);
      const dim = hlOn && !isSelected && !partner;
      const radius = (isSelected || partner) ? r + 4 * vm.s : r;

      ctx.save();
      ctx.globalAlpha = dim ? 0.28 : 1;

      if (isSelected && highlightMode !== 'off') {
        ctx.beginPath();
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 12 * vm.s;
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = Math.max(3, 4 * vm.s);
        ctx.arc(p.x, p.y, radius + 4 * vm.s, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else if (isSelected) {
        ctx.beginPath();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = Math.max(3, 3.5 * vm.s);
        ctx.arc(p.x, p.y, radius + 3 * vm.s, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (partner) {
        const stroke = highlightMode === 'in' ? '#10b981' : '#e11d48';
        ctx.beginPath();
        ctx.shadowColor = stroke;
        ctx.shadowBlur = 16 * vm.s;
        ctx.strokeStyle = stroke;
        ctx.lineWidth = Math.max(3, 4 * vm.s);
        ctx.arc(p.x, p.y, radius + 4 * vm.s, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      ctx.beginPath();
      ctx.fillStyle = spec.color;
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = Math.max(1, 1.2 * vm.s);
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.28)';
      ctx.stroke();

      const nearBox = x < BOX.x + BOX.w + 20;
      const labelAbove = nearBox && spec.id !== 'A';
      const stagger = (index % 2 === 0 ? 1 : 1.55) * (loops >= 4 ? 16 : 18);
      const label = particleLabel(spec.id, index);
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold ' + fontPx + 'px "Plus Jakarta Sans", "Noto Sans TC", sans-serif';
      const wallLabelLeft = Math.abs(x - STRING.x1) < 0.75;
      ctx.textAlign = wallLabelLeft ? 'right' : 'center';
      const labelX = wallLabelLeft ? toScreen(STRING.x1, STRING.y, vm).x - 4 * vm.s : p.x;
      if (labelAbove) {
        ctx.textBaseline = 'bottom';
        ctx.fillText(label, labelX, p.y - radius - 4 * vm.s);
      } else {
        ctx.textBaseline = 'top';
        ctx.fillText(label, labelX, p.y + radius + stagger * 0.35 * vm.s);
      }
      ctx.restore();
    });
  }

  function hitParticle(mx, my) {
    let best = null;
    let bestDist = 18;
    for (let i = 0; i < lastHit.length; i++) {
      const h = lastHit[i];
      const dx = mx - h.x;
      const dy = my - h.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      const limit = Math.max(bestDist, h.r + 10);
      if (d <= limit && (best === null || d < bestDist)) {
        best = h.index;
        bestDist = d;
      }
    }
    return best;
  }

  function onCanvasClick(e) {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const hit = hitParticle(mx, my);
    if (hit === null) return;
    selectedIndex = selectedIndex === hit ? null : hit;
  }

  function loop(ts) {
    if (!running) return;
    if (!t0) t0 = ts;
    const time = paused ? frozenTime : (ts - t0 - pauseAccum) / 1000;
    const setup = setupCanvas(canvas);
    if (!setup) {
      animId = requestAnimationFrame(loop);
      return;
    }
    ctx = setup.ctx;
    viewRect = setup.rect;
    syncUiScale();
    drawScene(setup.rect, time);
    animId = requestAnimationFrame(loop);
  }

  function checkCDN() {
    const warn = document.getElementById('cdn-warning');
    if (typeof lucide === 'undefined' && warn) warn.classList.remove('hidden');
  }

  window.addEventListener('resize', () => {
    if (canvas) setupCanvas(canvas);
  });

  document.addEventListener('fullscreenchange', () => {
    syncFsUi();
    requestAnimationFrame(() => { if (canvas) setupCanvas(canvas); });
  });
  document.addEventListener('webkitfullscreenchange', () => {
    syncFsUi();
    requestAnimationFrame(() => { if (canvas) setupCanvas(canvas); });
  });

  window.addEventListener('DOMContentLoaded', () => {
    if (new URLSearchParams(location.search).get('embed') === '1' || window.self !== window.top) {
      document.body.classList.add('embed-mode');
    }
    canvas = document.getElementById('swCanvas');
    const ampEl = document.getElementById('amp-slider');
    const loopEl = document.getElementById('loops-slider');
    ampEl.addEventListener('input', () => {
      amplitude = Number(ampEl.value);
      syncSliderLabels();
    });
    loopEl.addEventListener('input', () => {
      loops = Math.round(Number(loopEl.value));
      if (selectedIndex !== null && selectedIndex >= particleCount()) selectedIndex = null;
      syncSliderLabels();
    });
    document.getElementById('hl-in').addEventListener('click', () => setHighlightMode('in'));
    document.getElementById('hl-anti').addEventListener('click', () => setHighlightMode('anti'));
    canvas.addEventListener('click', onCanvasClick);
    applyLanguage();
    syncSliderLabels();
    syncHlButtons();
    checkCDN();
    setTimeout(checkCDN, 400);
    loop(performance.now());
  });
})();
  </script>
</body>
</html>
