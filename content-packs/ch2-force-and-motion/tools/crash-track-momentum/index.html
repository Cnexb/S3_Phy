<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../shared/s3phy-embed.css">
  <link rel="stylesheet" href="../shared/s3phy-n1-sim.css">
  <script src="../shared/s3phy-embed-init.js"></script>
  <script src="../shared/s3phy-n1-draw.js"></script>
  <title>Crash track | Momentum Lab</title>
  <style>
    
  </style>
</head>
<body class="n1-lab n1-sim">
  <div class="deco-blob deco-blob--accent" aria-hidden="true"></div>
  <div class="deco-blob deco-blob--emerald" aria-hidden="true"></div>
  <div class="wrap" id="labShell">
    <header class="n1-header">
      <div class="n1-header__inner">
        <div class="n1-brand">
          <div class="n1-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none">
              <rect x="3" y="12" width="10" height="8" rx="2" fill="#34d399"/>
              <rect x="15" y="12" width="10" height="8" rx="2" fill="#38bdf8"/>
            </svg>
          </div>
          <div>
            <div class="n1-title-row">
              <h1><span class="en">Crash track</span><span class="zh">碰撞軌道</span></h1>
              <span class="n1-chip">HKDSE Physics</span>
            </div>
            <p class="n1-sub"><span class="en">HKDSE Physics · Momentum · p = mv · collisions</span><span class="zh">HKDSE 物理 · 動量 · p = mv · 碰撞</span></p>
          </div>
        </div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="btn-en" class="active">EN</button>
          <button type="button" id="btn-zh">繁中</button>
        </div>
      </div>
    </header>
    <main class="n1-main">
    <section class="card glass-panel">
      <div class="card-hd">
        <div>
          <h2 id="hd-title"></h2>
          <p id="hd-sub"></p>
        </div>
        <div class="hd-actions">
          <div class="hd-crash-row">
            <div class="hd-run">
              <button class="btn teal" type="button" id="btn-play"><span class="en">Start</span><span class="zh">開始</span></button>
              <button class="btn sec" type="button" id="btn-reset"><span class="en">Reset</span><span class="zh">重設</span></button>
            </div>
            <div class="hd-crash">
              <h3><span class="en">Collision type</span><span class="zh">碰撞類型</span></h3>
              <div class="seg" id="seg-e">
                <button type="button" data-e="1" class="on"><span class="en">Elastic</span><span class="zh">彈性</span></button>
                <button type="button" data-e="0.5"><span class="en">Inelastic</span><span class="zh">非彈性</span></button>
                <button type="button" data-e="0"><span class="en">Perfectly inelastic</span><span class="zh">完全非彈性</span></button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="workspace">
        <div class="stage">

          <div class="hint-chip" id="hint"></div>
          <aside class="hud hud-left">
            <div>
              <h3><span class="en">Live numbers</span><span class="zh">即時數據</span></h3>
              <div class="readout" id="stats"></div>
            </div>
            <div>
              <h3><span class="en">Before vs after</span><span class="zh">碰撞前後</span></h3>
              <div class="bars" id="bars"></div>
            </div>
          </aside>
          <aside class="hud hud-right" id="hud-controls">
            <div class="hud-hd">
              <h3><span class="en">Control bar</span><span class="zh">控制列</span></h3>
              <button class="hud-toggle" type="button" id="btn-hide-controls"><span class="en">Hide</span><span class="zh">隱藏</span></button>
            </div>
            <div class="hud-body">
              <div class="slider-wrap">
                <div class="slider-head"><span class="en">Cart A mass</span><span class="zh">車子 A 質量</span><em class="a" id="val-m1">2.0 kg</em></div>
                <input class="a-range" type="range" id="sl-m1" min="0.5" max="12" step="0.5" value="2" />
              </div>
              <div class="slider-wrap">
                <div class="slider-head"><span class="en">Cart A velocity</span><span class="zh">車子 A 速度</span><em class="a" id="val-u1">+4.0 m/s</em></div>
                <input class="a-range" type="range" id="sl-u1" min="-10" max="10" step="0.5" value="4" />
              </div>
              <div class="slider-wrap">
                <div class="slider-head"><span class="en">Cart B mass</span><span class="zh">車子 B 質量</span><em class="b" id="val-m2">2.0 kg</em></div>
                <input class="b-range" type="range" id="sl-m2" min="0.5" max="12" step="0.5" value="2" />
              </div>
              <div class="slider-wrap">
                <div class="slider-head"><span class="en">Cart B velocity</span><span class="zh">車子 B 速度</span><em class="b" id="val-u2">0.0 m/s</em></div>
                <input class="b-range" type="range" id="sl-u2" min="-10" max="10" step="0.5" value="0" />
              </div>
            </div>
          </aside>
          <button class="fs-btn" type="button" data-fs="labShell"><span class="en">Full screen</span><span class="zh">全螢幕</span></button>
          <canvas id="cv" width="900" height="460"></canvas>

        </div>
      </div>
    </section>
    </main>
  </div>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let lang = "en";
  const t = (en, zh) => (lang === "zh" ? zh : en);
  function setLang(next) {
    lang = next;
    document.documentElement.lang = next === "zh" ? "zh-HK" : "en";
    $("btn-en").classList.toggle("active", next === "en");
    $("btn-zh").classList.toggle("active", next === "zh");
    updateUI();
  }
  $("btn-en").onclick = () => setLang("en");
  $("btn-zh").onclick = () => setLang("zh");
  function applyLangFromHub(raw) {
    const next = (raw === "zh-Hant" || raw === "zhHant" || raw === "zh" || raw === "zh-HK") ? "zh" : "en";
    setLang(next);
  }
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q) applyLangFromHub(q);
  } catch (e) { /* ignore */ }
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "s3phy:lang") applyLangFromHub(ev.data.lang);
  });

  function syncHideControls() {
    const hidden = $("hud-controls").classList.contains("collapsed");
    $("btn-hide-controls").innerHTML = hidden
      ? '<span class="en">Show</span><span class="zh">顯示</span>'
      : '<span class="en">Hide</span><span class="zh">隱藏</span>';
  }
  $("btn-hide-controls").onclick = () => {
    $("hud-controls").classList.toggle("collapsed");
    syncHideControls();
  };
  document.querySelectorAll("[data-fs]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const el = $(btn.dataset.fs);
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    });
  });
  const canvasCache = new WeakMap();
  function fitCanvas(canvas) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(320, rect.width || 320);
    const h = Math.max(260, rect.height || 460);
    const prev = canvasCache.get(canvas);
    const ctx = canvas.getContext("2d");
    if (!prev || prev.w !== w || prev.h !== h || prev.dpr !== dpr) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvasCache.set(canvas, { w, h, dpr });
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }
  const Art = window.N1Art;
  function roundRect(ctx, x, y, w, h, r) { Art.roundRect(ctx, x, y, w, h, r); }
  function arrow(ctx, x1, y1, x2, y2, color, width) {
    Art.drawArrow(ctx, x1, y1, x2, y2, color, width || 3.2);
  }
  function fmt(n, d) {
    if (!isFinite(n)) return "—";
    const s = Number(n).toFixed(d == null ? 2 : d);
    return (n > 0 && d !== 0 ? "+" : "") + s;
  }
  function fmtAbs(n, d) {
    if (!isFinite(n)) return "—";
    return Number(n).toFixed(d == null ? 2 : d);
  }
  const pOf = (m, v) => m * v;
  const keOf = (m, v) => 0.5 * m * v * v;
  function spawnSparks(x, y) {
    for (let i = 0; i < 14; i++) {
      S.sparks.push({
        x, y,
        vx: (Math.random() - 0.5) * 180,
        vy: (Math.random() - 0.8) * 140,
        life: 1,
        c: Math.random() > 0.5 ? "#34d399" : "#f97316"
      });
    }
  }
  function stat(label, value, cls) {
    const d = document.createElement("div");
    d.className = "stat" + (cls ? " " + cls : "");
    d.innerHTML = "<span></span><b></b>";
    d.querySelector("span").textContent = label;
    d.querySelector("b").textContent = value;
    $("stats").appendChild(d);
  }
  function bar(label, frac, cls, val) {
    const row = document.createElement("div");
    row.className = "bar-row";
    const a = document.createElement("span"); a.textContent = label;
    const b = document.createElement("div"); b.className = "bar";
    const i = document.createElement("i"); i.className = cls; i.style.width = Math.min(100, Math.max(0, frac * 100)) + "%";
    b.appendChild(i);
    const c = document.createElement("span"); c.textContent = val;
    row.appendChild(a); row.appendChild(b); row.appendChild(c);
    $("bars").appendChild(row);
  }

  function collide(m1, m2, u1, u2, e) {
    const v1 = (m1 * u1 + m2 * u2 - m2 * e * (u1 - u2)) / (m1 + m2);
    const v2 = (m1 * u1 + m2 * u2 + m1 * e * (u1 - u2)) / (m1 + m2);
    return { v1, v2 };
  }
  const TRACK = 12;
  const S = {
    running: false, speed: 1, hit: false, e: 1,
    m1: 2, m2: 2, u1: 4, u2: 0,
    v1: 0, v2: 0, x1: 3.0, x2: 7.2,
    sparks: [], flash: 0, stuck: false
  };
  const cv = $("cv");
  function cartW(m) { return 1.2 + Math.min(1.7, m * 0.12); }
  function resetCrash() {
    S.running = false; S.hit = false; S.stuck = false; S.flash = 0; S.sparks = [];
    S.v1 = S.u1; S.v2 = S.u2;
    const w1 = cartW(S.m1), w2 = cartW(S.m2);
    S.x1 = 2.2; S.x2 = 2.2 + w1 + 3.4;
    if (S.x2 + w2 > TRACK - 0.4) S.x2 = TRACK - 0.4 - w2;
  }
  function restoreCrashControls() {
    S.m1 = 2; S.m2 = 2; S.u1 = 4; S.u2 = 0;
    $("sl-m1").value = "2"; $("sl-m2").value = "2"; $("sl-u1").value = "4"; $("sl-u2").value = "0";
    resetCrash();
  }
  document.querySelectorAll("#seg-e button").forEach((b) => {
    b.onclick = () => {
      S.e = Number(b.dataset.e);
      document.querySelectorAll("#seg-e button").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      restoreCrashControls();
      updateUI();
    };
  });
  function bindSlider(id, key) {
    $(id).addEventListener("input", () => {
      if (S.running) return;
      S[key] = Number($(id).value);
      resetCrash();
      updateUI();
    });
  }
  bindSlider("sl-m1", "m1"); bindSlider("sl-m2", "m2");
  bindSlider("sl-u1", "u1"); bindSlider("sl-u2", "u2");
  $("btn-play").onclick = () => {
    if (S.running) return;
    resetCrash(); S.v1 = S.u1; S.v2 = S.u2; S.running = true; updateUI();
  };
  $("btn-reset").onclick = () => {
    S.e = 1;
    document.querySelectorAll("#seg-e button").forEach((b) => b.classList.toggle("on", Number(b.dataset.e) === 1));
    restoreCrashControls(); updateUI();
  };
  function liveCrash() {
    const p1 = pOf(S.m1, S.running || S.hit ? S.v1 : S.u1);
    const p2 = pOf(S.m2, S.running || S.hit ? S.v2 : S.u2);
    const k1 = keOf(S.m1, S.running || S.hit ? S.v1 : S.u1);
    const k2 = keOf(S.m2, S.running || S.hit ? S.v2 : S.u2);
    const p0 = pOf(S.m1, S.u1) + pOf(S.m2, S.u2);
    const k0 = keOf(S.m1, S.u1) + keOf(S.m2, S.u2);
    return { p1, p2, k1, k2, p: p1 + p2, k: k1 + k2, p0, k0 };
  }
  function updateUI() {
    $("hd-title").textContent = t("Crash track", "碰撞軌道");
    $("hd-sub").textContent = t("Choose elastic, inelastic or perfectly inelastic. On a smooth track, momentum is always conserved.", "選擇彈性、非彈性或完全非彈性。光滑軌道上動量總是守恆。");
    $("hint").style.display = "none";
    $("val-m1").textContent = fmtAbs(S.m1, 1) + " kg";
    $("val-m2").textContent = fmtAbs(S.m2, 1) + " kg";
    $("val-u1").textContent = fmt(S.u1, 1) + " m/s";
    $("val-u2").textContent = fmt(S.u2, 1) + " m/s";
    $("stats").innerHTML = ""; $("bars").innerHTML = "";
    const L = liveCrash();
    stat(t("p of A", "A 的動量"), fmt(L.p1, 2) + " kg m/s", "a");
    stat(t("p of B", "B 的動量"), fmt(L.p2, 2) + " kg m/s", "b");
    const kmax = Math.max(L.k0, S.hit ? L.k : 0, 0.01);
    bar(t("KE before", "前動能"), L.k0 / kmax, "ke", fmtAbs(L.k0, 2) + " J");
    if (S.hit) {
      bar(t("KE after", "後動能"), L.k / kmax, "ke", fmtAbs(L.k, 2) + " J");
      const vmax = Math.max(Math.abs(S.v1), Math.abs(S.v2), 0.01);
      bar(t("vA after", "後 vA"), Math.abs(S.v1) / vmax, "a", fmt(S.v1, 2) + " m/s");
      bar(t("vB after", "後 vB"), Math.abs(S.v2) / vmax, "b", fmt(S.v2, 2) + " m/s");
    }
    ["sl-m1","sl-m2","sl-u1","sl-u2"].forEach((id) => { $(id).disabled = S.running; });
  }
  function stepCrash(dt) {
    const w1 = cartW(S.m1), w2 = cartW(S.m2);
    if (!S.running) return;
    S.x1 += S.v1 * dt * S.speed; S.x2 += S.v2 * dt * S.speed;
    if (!S.hit && S.x1 + w1 >= S.x2 && S.v1 > S.v2) {
      const out = collide(S.m1, S.m2, S.v1, S.v2, S.e);
      S.v1 = out.v1; S.v2 = out.v2; S.hit = true; S.stuck = S.e === 0; S.flash = 1;
      spawnSparks((S.x1 + w1 + S.x2) / 2, 0);
      S.x2 = S.x1 + w1 + 0.01;
      if (S.stuck) {
        const v = (S.m1 * S.v1 + S.m2 * S.v2) / (S.m1 + S.m2);
        S.v1 = v; S.v2 = v; S.x2 = S.x1 + w1;
      }
    }
    if (S.stuck) S.x2 = S.x1 + w1;
    if (S.hit && Math.abs(S.v1) < 0.02 && Math.abs(S.v2) < 0.02) S.running = false;
    const rightMost = Math.max(S.x1 + w1, S.x2 + w2);
    const leftMost = Math.min(S.x1, S.x2);
    if (leftMost > TRACK + 1.5 || rightMost < -1.5) S.running = false;
  }
  function drawCart(ctx, x, ground, w, h, palette, label, vel, mass) {
    ctx.save();
    Art.drawGlowingBox(ctx, x, ground - h, w, h, palette.top, palette.bot, palette.stroke);
    ctx.fillStyle = "#fff";
    ctx.font = Art.font(800, Math.max(13, Math.min(18, h * 0.32)));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + w / 2, ground - h / 2 - 8);
    ctx.font = Art.font(700, Math.max(10, Math.min(13, h * 0.22)));
    ctx.fillText(fmtAbs(mass, 1) + " kg", x + w / 2, ground - h / 2 + 10);
    ctx.fillStyle = "#334155";
    ctx.beginPath(); ctx.arc(x + w * 0.28, ground - 6, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w * 0.72, ground - 6, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#94a3b8";
    ctx.beginPath(); ctx.arc(x + w * 0.28, ground - 6, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w * 0.72, ground - 6, 2.4, 0, Math.PI * 2); ctx.fill();
    if (Math.abs(vel) > 0.05) {
      const dir = vel > 0 ? 1 : -1;
      const len = 18 + Math.min(54, Math.abs(vel) * 8);
      const y = ground - h - 16;
      const x1 = x + w / 2;
      arrow(ctx, x1, y, x1 + dir * len, y, palette.stroke, 3.2);
      ctx.fillStyle = palette.stroke;
      ctx.font = Art.mono(600, 11);
      ctx.textAlign = dir > 0 ? "left" : "right";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(fmt(vel, 1) + " m/s", x1 + dir * (len + 6), y + 4);
    }
    ctx.restore();
  }
  function drawScene(dt) {
    const { ctx, w, h } = fitCanvas(cv);
    const ground = h * 0.72;
    Art.drawFloor(ctx, w, h, ground + 8, t("Smooth track", "光滑軌道"));
    const pad = 36; const scale = (w - pad * 2) / TRACK; const X = (m) => pad + m * scale;
    S.flash *= 0.9;
    if (S.flash > 0.04) {
      ctx.fillStyle = "rgba(249,115,22," + (S.flash * 0.18) + ")";
      ctx.fillRect(0, 0, w, h);
    }
    S.sparks.forEach((p) => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; p.life -= dt * 1.8;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(X(p.x), ground - 40 + p.y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });
    S.sparks = S.sparks.filter((p) => p.life > 0);
    const palA = { top: Art.C.greenTop, bot: Art.C.greenBot, stroke: Art.C.greenStroke };
    const palB = { top: Art.C.skyTop, bot: Art.C.skyBot, stroke: Art.C.skyStroke };
    const palAB = { top: "#a78bfa", bot: "#6d28d9", stroke: "#5b21b6" };
    const w1 = cartW(S.m1), w2 = cartW(S.m2);
    const h1 = 56 + Math.min(28, S.m1 * 2);
    const h2 = 56 + Math.min(28, S.m2 * 2);
    if (S.stuck && S.hit) {
      const wm = (w1 + w2) * scale; const hm = Math.max(h1, h2);
      drawCart(ctx, X(S.x1), ground, wm, hm, palAB, "A+B", S.v1, S.m1 + S.m2);
    } else {
      drawCart(ctx, X(S.x1), ground, w1 * scale, h1, palA, "A", S.running || S.hit ? S.v1 : S.u1, S.m1);
      drawCart(ctx, X(S.x2), ground, w2 * scale, h2, palB, "B", S.running || S.hit ? S.v2 : S.u2, S.m2);
    }
  }
  let last = performance.now(); let uiAcc = 0;
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    stepCrash(dt); drawScene(dt);
    uiAcc += dt;
    if (!S.running || uiAcc > 0.12) { if (S.running) updateUI(); uiAcc = 0; }
    requestAnimationFrame(loop);
  }
  resetCrash(); updateUI(); requestAnimationFrame(loop);

})();
</script>
</body>
</html>
