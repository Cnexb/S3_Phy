<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../shared/s3phy-embed.css">
  <link rel="stylesheet" href="../shared/s3phy-n1-sim.css">
  <script src="../shared/s3phy-embed-init.js"></script>
  <script src="../shared/s3phy-n1-draw.js"></script>
  <title>Bullet swing | Momentum Lab</title>
  <style>
    
  </style>
</head>
<body class="n1-lab n1-sim">
  <div class="deco-blob deco-blob--accent" aria-hidden="true"></div>
  <div class="deco-blob deco-blob--emerald" aria-hidden="true"></div>
  <div class="wrap" id="labShell">
    <header class="n1-header">
      <div class="n1-header__inner">
        <div class="n1-brand">
          <div class="n1-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none">
              <rect x="12" y="8" width="10" height="10" rx="2" fill="#38bdf8"/>
              <path d="M3 13h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M9 10l3 3-3 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <div class="n1-title-row">
              <h1><span class="en">Bullet swing</span><span class="zh">子彈擺</span></h1>
              <span class="n1-chip">HKDSE Physics</span>
            </div>
            <p class="n1-sub"><span class="en">HKDSE Physics · Momentum then energy</span><span class="zh">HKDSE 物理 · 先動量，後能量</span></p>
          </div>
        </div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="btn-en" class="active">EN</button>
          <button type="button" id="btn-zh">繁中</button>
        </div>
      </div>
    </header>
    <main class="n1-main">
    <section class="card glass-panel">
      <div class="card-hd">
        <div>
          <h2 id="hd-title"></h2>
          <p id="hd-sub"></p>
        </div>
        <div class="hd-actions">
          <div class="hd-run">
            <button class="btn teal" type="button" id="btn-play"><span class="en">Fire</span><span class="zh">發射</span></button>
            <button class="btn sec" type="button" id="btn-reset"><span class="en">Reset</span><span class="zh">重設</span></button>
            <button class="btn sec fs-btn" type="button" id="btn-fs"><span class="en">Full screen</span><span class="zh">全螢幕</span></button>
            <button class="btn sec" type="button" id="btn-unfs" hidden><span class="en">Exit full screen</span><span class="zh">退出全螢幕</span></button>
          </div>
        </div>
      </div>
      <div class="workspace">
        <div class="stage">

          <div class="hint-chip" id="hint"></div>
          <aside class="hud hud-left">
            <div>
              <h3><span class="en">Before vs after</span><span class="zh">碰撞前後</span></h3>
              <div class="bars" id="bars"></div>
            </div>
          </aside>
          <aside class="hud hud-right" id="hud-controls">
            <div class="hud-hd">
              <h3><span class="en">Control bar</span><span class="zh">控制列</span></h3>
              <button class="hud-toggle" type="button" id="btn-hide-controls"><span class="en">Hide</span><span class="zh">隱藏</span></button>
            </div>
            <div class="hud-body">
              <div class="slider-wrap">
                <div class="slider-head"><span class="en">Bullet mass</span><span class="zh">子彈質量</span><em class="a" id="val-bm">20 g</em></div>
                <input class="a-range" type="range" id="sl-bm" min="5" max="80" step="1" value="20" />
              </div>
              <div class="slider-wrap">
                <div class="slider-head"><span class="en">Bullet speed</span><span class="zh">子彈速率</span><em class="a" id="val-bu">300 m/s</em></div>
                <input class="a-range" type="range" id="sl-bu" min="50" max="500" step="10" value="300" />
              </div>
              <div class="slider-wrap">
                <div class="slider-head"><span class="en">Block mass</span><span class="zh">木塊質量</span><em class="b" id="val-bM">5.0 kg</em></div>
                <input class="b-range" type="range" id="sl-bM" min="1" max="10" step="0.5" value="5" />
              </div>
            </div>
          </aside>
          <canvas id="cv" width="900" height="460"></canvas>

        </div>
      </div>
    </section>
    </main>
  </div>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let lang = "en";
  const t = (en, zh) => (lang === "zh" ? zh : en);
  function setLang(next) {
    lang = next;
    document.documentElement.lang = next === "zh" ? "zh-HK" : "en";
    $("btn-en").classList.toggle("active", next === "en");
    $("btn-zh").classList.toggle("active", next === "zh");
    updateUI();
  }
  $("btn-en").onclick = () => setLang("en");
  $("btn-zh").onclick = () => setLang("zh");
  function applyLangFromHub(raw) {
    const next = (raw === "zh-Hant" || raw === "zhHant" || raw === "zh" || raw === "zh-HK") ? "zh" : "en";
    setLang(next);
  }
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q) applyLangFromHub(q);
  } catch (e) { /* ignore */ }
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "s3phy:lang") applyLangFromHub(ev.data.lang);
  });

  function syncHideControls() {
    const hidden = $("hud-controls").classList.contains("collapsed");
    $("btn-hide-controls").innerHTML = hidden
      ? '<span class="en">Show</span><span class="zh">顯示</span>'
      : '<span class="en">Hide</span><span class="zh">隱藏</span>';
  }
  $("btn-hide-controls").onclick = () => {
    $("hud-controls").classList.toggle("collapsed");
    syncHideControls();
  };
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFsButtons() {
    $("btn-fs").hidden = isFullscreen();
    $("btn-unfs").hidden = !isFullscreen();
  }
  $("btn-fs").onclick = () => {
    const el = $("labShell");
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  };
  $("btn-unfs").onclick = () => {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  };
  document.addEventListener("fullscreenchange", syncFsButtons);
  document.addEventListener("webkitfullscreenchange", syncFsButtons);
  syncFsButtons();
  const canvasCache = new WeakMap();
  function fitCanvas(canvas) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(320, rect.width || 320);
    const h = Math.max(260, rect.height || 460);
    const prev = canvasCache.get(canvas);
    const ctx = canvas.getContext("2d");
    if (!prev || prev.w !== w || prev.h !== h || prev.dpr !== dpr) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvasCache.set(canvas, { w, h, dpr });
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }
  const Art = window.N1Art;
  function roundRect(ctx, x, y, w, h, r) { Art.roundRect(ctx, x, y, w, h, r); }
  function arrow(ctx, x1, y1, x2, y2, color, width) {
    Art.drawArrow(ctx, x1, y1, x2, y2, color, width || 3.2);
  }
  function fmt(n, d) {
    if (!isFinite(n)) return "—";
    const s = Number(n).toFixed(d == null ? 2 : d);
    return (n > 0 && d !== 0 ? "+" : "") + s;
  }
  function fmtAbs(n, d) {
    if (!isFinite(n)) return "—";
    return Number(n).toFixed(d == null ? 2 : d);
  }
  const pOf = (m, v) => m * v;
  const keOf = (m, v) => 0.5 * m * v * v;
  function spawnSparks(x, y) {
    for (let i = 0; i < 14; i++) {
      S.sparks.push({
        x, y,
        vx: (Math.random() - 0.5) * 180,
        vy: (Math.random() - 0.8) * 140,
        life: 1,
        c: Math.random() > 0.5 ? "#34d399" : "#f97316"
      });
    }
  }
  function bar(label, frac, cls, val) {
    const row = document.createElement("div");
    row.className = "bar-row";
    const a = document.createElement("span"); a.textContent = label;
    const b = document.createElement("div"); b.className = "bar";
    const i = document.createElement("i"); i.className = cls; i.style.width = Math.min(100, Math.max(0, frac * 100)) + "%";
    b.appendChild(i);
    const c = document.createElement("span"); c.textContent = val;
    row.appendChild(a); row.appendChild(b); row.appendChild(c);
    $("bars").appendChild(row);
  }

  const G = 9.81;
  const S = {
    running: false, speed: 1,
    bm: 0.02, bu: 300, bM: 5, bL: 1.5,
    bphase: "idle", bx: 0.28, theta: 0, omega: 0, embedT: 0, thPeak: 0,
    sparks: [], flash: 0
  };
  const cv = $("cv");
  const BALLISTIC = { pivot: 2.45, blockW: 0.38, blockH: 0.32, visU: 1.9 };
  function blockWorldSize() {
    const s = Math.pow(S.bM / 5, 0.4);
    return { w: BALLISTIC.blockW * s, h: BALLISTIC.blockH * s };
  }
  function resetBullet() {
    S.running = false; S.bphase = "idle"; S.bx = 0.28;
    S.theta = 0; S.omega = 0; S.embedT = 0; S.thPeak = 0; S.flash = 0; S.sparks = [];
  }
  function restoreBulletControls() {
    S.bm = 0.02; S.bu = 300; S.bM = 5; S.bL = 1.5;
    $("sl-bm").value = "20"; $("sl-bu").value = "300"; $("sl-bM").value = "5";
    resetBullet();
  }
  function bulletLive() {
    const m = S.bm, M = S.bM, u = S.bu, L = S.bL;
    const tot = m + M;
    const p0 = m * u;
    const vc = tot > 0 ? p0 / tot : 0;
    const kBullet0 = keOf(m, u);
    const kBox0 = 0;
    const kBullet1 = keOf(m, vc);
    const kBox1 = keOf(M, vc);
    const k0 = kBullet0;
    const k1 = kBullet1 + kBox1;
    const hMax = (vc * vc) / (2 * G);
    const c = Math.max(-1, Math.min(1, 1 - hMax / Math.max(L, 1e-6)));
    const thMax = Math.acos(c);
    const hNow = L * (1 - Math.cos(S.theta));
    const vTan = L * S.omega;
    const kNow = S.bphase === "approach" || S.bphase === "idle" ? k0 : keOf(tot, vTan);
    const peNow = tot * G * hNow;
    return { m, M, u, L, tot, p0, vc, k0, k1, kBullet0, kBox0, kBullet1, kBox1, hMax, thMax, hNow, kNow, peNow, lost: k0 - k1 };
  }
  function bindSlider(id, key) {
    $(id).addEventListener("input", () => {
      if (S.running) return;
      S[key] = Number($(id).value);
      resetBullet(); updateUI();
    });
  }
  bindSlider("sl-bM", "bM"); bindSlider("sl-bu", "bu");
  $("sl-bm").addEventListener("input", () => {
    if (S.running) return;
    S.bm = Number($("sl-bm").value) / 1000;
    resetBullet(); updateUI();
  });
  $("btn-play").onclick = () => {
    if (S.running) return;
    resetBullet(); S.bphase = "approach"; S.running = true; updateUI();
  };
  $("btn-reset").onclick = () => { restoreBulletControls(); updateUI(); };
  function updateUI() {
    $("hd-title").textContent = t("Ballistic pendulum", "彈道擺");
    $("hd-sub").textContent = t("Bullet embeds in a hanging block. Use momentum for the crash, then energy for the rise.", "子彈射入懸掛木塊。碰撞用動量，升高用能量。");
    $("hint").style.display = "none";
    $("val-bm").textContent = fmtAbs(S.bm * 1000, 0) + " g";
    $("val-bu").textContent = fmtAbs(S.bu, 0) + " m/s";
    $("val-bM").textContent = fmtAbs(S.bM, 1) + " kg";
    $("bars").innerHTML = "";
    const B = bulletLive();
    const collided = S.bphase === "embed" || S.bphase === "swing" || S.bphase === "peak";
    const kNow = S.bphase === "swing" || S.bphase === "peak" ? Math.max(0, B.kNow) : (S.bphase === "embed" ? B.k1 : B.k0);
    const kBeforeMax = Math.max(B.kBullet0, B.kBox0, 0.01);
    bar(t("KE bullet before", "子彈前動能"), B.kBullet0 / kBeforeMax, "a", fmtAbs(B.kBullet0, 1) + " J");
    bar(t("KE box before", "木塊前動能"), B.kBox0 / kBeforeMax, "b", fmtAbs(B.kBox0, 2) + " J");
    if (collided) {
      const kBulletAfter = B.tot > 0 ? (B.m / B.tot) * kNow : 0;
      const kBoxAfter = B.tot > 0 ? (B.M / B.tot) * kNow : 0;
      const kAfterMax = Math.max(B.kBullet1, B.kBox1, 0.01);
      bar(t("KE bullet after", "子彈後動能"), kBulletAfter / kAfterMax, "a", fmtAbs(kBulletAfter, 4) + " J");
      bar(t("KE box after", "木塊後動能"), kBoxAfter / kAfterMax, "b", fmtAbs(kBoxAfter, 4) + " J");
    }
    bar(t("PE box before", "木塊前勢能"), 0, "pe", "0.00 J");
    if (collided) {
      const afterMax = Math.max(B.k1, kNow + B.peNow, 0.01);
      bar(t("PE box after", "木塊後勢能"), B.peNow / afterMax, "pe", fmtAbs(B.peNow, 3) + " J");
    }
    ["sl-bm","sl-bu","sl-bM"].forEach((id) => { $(id).disabled = S.running; });
  }
  function stepBullet(dt) {
    const B = bulletLive();
    const rate = S.speed;
    const hitX = BALLISTIC.pivot - blockWorldSize().w / 2 - 0.03;
    if (S.bphase === "approach" && S.running) {
      S.bx += BALLISTIC.visU * dt * rate;
      if (S.bx >= hitX) {
        S.bx = hitX; S.bphase = "embed"; S.embedT = 0; S.flash = 1; spawnSparks(0, 0);
      }
    } else if (S.bphase === "embed" && S.running) {
      S.embedT += dt;
      if (S.embedT > (0.62 / Math.max(0.25, S.speed))) {
        S.bphase = "swing"; S.theta = 0; S.omega = B.vc / Math.max(S.bL, 0.05);
      }
    } else if (S.bphase === "swing" && S.running) {
      const prev = S.omega;
      const n = 8; const hstep = dt * rate / n;
      for (let i = 0; i < n; i++) {
        S.omega += -(G / S.bL) * Math.sin(S.theta) * hstep;
        S.theta += S.omega * hstep;
      }
      if (S.theta > S.thPeak) S.thPeak = S.theta;
      if ((prev > 1e-6 && S.omega <= 0 && S.theta > 0.004) || (S.omega < 0 && S.theta < S.thPeak - 0.003)) {
        S.omega = 0; S.theta = S.thPeak; S.bphase = "peak"; S.running = false; updateUI();
      }
      if (S.theta > Math.PI * 0.9) { S.bphase = "peak"; S.running = false; updateUI(); }
    }
  }
  function drawBullet(ctx, x, y, r, flying) {
    ctx.save(); ctx.translate(x, y);
    if (flying) {
      ctx.globalAlpha = 0.2; ctx.fillStyle = "#64748b";
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath(); ctx.ellipse(-i * 11, 0, r * 0.9, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = "#334155";
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.55, r * 0.72, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = Art.C.orange;
    ctx.beginPath(); ctx.ellipse(r * 0.95, 0, r * 0.55, r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawWoodBlock(ctx, x, y, bw, bh, embedded) {
    ctx.save();
    Art.skyBox(ctx, x, y, bw, bh);
    const title = Math.max(9, Math.min(16, bw * 0.11));
    ctx.fillStyle = "#fff";
    ctx.font = Art.font(800, title);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(embedded ? "m+M" : "M", x + bw / 2, y + bh / 2 - title * 0.35);
    ctx.font = Art.font(700, Math.max(8, title - 3));
    const mass = embedded ? (S.bm + S.bM) : S.bM;
    ctx.fillText(fmtAbs(mass, 2) + " kg", x + bw / 2, y + bh / 2 + title * 0.85);
    if (embedded) drawBullet(ctx, x + bw * 0.28, y + bh / 2, Math.max(4, bw * 0.07), false);
    ctx.restore();
  }
  function drawScene(dt) {
    const { ctx, w, h } = fitCanvas(cv);
    const ceiling = 50; const floorY = h * 0.88;
    Art.drawFloor(ctx, w, h, floorY, t("Smooth floor", "光滑地面"));
    const box = blockWorldSize();
    const worldLeft = 0.12;
    const worldRight = BALLISTIC.pivot + S.bL * 0.95 + box.w;
    const scale = Math.min(
      (floorY - ceiling - 16) / (S.bL + box.h),
      (w - 80) / Math.max(2.4, worldRight - worldLeft)
    );
    const used = (worldRight - worldLeft) * scale;
    const originX = Math.max(36, (w - used) / 2);
    const PX = (mx) => originX + (mx - worldLeft) * scale;
    const PY = (my) => ceiling + my * scale;
    const bw = box.w * scale; const bh = box.h * scale;
    const Lpx = S.bL * scale; const th = S.theta;
    const cx = PX(BALLISTIC.pivot);
    const leftA = cx - bw / 2; const rightA = cx + bw / 2;
    const bx = cx + Lpx * Math.sin(th) - bw / 2;
    const by = PY(S.bL * Math.cos(th));
    const restY = PY(S.bL);
    const embedded = S.bphase !== "idle" && S.bphase !== "approach";
    Art.slateBar(ctx, 28, 18, w - 56, 16);
    ctx.strokeStyle = "#334155"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(leftA, 32); ctx.lineTo(bx, by);
    ctx.moveTo(rightA, 32); ctx.lineTo(bx + bw, by); ctx.stroke();
    if (th > 0.01) {
      ctx.save(); ctx.setLineDash([5, 5]);
      ctx.strokeStyle = "rgba(100,116,139,0.45)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(leftA, 32); ctx.lineTo(leftA, restY);
      ctx.moveTo(rightA, 32); ctx.lineTo(rightA, restY); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      ctx.globalAlpha = 0.28; drawWoodBlock(ctx, leftA, restY, bw, bh, true); ctx.globalAlpha = 1;
    }
    drawWoodBlock(ctx, bx, by, bw, bh, embedded);
    const hitX = BALLISTIC.pivot - box.w / 2 - 0.03;
    if (!embedded) {
      const bpx = PX(S.bx); const bpy = restY + bh / 2;
      drawBullet(ctx, bpx, bpy, Math.max(6, 7 + S.bm * 80), S.bphase === "approach");
      if (S.bphase !== "approach") {
        const gx = PX(0.12) - 86;
        const gy = bpy - 20;
        Art.slateBar(ctx, gx, gy, 78, 40);
        ctx.fillStyle = Art.C.orange;
        roundRect(ctx, gx + 70, gy + 14, 22, 12, 4);
        ctx.fill();
      }
      arrow(ctx, bpx + 16, bpy - 22, bpx + 64, bpy - 22, Art.C.greenBot, 3.2);
      ctx.fillStyle = Art.C.greenBot;
      ctx.font = Art.mono(700, 12);
      ctx.textAlign = "left";
      ctx.fillText(fmtAbs(S.bu, 0) + " m/s", bpx + 70, bpy - 18);
    }
    const hNow = S.bL * (1 - Math.cos(th));
    if (th > 0.008) {
      const y1 = restY + bh; const y2 = by + bh; const hx = bx + bw + 18;
      ctx.strokeStyle = Art.C.orange; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hx - 6, y1); ctx.lineTo(hx + 6, y1);
      ctx.moveTo(hx - 6, y2); ctx.lineTo(hx + 6, y2); ctx.stroke();
      arrow(ctx, hx, y1, hx, Math.min(y2, y1 - 10), Art.C.orange, 2);
      ctx.fillStyle = Art.C.orange;
      ctx.font = Art.font(800, 12); ctx.textAlign = "left";
      ctx.fillText("h = " + fmtAbs(hNow * 100, 2) + " cm", hx + 10, (y1 + y2) / 2 + 4);
    }
    if (S.bphase === "embed") {
      const mx = bx + bw / 2, my = by + bh / 2;
      arrow(ctx, mx, by - 8, mx, by - 52, "#0ea5e9", 3.2);
      arrow(ctx, mx, my + 8, mx, my + 50, Art.C.orange, 3.2);
      arrow(ctx, bx + bw + 6, my, bx + bw + 62, my, Art.C.violet, 3.2);
      ctx.font = Art.font(800, 12);
      ctx.fillStyle = "#0ea5e9"; ctx.textAlign = "center"; ctx.fillText("T", mx, by - 56);
      ctx.fillStyle = Art.C.orange; ctx.fillText("Mg", mx, my + 64);
      ctx.fillStyle = Art.C.violet; ctx.textAlign = "left";
      ctx.fillText(t("collision F", "撞擊力 F"), bx + bw + 66, my + 4);
    }
    S.flash *= 0.9;
    if (S.flash > 0.04) {
      ctx.fillStyle = "rgba(249,115,22," + (S.flash * 0.18) + ")";
      ctx.fillRect(0, 0, w, h);
    }
    const impactX = PX(hitX); const impactY = restY + bh / 2;
    S.sparks.forEach((p) => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; p.life -= dt * 1.8;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(impactX + p.x, impactY + p.y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });
    S.sparks = S.sparks.filter((p) => p.life > 0);
  }
  let last = performance.now(); let uiAcc = 0;
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    stepBullet(dt); drawScene(dt);
    uiAcc += dt;
    if (!S.running || uiAcc > 0.12) { if (S.running) updateUI(); uiAcc = 0; }
    requestAnimationFrame(loop);
  }
  resetBullet(); updateUI(); requestAnimationFrame(loop);

})();
</script>
</body>
</html>
