<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile Motion</title>
    <link rel="stylesheet" href="../shared/s3phy-embed.css">
    <script src="../shared/s3phy-embed-init.js"></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --panel: #ffffff;
            --border: #e8eaed;
            --text: #1a1c2c;
            --muted: #6b7280;
            --btn-bg: #e9ecef;
            --btn-hover: #dee2e6;

            --color-a: #0ea5e9;
            --color-a-x: #0891b2;
            --color-a-y: #7c3aed;
            --color-b: #d97706;
            --color-b-x: #ca8a04;
            --color-b-y: #dc2626;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        html.s3phy-embed, html.s3phy-embed body {
            height: 100%;
            overflow: hidden;
        }
        html.s3phy-embed .logo { display: none; }
        html.s3phy-embed .lang-btn { display: none; }
        html.s3phy-embed .lab-section {
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
        }
        html.s3phy-embed .page-header {
            padding: 6px 12px 4px;
        }
        html.s3phy-embed .page-header h1 { font-size: 1.1rem; }
        html.s3phy-embed .page-header .subtitle { font-size: 0.75rem; margin-top: 2px; }
        html.s3phy-embed #controls {
            max-height: 42vh;
        }

        .lab-section {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
        }
        .lab-section:fullscreen,
        .lab-section:-webkit-full-screen {
            width: 100%;
            height: 100%;
            background: var(--bg);
        }
        .lab-section:fullscreen .page-header,
        .lab-section:-webkit-full-screen .page-header,
        .lab-section:fullscreen #controls,
        .lab-section:-webkit-full-screen #controls,
        .lab-section:fullscreen .left-sidebar,
        .lab-section:-webkit-full-screen .left-sidebar {
            display: none !important;
        }
        .lab-section:fullscreen #canvas-container,
        .lab-section:-webkit-full-screen #canvas-container {
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
            border: none;
        }
        .fs-exit-btn {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.92);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(26, 28, 44, 0.08);
        }
        .fs-exit-btn:hover {
            background: #ffffff;
        }
        .lab-section:fullscreen .fs-exit-btn,
        .lab-section:-webkit-full-screen .fs-exit-btn {
            display: block;
        }

        .page-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px 8px;
        }
        .page-header-text { flex: 1; text-align: center; }
        .page-header h1 {
            margin: 0;
            font-weight: 800;
            font-size: 1.35rem;
            background: linear-gradient(90deg, #2563eb, #16a34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header .subtitle {
            color: var(--muted);
            font-size: 0.82rem;
            margin-top: 4px;
        }
        .lang-btn {
            background: var(--btn-bg);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            color: var(--text);
            border-color: #ced4da;
            background: var(--btn-hover);
        }

        #canvas-container {
            flex: 1 1 auto;
            position: relative;
            width: 100%;
            min-height: 180px;
            overflow: hidden;
            background-color: #ffffff;
            background-image:
                linear-gradient(rgba(26, 28, 44, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(26, 28, 44, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        canvas { display: block; }

        .left-sidebar {
            position: absolute;
            top: 12px;
            left: 12px;
            bottom: 12px;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 20;
            max-height: calc(100% - 24px);
            overflow: auto;
        }

        .panel-box {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            pointer-events: auto;
            box-shadow: 0 2px 12px rgba(26, 28, 44, 0.06);
            backdrop-filter: blur(6px);
        }

        .logo {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--muted);
            text-align: center;
            padding: 8px 10px;
        }

        .stats {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.82rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: auto;
        }
        .stat-group h4 {
            margin: 0 0 6px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            font-size: 0.85rem;
        }
        .stat-row {
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
        }
        .stat-highlight {
            color: var(--text);
            font-weight: 700;
        }
        .text-a { color: var(--color-a); }
        .text-b { color: var(--color-b); }

        #controls {
            flex-shrink: 0;
            background: var(--panel);
            padding: 10px 16px 14px;
            border-top: 1px solid var(--border);
            box-shadow: 0 -2px 12px rgba(26, 28, 44, 0.04);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            max-height: 42vh;
            overflow-y: auto;
        }

        .global-controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            min-width: 200px;
        }
        .speed-control span {
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 600;
            white-space: nowrap;
        }
        .speed-control input[type="range"] {
            flex: 1;
            min-width: 100px;
            accent-color: #2563eb;
        }

        .params-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .param-column {
            flex: 1;
            max-width: 380px;
            min-width: 260px;
            background: #f8f9fa;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            border-top: 4px solid #888;
        }
        .col-a { border-top-color: var(--color-a); }
        .col-b { border-top-color: var(--color-b); }

        .col-header {
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .param-reset-btn {
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--muted);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }
        .param-reset-btn:hover:not(:disabled) {
            background: var(--btn-hover);
            color: var(--text);
        }
        .param-reset-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 8px;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 600;
        }

        input[type="number"] {
            background: #ffffff;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 58px;
            padding: 3px 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-weight: 700;
            font-size: 0.85rem;
            text-align: right;
            appearance: textfield;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .col-a input[type="number"] { color: var(--color-a); }
        .col-b input[type="number"] { color: var(--color-b); }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            height: 6px;
        }
        .col-a input[type="range"] { accent-color: var(--color-a); }
        .col-b input[type="range"] { accent-color: var(--color-b); }
        #input-speed { accent-color: #2563eb; }

        select {
            width: 100%;
            padding: 6px 8px;
            background: #ffffff;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        button.sim-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .btn-a {
            background: rgba(14, 165, 233, 0.15);
            color: #0369a1;
            border: 1px solid rgba(14, 165, 233, 0.35);
        }
        .btn-a:hover { background: rgba(14, 165, 233, 0.25); }
        .btn-b {
            background: rgba(217, 119, 6, 0.15);
            color: #b45309;
            border: 1px solid rgba(217, 119, 6, 0.35);
        }
        .btn-b:hover { background: rgba(217, 119, 6, 0.25); }
        .btn-both {
            background: linear-gradient(90deg, rgba(14, 165, 233, 0.2), rgba(217, 119, 6, 0.2));
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-both:hover { opacity: 0.9; }
        .btn-reset {
            background: var(--btn-bg);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-reset:hover {
            background: var(--btn-hover);
            color: var(--text);
        }
        .btn-fullscreen {
            background: var(--btn-bg);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-fullscreen:hover {
            background: var(--btn-hover);
            color: var(--text);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #ffffff;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .checkbox-wrapper input { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; accent-color: #2563eb; }
        .checkbox-wrapper span { font-size: 0.78rem; color: var(--text); font-weight: 600; line-height: 1.25; }

        .extra-params {
            min-width: 200px;
            max-width: 240px;
            justify-content: flex-start;
            background: #f8f9fa;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .display-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (max-width: 720px) {
            .left-sidebar {
                width: min(200px, 46vw);
                top: 8px;
                left: 8px;
            }
            .page-header h1 { font-size: 1.15rem; }
        }
    </style>
</head>
<body>
<div class="lab-section">
    <div class="page-header">
        <div class="page-header-text">
            <h1 id="page-title">Projectile Motion</h1>
            <div class="subtitle" id="page-subtitle">Dual-ball comparison · Strobes & velocity components</div>
        </div>
        <button type="button" class="lang-btn" id="lang-toggle">🌐 中文</button>
    </div>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
        <button type="button" class="fs-exit-btn" id="btn-fs-exit">Exit full screen</button>

        <div class="left-sidebar">
            <div class="panel-box logo">Unit Education</div>

            <div class="panel-box stats">
                <div class="stat-group text-a">
                    <h4 id="stats-title-a">Ball A</h4>
                    <div class="stat-row">
                        <span id="label-t-ground-a">Time to ground:</span>
                        <span id="val-t-a" class="stat-highlight">0.00 s</span>
                    </div>
                </div>
                <div class="stat-group text-b">
                    <h4 id="stats-title-b">Ball B</h4>
                    <div class="stat-row">
                        <span id="label-t-ground-b">Time to ground:</span>
                        <span id="val-t-b" class="stat-highlight">0.00 s</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="controls">
        <div class="global-controls">
            <button type="button" class="sim-btn btn-a" id="btn-play-a" onclick="startSim('A')">Play A only</button>
            <button type="button" class="sim-btn btn-b" id="btn-play-b" onclick="startSim('B')">Play B only</button>
            <button type="button" class="sim-btn btn-both" id="btn-play-both" onclick="startSim('BOTH')">Play both</button>
            <button type="button" class="sim-btn btn-reset" id="btn-reset" onclick="resetSim()">Reset</button>

            <div class="speed-control">
                <span id="label-speed">Simulation speed</span>
                <input type="range" id="input-speed" min="0.1" max="2.0" step="0.1" value="1.0">
            </div>
            <button type="button" class="sim-btn btn-fullscreen" id="btn-fullscreen">Full screen</button>
        </div>

        <div class="params-container">
            <div class="param-column col-a">
                <div class="col-header text-a">
                    <span id="col-title-a">Ball A parameters</span>
                    <button type="button" class="param-reset-btn" id="btn-reset-a">Reset</button>
                </div>
                <div class="control-group">
                    <div class="label-row"><span id="label-h0-a">Height H₀ (m)</span><input type="number" id="num-h0-a" min="0" max="300" value="0"></div>
                    <input type="range" id="range-h0-a" min="0" max="300" value="0">
                </div>
                <div class="control-group">
                    <div class="label-row"><span id="label-v0-a">Speed v₀ (m/s)</span><input type="number" id="num-v0-a" value="40"></div>
                    <input type="range" id="range-v0-a" min="10" max="100" value="40">
                </div>
                <div class="control-group">
                    <div class="label-row"><span id="label-angle-a">Angle θ (°)</span><input type="number" id="num-angle-a" min="0" max="90" value="45"></div>
                    <input type="range" id="range-angle-a" min="0" max="90" value="45">
                </div>
            </div>

            <div class="param-column col-b">
                <div class="col-header text-b">
                    <span id="col-title-b">Ball B parameters</span>
                    <button type="button" class="param-reset-btn" id="btn-reset-b">Reset</button>
                </div>
                <div class="control-group">
                    <div class="label-row"><span id="label-h0-b">Height H₀ (m)</span><input type="number" id="num-h0-b" min="0" max="300" value="0"></div>
                    <input type="range" id="range-h0-b" min="0" max="300" value="0">
                </div>
                <div class="control-group">
                    <div class="label-row"><span id="label-v0-b">Speed v₀ (m/s)</span><input type="number" id="num-v0-b" value="40"></div>
                    <input type="range" id="range-v0-b" min="10" max="100" value="40">
                </div>
                <div class="control-group">
                    <div class="label-row"><span id="label-angle-b">Angle θ (°)</span><input type="number" id="num-angle-b" min="0" max="90" value="45"></div>
                    <input type="range" id="range-angle-b" min="0" max="90" value="45">
                </div>
            </div>

            <div class="control-group extra-params">
                <div class="display-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="check-strobe" checked>
                        <span id="label-strobe">Show strobe frames</span>
                    </label>
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="check-velocity">
                        <span id="label-velocity">Show velocity components</span>
                    </label>
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="check-half">
                        <span id="label-half">Show motion to apex only</span>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const dict = {
        zh: {
            langBtn: '🌐 English',
            docTitle: '拋體運動',
            pageTitle: '拋體運動',
            pageSubtitle: '雙球比較 · 頻閃與速度分量',
            statsA: '球 A',
            statsB: '球 B',
            timeToGround: '落地時間:',
            playA: '僅播放 A',
            playB: '僅播放 B',
            playBoth: '同時播放',
            reset: '重置',
            fullscreen: '全螢幕',
            exitFullscreen: '退出全螢幕',
            strobe: '顯示頻閃照片',
            velocity: '顯示速度分量',
            half: '僅顯示至最高點',
            colA: '球 A 參數',
            colB: '球 B 參數',
            h0: '高度 H₀ (m)',
            v0: '初速 v₀ (m/s)',
            angle: '角度 θ (°)',
            speed: '模擬速度'
        },
        en: {
            langBtn: '🌐 中文',
            docTitle: 'Projectile Motion',
            pageTitle: 'Projectile Motion',
            pageSubtitle: 'Dual-ball comparison · Strobes & velocity components',
            statsA: 'Ball A',
            statsB: 'Ball B',
            timeToGround: 'Time to ground:',
            playA: 'Play A only',
            playB: 'Play B only',
            playBoth: 'Play both',
            reset: 'Reset',
            fullscreen: 'Full screen',
            exitFullscreen: 'Exit full screen',
            strobe: 'Show strobe frames',
            velocity: 'Show velocity components',
            half: 'Show motion to apex only',
            colA: 'Ball A parameters',
            colB: 'Ball B parameters',
            h0: 'Height H₀ (m)',
            v0: 'Speed v₀ (m/s)',
            angle: 'Angle θ (°)',
            speed: 'Simulation speed'
        }
    };

    function hubLangToLocal(lang) {
        if (lang === 'en') return 'en';
        return 'zh';
    }

    const params = new URLSearchParams(location.search);
    let currentLang = hubLangToLocal(params.get('lang') || 'en');

    function t() { return dict[currentLang]; }

    function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function updateFullscreenButton() {
        const d = t();
        const label = isFullscreen() ? d.exitFullscreen : d.fullscreen;
        const btn = document.getElementById('btn-fullscreen');
        const exitBtn = document.getElementById('btn-fs-exit');
        if (btn) btn.textContent = label;
        if (exitBtn) exitBtn.textContent = d.exitFullscreen;
    }

    async function toggleFullscreen() {
        const target = document.querySelector('.lab-section') || document.documentElement;
        try {
            if (isFullscreen()) {
                if (document.exitFullscreen) await document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            } else if (target.requestFullscreen) {
                await target.requestFullscreen();
            } else if (target.webkitRequestFullscreen) {
                target.webkitRequestFullscreen();
            }
        } catch (_) {
            /* ignore user/browser rejection */
        }
        updateFullscreenButton();
    }

    function updateLanguageUI() {
        const d = t();
        document.documentElement.lang = currentLang === 'zh' ? 'zh-HK' : 'en';
        document.title = d.docTitle;
        document.getElementById('page-title').textContent = d.pageTitle;
        document.getElementById('page-subtitle').textContent = d.pageSubtitle;
        document.getElementById('lang-toggle').textContent = d.langBtn;
        document.getElementById('stats-title-a').textContent = d.statsA;
        document.getElementById('stats-title-b').textContent = d.statsB;
        document.getElementById('label-t-ground-a').textContent = d.timeToGround;
        document.getElementById('label-t-ground-b').textContent = d.timeToGround;
        document.getElementById('btn-play-a').textContent = d.playA;
        document.getElementById('btn-play-b').textContent = d.playB;
        document.getElementById('btn-play-both').textContent = d.playBoth;
        document.getElementById('btn-reset').textContent = d.reset;
        document.getElementById('btn-reset-a').textContent = d.reset;
        document.getElementById('btn-reset-b').textContent = d.reset;
        updateFullscreenButton();
        document.getElementById('label-strobe').textContent = d.strobe;
        document.getElementById('label-velocity').textContent = d.velocity;
        document.getElementById('label-half').textContent = d.half;
        document.getElementById('col-title-a').textContent = d.colA;
        document.getElementById('col-title-b').textContent = d.colB;
        document.getElementById('label-h0-a').textContent = d.h0;
        document.getElementById('label-h0-b').textContent = d.h0;
        document.getElementById('label-v0-a').textContent = d.v0;
        document.getElementById('label-v0-b').textContent = d.v0;
        document.getElementById('label-angle-a').textContent = d.angle;
        document.getElementById('label-angle-b').textContent = d.angle;
        document.getElementById('label-speed').textContent = d.speed;
    }

    document.getElementById('lang-toggle').addEventListener('click', () => {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        updateLanguageUI();
    });

    window.addEventListener('message', (ev) => {
        if (ev.data?.type !== 's3phy:lang') return;
        currentLang = hubLangToLocal(ev.data.lang);
        updateLanguageUI();
    });

    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const g = 9.8;
    let simTime = 0;
    let isRunning = false;
    let animationId;
    let simSpeed = 1.0;
    let activeMode = 'BOTH';
    let isHalfMotion = false;
    let showStrobe = true;
    let showVelocity = false;
    let numSegments = 5;

    const ballA = {
        h0: 0, v0: 40, angle: 45,
        color: '#0ea5e9', colorGhost: 'rgba(14, 165, 233, 0.35)',
        colorX: '#0891b2', colorY: '#7c3aed',
        path: [], snapshots: [], totalTime: 0
    };

    const ballB = {
        h0: 0, v0: 40, angle: 45,
        color: '#d97706', colorGhost: 'rgba(217, 119, 6, 0.35)',
        colorX: '#ca8a04', colorY: '#dc2626',
        path: [], snapshots: [], totalTime: 0
    };

    let scale = 2.0;
    const groundOffset = 50;
    const startX = 280;
    const velocityScale = 1.5;

    const paramControlIds = [
        'range-h0-a', 'num-h0-a', 'range-v0-a', 'num-v0-a', 'range-angle-a', 'num-angle-a',
        'range-h0-b', 'num-h0-b', 'range-v0-b', 'num-v0-b', 'range-angle-b', 'num-angle-b',
        'check-half', 'btn-reset-a', 'btn-reset-b'
    ];

    function setParamsLocked(locked) {
        paramControlIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.disabled = locked;
        });
    }

    const defaultBallParams = { h0: 0, v0: 40, angle: 45 };

    function setBallInputs(suffix, params) {
        ['h0', 'v0', 'angle'].forEach(prop => {
            const val = params[prop];
            document.getElementById(`range-${prop}-${suffix}`).value = val;
            document.getElementById(`num-${prop}-${suffix}`).value = val;
        });
    }

    function resetBallParams(ball, suffix) {
        if (isRunning) return;
        ball.h0 = defaultBallParams.h0;
        ball.v0 = defaultBallParams.v0;
        ball.angle = defaultBallParams.angle;
        setBallInputs(suffix, defaultBallParams);
        recalcPhysics();
        draw();
    }

    function bindInput(idRange, idNum, obj, prop) {
        const range = document.getElementById(idRange);
        const num = document.getElementById(idNum);
        const min = parseFloat(range.min);
        const max = parseFloat(range.max);

        if (!Number.isNaN(min)) num.min = min;
        if (!Number.isNaN(max)) num.max = max;

        const update = (val) => {
            if (isRunning) return;
            val = parseFloat(val);
            if (Number.isNaN(val)) return;
            if (!Number.isNaN(min)) val = Math.max(min, val);
            if (!Number.isNaN(max)) val = Math.min(max, val);
            obj[prop] = val;
            range.value = val;
            num.value = val;
            recalcPhysics();
            draw();
        };

        range.addEventListener('input', e => update(e.target.value));
        num.addEventListener('input', e => update(e.target.value));
        num.addEventListener('change', e => update(e.target.value));
        update(range.value);
    }

    bindInput('range-h0-a', 'num-h0-a', ballA, 'h0');
    bindInput('range-v0-a', 'num-v0-a', ballA, 'v0');
    bindInput('range-angle-a', 'num-angle-a', ballA, 'angle');

    bindInput('range-h0-b', 'num-h0-b', ballB, 'h0');
    bindInput('range-v0-b', 'num-v0-b', ballB, 'v0');
    bindInput('range-angle-b', 'num-angle-b', ballB, 'angle');

    document.getElementById('btn-reset-a').addEventListener('click', () => resetBallParams(ballA, 'a'));
    document.getElementById('btn-reset-b').addEventListener('click', () => resetBallParams(ballB, 'b'));

    document.getElementById('input-speed').addEventListener('input', (e) => {
        simSpeed = parseFloat(e.target.value);
    });

    document.getElementById('check-strobe').addEventListener('change', (e) => {
        showStrobe = e.target.checked;
        draw();
    });

    document.getElementById('check-velocity').addEventListener('change', (e) => {
        showVelocity = e.target.checked;
        draw();
    });

    document.getElementById('check-half').addEventListener('change', (e) => {
        if (isRunning) return;
        isHalfMotion = e.target.checked;
        recalcPhysics();
        draw();
    });

    function getProjectedFullTime(ball) {
        const rad = ball.angle * Math.PI / 180;
        const vy0 = ball.v0 * Math.sin(rad);
        const a = 0.5 * g;
        const b = -vy0;
        const c = -ball.h0;
        const delta = b * b - 4 * a * c;
        if (delta < 0) return 0;
        return (-b + Math.sqrt(delta)) / (2 * a);
    }

    function getLandingTime(ball) {
        const rad = ball.angle * Math.PI / 180;
        const vy0 = ball.v0 * Math.sin(rad);

        if (isHalfMotion && ball.angle > 0) {
            return vy0 / g;
        }
        return getProjectedFullTime(ball);
    }

    function getPos(ball, t) {
        const effectiveT = Math.min(t, ball.totalTime);
        const rad = ball.angle * Math.PI / 180;
        const vx = ball.v0 * Math.cos(rad);
        const vy0 = ball.v0 * Math.sin(rad);

        const x = vx * effectiveT;
        const y = ball.h0 + (vy0 * effectiveT) - (0.5 * g * effectiveT * effectiveT);
        return { x, y: Math.max(0, y) };
    }

    function recalcPhysics() {
        [ballA, ballB].forEach(ball => {
            ball.totalTime = getLandingTime(ball);
            if (ball.totalTime < 0.1) ball.totalTime = 0.1;

            ball.snapshots = [];
            ball.path = [];

            for (let i = 0; i <= numSegments; i++) {
                let tSnap = i * (ball.totalTime / numSegments);
                if (i === numSegments) tSnap = ball.totalTime;
                const pos = getPos(ball, tSnap);
                ball.snapshots.push({ x: pos.x, y: pos.y, t: tSnap });
            }
        });
        updateStats();
    }

    function startSim(mode) {
        activeMode = mode;
        resetSim(false);
        isRunning = true;
        setParamsLocked(true);
        lastFrameTime = performance.now();
        animate();
    }

    function resetSim(fullReset = true) {
        isRunning = false;
        setParamsLocked(false);
        cancelAnimationFrame(animationId);
        simTime = 0;
        ballA.path = [];
        ballB.path = [];
        recalcPhysics();
        draw();
    }

    let lastFrameTime = 0;
    function animate() {
        if (!isRunning) return;

        const now = performance.now();
        let dt = (now - lastFrameTime) / 1000;
        lastFrameTime = now;
        if (dt > 0.05) dt = 0.05;

        simTime += dt * simSpeed;

        let maxTime = 0;
        if (activeMode === 'A' || activeMode === 'BOTH') maxTime = Math.max(maxTime, ballA.totalTime);
        if (activeMode === 'B' || activeMode === 'BOTH') maxTime = Math.max(maxTime, ballB.totalTime);

        if (simTime >= maxTime) {
            simTime = maxTime;
            isRunning = false;
            setParamsLocked(false);
        }

        if (activeMode === 'A' || activeMode === 'BOTH') {
            const pos = getPos(ballA, simTime);
            if (simTime <= ballA.totalTime) ballA.path.push(pos);
        }
        if (activeMode === 'B' || activeMode === 'BOTH') {
            const pos = getPos(ballB, simTime);
            if (simTime <= ballB.totalTime) ballB.path.push(pos);
        }

        updateStats();
        draw();

        if (isRunning) {
            animationId = requestAnimationFrame(animate);
        }
    }

    function updateStats() {
        const tA = getProjectedFullTime(ballA);
        const tB = getProjectedFullTime(ballB);
        document.getElementById('val-t-a').textContent = `${Math.max(0, tA).toFixed(2)} s`;
        document.getElementById('val-t-b').textContent = `${Math.max(0, tB).toFixed(2)} s`;
    }

    function resize() {
        const container = document.getElementById('canvas-container');
        const w = Math.max(1, container.clientWidth);
        const h = Math.max(1, container.clientHeight);
        canvas.width = w;
        canvas.height = h;
        draw();
    }
    window.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', () => {
        updateFullscreenButton();
        resize();
    });
    document.addEventListener('webkitfullscreenchange', () => {
        updateFullscreenButton();
        resize();
    });
    document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
    document.getElementById('btn-fs-exit').addEventListener('click', toggleFullscreen);

    function drawArrow(ctx, fromX, fromY, toX, toY, color) {
        const headlen = 10;
        const dx = toX - fromX;
        const dy = toY - fromY;
        const angle = Math.atan2(dy, dx);

        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.lineTo(toX, toY);
        ctx.fillStyle = color;
        ctx.fill();
    }

    function drawTextWithHalo(ctx, text, x, y, color) {
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    function draw() {
        if (!canvas.width || !canvas.height) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const originY = canvas.height - groundOffset;
        const toPxX = (m) => startX + m * scale;
        const toPxY = (m) => originY - m * scale;

        ctx.beginPath();
        ctx.moveTo(0, originY);
        ctx.lineTo(canvas.width, originY);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(startX, 0);
        ctx.lineTo(startX, canvas.height);
        ctx.strokeStyle = '#cbd5e1';
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        const drawBallSet = (ball, isActive) => {
            if (!isActive) return;

            const rad = ball.angle * Math.PI / 180;
            const vx0 = ball.v0 * Math.cos(rad);
            const fullTime = getProjectedFullTime(ball);
            const range = vx0 * fullTime;
            const rangePx = toPxX(range);

            ctx.beginPath();
            ctx.moveTo(rangePx, originY);
            ctx.lineTo(rangePx - 5, originY + 8);
            ctx.lineTo(rangePx + 5, originY + 8);
            ctx.closePath();
            ctx.fillStyle = ball.color;
            ctx.fill();

            ctx.font = 'bold 12px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = ball.color;
            ctx.fillText('R', rangePx, originY + 20);

            if (showStrobe) {
                ball.snapshots.forEach(snap => {
                    if (simTime >= snap.t) {
                        const sx = toPxX(snap.x);
                        const sy = toPxY(snap.y);

                        ctx.beginPath();
                        ctx.arc(sx, sy, 8, 0, Math.PI * 2);
                        ctx.fillStyle = ball.colorGhost;
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(sx, originY, 6, 0, Math.PI * 2);
                        ctx.strokeStyle = ball.colorX;
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(startX, sy, 6, 0, Math.PI * 2);
                        ctx.strokeStyle = ball.colorY;
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(sx, originY);
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(startX, sy);
                        ctx.strokeStyle = ball.colorGhost;
                        ctx.setLineDash([2, 2]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                });
            }

            if (ball.path.length > 0) {
                ctx.beginPath();
                ctx.moveTo(toPxX(ball.path[0].x), toPxY(ball.path[0].y));
                for (const p of ball.path) ctx.lineTo(toPxX(p.x), toPxY(p.y));
                ctx.strokeStyle = ball.color;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            const currPos = getPos(ball, simTime);
            const cx = toPxX(currPos.x);
            const cy = toPxY(currPos.y);

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx, originY);
            ctx.moveTo(cx, cy);
            ctx.lineTo(startX, cy);
            ctx.strokeStyle = 'rgba(26, 28, 44, 0.2)';
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            if (showVelocity) {
                const vx = ball.v0 * Math.cos(rad);
                const vy = ball.v0 * Math.sin(rad) - g * Math.min(simTime, ball.totalTime);

                const endX = cx + vx * velocityScale;
                drawArrow(ctx, cx, cy, endX, cy, ball.colorX);

                ctx.font = 'bold 16px ui-monospace, SFMono-Regular, Menlo, monospace';
                ctx.textAlign = 'center';
                drawTextWithHalo(ctx, `vx=${vx.toFixed(1)}`, cx + (vx * velocityScale) / 2, cy - 20, ball.colorX);

                const endY = cy - vy * velocityScale;
                drawArrow(ctx, cx, cy, cx, endY, ball.colorY);

                ctx.textAlign = 'left';
                const labelY = cy - (vy * velocityScale) / 2;
                drawTextWithHalo(ctx, `vy=${vy.toFixed(1)}`, cx + 20, labelY + 5, ball.colorY);
            }

            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.strokeStyle = '#1a1c2c';
            ctx.lineWidth = 2;
            ctx.stroke();
        };

        if (activeMode === 'A' || activeMode === 'BOTH') drawBallSet(ballA, true);
        if (activeMode === 'B' || activeMode === 'BOTH') drawBallSet(ballB, true);
    }

    updateLanguageUI();
    resize();
    recalcPhysics();
    draw();

    requestAnimationFrame(() => {
        resize();
        draw();
    });
</script>
</body>
</html>
