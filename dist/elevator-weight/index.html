<!DOCTYPE html>
<html lang="zh-HK" translate="no">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電梯中的受力</title>
    <link rel="stylesheet" href="../shared/s3phy-embed.css">
    <script src="../shared/s3phy-embed-init.js"></script>
    <style>
        html.s3phy-embed .lang-btn { display: none; }
        html.s3phy-embed body { padding: 12px; }
        :root {
            --bg: #f8f9fa;
            --panel: #ffffff;
            --text: #1a1c2c;
            --muted: #6b7280;
            --border: #e8eaed;
            --n: #059669;
            --w: #dc2626;
            --a: #7c3aed;
            --accent: #0f766e;
            --btn: #e9ecef;
            --btn-text: #374151;
            --active: #0f766e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: "Noto Sans TC", "Segoe UI", system-ui, sans-serif;
            font-size: 17px;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .header-top {
            width: 100%;
            max-width: 1080px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }
        h2 { margin: 0 0 4px; color: var(--accent); font-size: 1.75rem; font-weight: 800; }
        #page-desc { margin: 0; color: var(--muted); font-size: 1.12rem; line-height: 1.45; }
        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .lang-btn, .fs-btn {
            background: var(--btn);
            border: 1px solid var(--border);
            color: var(--btn-text);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .fs-btn {
            background: #0f766e;
            border-color: #0f766e;
            color: #fff;
        }
        .fs-btn:hover { filter: brightness(1.05); }
        /* Fullscreen = same layout as normal, no N–t, fit one screen (no scroll) */
        body.is-fullscreen {
            height: 100dvh;
            max-height: 100dvh;
            padding: 6px 10px;
            overflow: hidden;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        body.is-fullscreen .header-top,
        body.is-fullscreen .container {
            width: 100%;
            max-width: 1080px;
        }
        body.is-fullscreen .header-top { flex: 0 0 auto; margin-bottom: 4px; }
        body.is-fullscreen .container {
            flex: 1 1 auto;
            min-height: 0;
            gap: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        body.is-fullscreen .container > .card:first-child { flex: 0 0 auto; }
        body.is-fullscreen #page-desc { display: none; }
        body.is-fullscreen h2 { font-size: 1.3rem; margin: 0; }
        body.is-fullscreen .card { padding: 6px 10px; }
        body.is-fullscreen .controls-row { margin-top: 4px; gap: 6px 10px; }
        body.is-fullscreen .slider-label { font-size: 0.82rem; }
        body.is-fullscreen .val { font-size: 0.9rem; }
        body.is-fullscreen .play-btn { padding: 7px 12px; font-size: 0.9rem; }
        body.is-fullscreen .sc-btn { padding: 5px 10px; font-size: 0.85rem; }
        body.is-fullscreen .canvas-label { font-size: 0.85rem; margin-bottom: 4px; }
        body.is-fullscreen .main-grid {
            flex: 1 1 auto;
            min-height: 0;
            gap: 8px;
            align-items: stretch;
        }
        body.is-fullscreen .main-grid > .card {
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Shaft card fills remaining height; canvas stretches into empty lower space */
        body.is-fullscreen .main-grid > .card:first-child #sceneCanvas {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            height: auto; /* override fixed 580px so card can stretch, then JS sizes to fill */
        }
        body.is-fullscreen .main-grid > .card:first-child .legend { flex: 0 0 auto; }
        body.is-fullscreen #case-cue { margin: 2px 0 0 !important; font-size: 0.9rem !important; }
        body.is-fullscreen .fbd-card #fbdCanvas {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            height: auto;
        }
        body.is-fullscreen .nt-card { display: none !important; }
        .container {
            width: 100%;
            max-width: 1080px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(26, 28, 44, 0.04);
            padding: 14px 16px;
        }
        .scenarios {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sc-btn {
            border: 1.5px solid var(--border);
            background: #fff;
            color: var(--btn-text);
            padding: 9px 14px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
        }
        .sc-btn:hover { border-color: #94a3b8; }
        .sc-btn.active {
            background: var(--active);
            border-color: var(--active);
            color: #fff;
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 20px;
            align-items: flex-end;
            margin-top: 12px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 160px;
            flex: 1 1 160px;
        }
        .slider-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.03em;
        }
        .slider-row { display: flex; align-items: center; gap: 8px; }
        input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
        .val {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            min-width: 5rem;
            text-align: right;
            font-size: 1.05rem;
        }
        .play-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: 800;
            cursor: pointer;
            font-size: 1.05rem;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-items: stretch;
        }
        @media (max-width: 820px) {
            .main-grid { grid-template-columns: 1fr; }
        }
        .main-grid > .card {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .main-grid > .card:first-child #sceneCanvas,
        .fbd-card #fbdCanvas {
            flex: 1 1 auto;
            width: 100%;
            min-height: 640px;
            height: auto;
        }
        .canvas-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 8px;
            flex: 0 0 auto;
        }
        canvas {
            width: 100%;
            max-width: 100%;
            display: block;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #eef2f6;
            box-sizing: border-box;
        }
        #sceneCanvas { height: 640px; }
        #fbdCanvas { height: 640px; background: #fafafa; }
        #ntCanvas { height: 380px; background: #fafafa; }
        .nt-card { display: none !important; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--muted);
            flex: 0 0 auto;
        }
        .legend span::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 3px;
            margin-right: 6px;
            vertical-align: middle;
            border-radius: 2px;
        }
        .legend .ln::before { background: var(--n); }
        .legend .lw::before { background: var(--w); }
        .legend .la::before { background: var(--a); }
        .legend .lv::before { background: #0369a1; }
        .phase-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.98rem;
            font-weight: 700;
            flex: 0 0 auto;
            align-self: flex-start;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }
        .why-modes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        #whyCaption {
            margin: 10px 0 0;
            min-height: 2.6em;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f766e;
            line-height: 1.45;
        }
        .why-eq {
            margin-top: 8px;
            font-family: "Roboto Mono", Consolas, monospace;
            font-size: 1rem;
            color: #475569;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 8px 10px;
            line-height: 1.5;
        }
        #case-cue { font-size: 1.1rem !important; }
    </style>
</head>
<body>
    <div class="header-top">
        <div>
            <h2 id="page-title">Forces in an elevator</h2>
            <p id="page-desc">Normal force, weight and acceleration when a lift goes up or down.</p>
        </div>
        <div class="header-actions">
            <button type="button" class="fs-btn" id="fullscreen-btn">⛶ Full screen</button>
            <button type="button" class="lang-btn" id="lang-toggle">🌐 English</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="scenarios" id="scenario-btns"></div>
            <div class="controls-row">
                <div class="control-group">
                    <span class="slider-label" id="label-mass">Mass m</span>
                    <div class="slider-row">
                        <input type="range" id="massSlider" min="40" max="100" step="1" value="70">
                        <span class="val" id="massVal">70 kg</span>
                    </div>
                </div>
                <div class="control-group">
                    <span class="slider-label" id="label-anim">Animation speed</span>
                    <div class="slider-row">
                        <input type="range" id="animSpeedSlider" min="0.35" max="2.5" step="0.05" value="1">
                        <span class="val" id="animSpeedVal">×1.00</span>
                    </div>
                </div>
                <button type="button" class="play-btn" id="playBtn">▶ Play</button>
                <button type="button" class="play-btn" id="resetBtn" style="background:#475569">↺ Reset</button>
            </div>
            <p id="case-cue" style="margin:12px 0 0;font-weight:700;color:#0f766e;font-size:0.92rem;"></p>
        </div>

        <div class="main-grid">
            <div class="card">
                <div class="canvas-label" id="label-scene">Elevator shaft (side view)</div>
                <canvas id="sceneCanvas" width="640" height="580"></canvas>
                <div class="legend">
                    <span class="ln" id="leg-n">N (normal)</span>
                    <span class="lw" id="leg-w">W = mg (weight)</span>
                    <span class="la" id="leg-a">a (acceleration)</span>
                    <span class="lv" id="leg-v">v (speed)</span>
                </div>
                <span class="phase-tag" id="phaseTag"></span>
            </div>
            <div class="card fbd-card">
                <div class="canvas-label" id="label-fbd">Free-body diagram</div>
                <canvas id="fbdCanvas" width="640" height="640"></canvas>
            </div>
        </div>
    </div>

    <script>
        const G = 9.81;
        // Physical shaft height so cabinY∈[0,1] maps to metres
        const SHAFT_H = 85; // m — room for accel + coast + brake at |a|=5, t=3 s
        const BRAKE_T = 3; // seconds of non-zero |a| while speeding up or braking
        const FIXED_A = 5.0; // fixed |a| for all scenarios (ms⁻²)
        const V_REF = 24; // m/s — scale for v arrow (≈ max cruise = 5×3)
        const FORCE_REF = 70 * G; // pixel scale reference (70 kg · g)
        const A_REF = 8; // scale for a arrow length
        const SCENARIOS = [
            { id: 'upAccel' },   // from rest, a↑ — ends still accelerating (N > mg)
            { id: 'upDecel' },   // coast up, then a↓ — ends still braking (N < mg)
            { id: 'downAccel' }, // from rest, a↓ — ends still accelerating (N < mg)
            { id: 'downDecel' }, // coast down, then a↑ — ends still braking (N > mg)
        ];

        const dict = {
            zh: {
                title: '電梯中的受力',
                desc: '四個情況（|a| = 5.0 ms⁻²）：從靜止向上／向下加速；以及勻速後停車前減速（上行變輕、下行變重）。動畫結束時停在 N ≠ mg 的運動狀態。',
                mass: '質量 m',
                animSpeed: '動畫速度',
                play: '▶ 播放',
                pause: '⏸ 暫停',
                fullscreen: '⛶ 全螢幕',
                exitFullscreen: '⛶ 退出全螢幕',
                reset: '↺ 重設位置',
                scene: '電梯井（側視）',
                fbd: '受力圖（自由體圖）',
                nt: '法向力 N 對時間',
                ka: '加速度 a（向上為正）',
                kv: '速率 |v|',
                kn: '法向力 N（地板托力）',
                kw: '重量 mg',
                kratio: 'N / mg',
                legN: 'N（法向力）',
                legW: 'W = mg（重量）',
                legA: 'a（加速度）',
                legV: 'v（速度）',
                legNtN: 'N(t)',
                legNtMg: 'mg（參考）',
                feelHeavy: '感覺變重（N > mg）— a 向上',
                feelNormal: '感覺正常體重（N = mg）',
                feelLight: '感覺變輕（N < mg）— a 向下',
                feelZero: '失重（N = 0）',
                eq: (n, mg, a) => `ΣF = N − mg = ma\nN − ${mg} = m(${a})\nN = ${n} N`,
                scenarios: {
                    upAccel: '上行 · 由靜止 a 向上',
                    upDecel: '上行 · 停車前 a 向下',
                    downAccel: '下行 · 由靜止 a 向下',
                    downDecel: '下行 · 停車前 a 向上',
                },
                cueUpAccel: '由靜止向上加速（|a| = 5.0 ms⁻²，a↑，N > mg）→ 之後保持勻速上行 → 結束時回到 t = 0 的初始加速畫面（N ≠ mg）',
                cueUpDecel: '先勻速上行（a = 0，N = mg）→ 停車前減速（a↓，N < mg）→ 結束停在減速中（仍在動，N ≠ mg）',
                cueDownAccel: '由靜止向下加速（|a| = 5.0 ms⁻²，a↓，N < mg）→ 之後保持勻速下行 → 結束時回到 t = 0 的初始加速畫面（N ≠ mg）',
                cueDownDecel: '先勻速下行（a = 0，N = mg）→ 停車前減速（a↑，N > mg）→ 結束停在減速中（仍在動，N ≠ mg）',
                why: '點解減速至停會變輕／變重？',
                whyLight: '上行減速 → 變輕',
                whyHeavy: '下行減速 → 變重',
                whyReplay: '↺ 重播解說',
                whyStepsLight: [
                    '① 電梯同人一齊向上行。',
                    '② 電梯減速至停：加速度向下（a↓）。',
                    '③ 身體有慣性，傾向繼續向上 → 對地板壓得較少。',
                    '④ 地板托力 N 變細（N < mg）→ 感覺變輕。',
                ],
                whyStepsHeavy: [
                    '① 電梯同人一齊向下行。',
                    '② 電梯減速至停：加速度向上（a↑）。',
                    '③ 身體有慣性，傾向繼續向下 → 對地板壓得較多。',
                    '④ 地板托力 N 變大（N > mg）→ 感覺變重。',
                ],
                whyEqLight: 'ΣF = N − mg = ma\na 向下為負 → N = m(g + a) < mg',
                whyEqHeavy: 'ΣF = N − mg = ma\na 向上為正 → N = m(g + a) > mg',
                whyFloor: '地板',
                whyBody: '人',
                whyGhost: '慣性方向',
                whyInertia: '慣性',
                phases: {
                    rest: '階段：靜止（a = 0）',
                    accel: '階段：加速中',
                    coast: '階段：勻速（N = mg）',
                    decel: '階段：減速中',
                    upAccel: '階段：上行加速（N > mg）',
                    upDecel: '階段：上行減速（N < mg）',
                    downAccel: '階段：下行加速（N < mg）',
                    downDecel: '階段：下行減速（N > mg）',
                    stopped: '階段：已停下（N = mg）',
                },
                man: '人',
                floor: '地板',
                cable: '纜',
                langBtn: '🌐 English',
            },
            en: {
                title: 'Forces in an elevator',
                desc: 'Four cases (|a| = 5.0 ms⁻²): accelerate up/down from rest; and coast then brake (lighter going up, heavier going down). Animation ends frozen while still moving with N ≠ mg.',
                mass: 'Mass m',
                animSpeed: 'Animation speed',
                play: '▶ Play',
                pause: '⏸ Pause',
                fullscreen: '⛶ Full screen',
                exitFullscreen: '⛶ Exit full screen',
                reset: '↺ Reset position',
                scene: 'Elevator shaft (side view)',
                fbd: 'Free-body diagram',
                nt: 'Normal force N vs time',
                ka: 'Acceleration a (up +)',
                kv: 'Speed |v|',
                kn: 'Normal N (floor push)',
                kw: 'Weight mg',
                kratio: 'N / mg',
                legN: 'N (normal)',
                legW: 'W = mg (weight)',
                legA: 'a (acceleration)',
                legV: 'v (speed)',
                legNtN: 'N(t)',
                legNtMg: 'mg (reference)',
                feelHeavy: 'Feels heavier (N > mg) — a upward',
                feelNormal: 'Feels normal weight (N = mg)',
                feelLight: 'Feels lighter (N < mg) — a downward',
                feelZero: 'Weightless (N = 0)',
                eq: (n, mg, a) => `ΣF = N − mg = ma\nN − ${mg} = m(${a})\nN = ${n} N`,
                scenarios: {
                    upAccel: 'Going up · a up from rest',
                    upDecel: 'Going up · a down before stop',
                    downAccel: 'Going down · a down from rest',
                    downDecel: 'Going down · a up before stop',
                },
                cueUpAccel: 'From rest, accelerate UP (|a| = 5.0 ms⁻², a↑, N > mg) → keep constant speed UP → at end, jump back to the t = 0 accel frame (N ≠ mg)',
                cueUpDecel: 'Coast UP (a = 0, N = mg) → brake with a DOWN (N < mg) → ends frozen while still braking (moving, N ≠ mg)',
                cueDownAccel: 'From rest, accelerate DOWN (|a| = 5.0 ms⁻², a↓, N < mg) → keep constant speed DOWN → at end, jump back to the t = 0 accel frame (N ≠ mg)',
                cueDownDecel: 'Coast DOWN (a = 0, N = mg) → brake with a UP (N > mg) → ends frozen while still braking (moving, N ≠ mg)',
                why: 'Why slowing to a stop feels lighter / heavier',
                whyLight: 'Up & slowing → lighter',
                whyHeavy: 'Down & slowing → heavier',
                whyReplay: '↺ Replay explanation',
                whyStepsLight: [
                    '① Cabin and person move upward together.',
                    '② Cabin slows to a stop: acceleration is downward (a↓).',
                    '③ Inertia keeps the body tending upward → less push on the floor.',
                    '④ Floor push N shrinks (N < mg) → you feel lighter.',
                ],
                whyStepsHeavy: [
                    '① Cabin and person move downward together.',
                    '② Cabin slows to a stop: acceleration is upward (a↑).',
                    '③ Inertia keeps the body tending downward → more push on the floor.',
                    '④ Floor push N grows (N > mg) → you feel heavier.',
                ],
                whyEqLight: 'ΣF = N − mg = ma\na downward (negative) → N = m(g + a) < mg',
                whyEqHeavy: 'ΣF = N − mg = ma\na upward (positive) → N = m(g + a) > mg',
                whyFloor: 'Floor',
                whyBody: 'Person',
                whyGhost: 'Inertia path',
                whyInertia: 'Inertia',
                phases: {
                    rest: 'Phase: at rest (a = 0)',
                    accel: 'Phase: accelerating',
                    coast: 'Phase: constant speed (N = mg)',
                    decel: 'Phase: decelerating',
                    upAccel: 'Phase: up & speeding up (N > mg)',
                    upDecel: 'Phase: up & slowing (N < mg)',
                    downAccel: 'Phase: down & speeding up (N < mg)',
                    downDecel: 'Phase: down & slowing (N > mg)',
                    stopped: 'Phase: stopped (N = mg)',
                },
                man: 'Person',
                floor: 'Floor',
                cable: 'Cable',
                langBtn: '🌐 中文',
            },
        };

        function hubLangToLocal(lang) {
            return lang === 'en' ? 'en' : 'zh';
        }

        const params = new URLSearchParams(location.search);
        let currentLang = hubLangToLocal(params.get('lang') || 'zh');
        let scenarioId = 'upDecel';
        let playing = true;
        let cabinY = 0.12;
        let startY = 0.12;
        let posM = 0.12 * SHAFT_H; // cabin height from bottom (m)
        let velocity = 0; // signed SI speed (m/s), up +
        let stopped = false;
        let tripFinished = false; // ended frozen in N≠mg moving phase
        let phase = 'coast'; // accel | coast | decel | rest
        let simTime = 0;
        let history = []; // { t, N, a }
        let lastTs = 0;
        let accelElapsed = 0;
        let accelDuration = BRAKE_T; // may shorten if shaft room is tight
        const HISTORY_MAX_T = 40;
        /** Instantaneous SI acceleration (up +). Non-zero while speeding up or braking. */
        let instantA = 0;

        const sceneCanvas = document.getElementById('sceneCanvas');
        const sceneCtx = sceneCanvas.getContext('2d');
        const fbdCanvas = document.getElementById('fbdCanvas');
        const fbdCtx = fbdCanvas.getContext('2d');
        const ntCanvas = document.getElementById('ntCanvas');
        const ntCtx = ntCanvas ? ntCanvas.getContext('2d') : null;
        const massSlider = document.getElementById('massSlider');
        const animSpeedSlider = document.getElementById('animSpeedSlider');
        const playBtn = document.getElementById('playBtn');

        function t() { return dict[currentLang]; }
        function scenario() { return SCENARIOS.find((s) => s.id === scenarioId); }
        function mass() { return parseFloat(massSlider.value); }
        function aMag() { return FIXED_A; }
        function animSpeed() { return parseFloat(animSpeedSlider.value); }

        function accel() {
            return stopped ? 0 : instantA;
        }

        function weight() { return mass() * G; }
        function normal() {
            // N - mg = ma  (up +)  →  N = m(g+a)
            return Math.max(0, mass() * (G + accel()));
        }

        function forcePx(F, basePx) {
            return F > 0.5 ? Math.max(8, (F / FORCE_REF) * basePx) : 0;
        }
        /** Shaft width + head size track force magnitude (same scale as length). */
        function forceStyle(F, s = 1) {
            const t = Math.min(1.85, Math.max(0.28, F / FORCE_REF));
            return {
                width: (2.2 + 3.0 * t) * s,
                head: (7 + 9 * t) * s,
            };
        }
        function aPx(a, maxPx) {
            return Math.min(maxPx, (Math.abs(a) / A_REF) * maxPx);
        }
        function vPx(v, maxPx) {
            return Math.min(maxPx, (Math.abs(v) / V_REF) * maxPx);
        }

        function isUpScenario() {
            return scenarioId === 'upAccel' || scenarioId === 'upDecel';
        }
        function isAccelScenario() {
            return scenarioId === 'upAccel' || scenarioId === 'downAccel';
        }
        function motionSign() {
            return isUpScenario() ? 1 : -1;
        }
        function targetY() {
            return isUpScenario() ? 0.9 : 0.1;
        }
        /** a while speeding up from rest */
        function accelPhaseA() {
            return motionSign() * aMag();
        }
        /** a while braking to a stop */
        function brakePhaseA() {
            return -motionSign() * aMag();
        }
        /** Signed a for the current non-coast phase. */
        function signedA() {
            if (phase === 'accel') return accelPhaseA();
            if (phase === 'decel') return brakePhaseA();
            return 0;
        }
        /** Fixed N–t axis mark: accel scenarios → speeding-up N; decel scenarios → braking N */
        function referencePhaseA() {
            return isAccelScenario() ? accelPhaseA() : brakePhaseA();
        }

        /** Cruise |v| after the accel interval (or for coast-start scenarios). */
        function cruiseSpeed() {
            const tCruise = isAccelScenario() ? accelDuration : BRAKE_T;
            return aMag() * tCruise;
        }

        /** Distance covered while braking from cruise to rest at |a|. */
        function brakeDistanceM() {
            const tCruise = isAccelScenario() ? accelDuration : BRAKE_T;
            return 0.5 * aMag() * tCruise * tCruise;
        }

        function remainingM() {
            return Math.abs(targetY() * SHAFT_H - posM);
        }

        function syncCabinFromPos() {
            cabinY = Math.min(1, Math.max(0, posM / SHAFT_H));
        }

        function syncCruiseVelocity() {
            velocity = motionSign() * cruiseSpeed();
        }

        /** Cap accel time so accel + a stretch of constant-speed coast fit in the shaft. */
        function fitAccelDuration() {
            const travel = Math.abs(targetY() * SHAFT_H - startY * SHAFT_H);
            const coastMin = 8; // m of constant-speed coast after speeding up
            // accelDist = 0.5 a t^2
            const tmax = Math.sqrt(Math.max(0.25, 2 * (travel - coastMin) / Math.max(aMag(), 0.05)));
            return Math.min(BRAKE_T, tmax);
        }

        /** True when cabin has reached the destination end of the shaft. */
        function reachedDestination() {
            const dest = targetY() * SHAFT_H;
            return isUpScenario() ? posM >= dest - 0.05 : posM <= dest + 0.05;
        }

        /**
         * Accel scenarios: after coasting to the end, snap the display back to
         * the t = 0 start (as if Pause was pressed at the beginning): a ≠ 0, N ≠ mg.
         */
        function finishShowingInitialAccel() {
            playing = false;
            tripFinished = true;
            stopped = false;
            // Restore the opening frame of this scenario (t = 0)
            posM = startY * SHAFT_H;
            syncCabinFromPos();
            velocity = 0;
            accelElapsed = 0;
            phase = 'accel';
            instantA = accelPhaseA();
            simTime = 0;
            pushHistory();
            updateUI();
        }

        /** Freeze near end of braking: still moving slowly, a ≠ 0, N ≠ mg. */
        function finishAtBrakePhase() {
            playing = false;
            tripFinished = true;
            stopped = false;
            phase = 'decel';
            instantA = brakePhaseA();
            const sign = motionSign();
            const keepV = Math.max(1.2, 0.2 * cruiseSpeed());
            velocity = sign * keepV;
            pushHistory();
            updateUI();
        }

        /** Restart current scenario from the beginning and play. */
        function replayScenario() {
            applyScenarioStart();
            playing = true;
            tripFinished = false;
            stopped = false;
            lastTs = 0;
            updateUI();
            draw();
        }

        function currentPhaseKey() {
            if (phase === 'rest' || (stopped && !tripFinished)) return 'stopped';
            if (phase === 'accel') {
                if (scenarioId === 'upAccel') return 'upAccel';
                if (scenarioId === 'downAccel') return 'downAccel';
                return 'accel';
            }
            if (phase === 'decel') {
                return isUpScenario() ? 'upDecel' : 'downDecel';
            }
            if (phase === 'coast') return 'coast';
            return 'rest';
        }

        function clearHistory() {
            simTime = 0;
            history = [];
            lastTs = 0;
        }

        function pushHistory() {
            const N = normal();
            const a = accel();
            const last = history[history.length - 1];
            // Record densely so N(t) shows every-instance change
            if (last && Math.abs(last.t - simTime) < 0.008) {
                last.N = N;
                last.a = a;
                return;
            }
            history.push({ t: simTime, N, a });
            while (history.length > 1 && history[history.length - 1].t - history[0].t > HISTORY_MAX_T) {
                history.shift();
            }
        }

        function applyScenarioStart() {
            stopped = false;
            tripFinished = false;
            clearHistory();
            startY = isUpScenario() ? 0.12 : 0.88;
            posM = startY * SHAFT_H;
            syncCabinFromPos();
            accelElapsed = 0;

            if (isAccelScenario()) {
                accelDuration = fitAccelDuration();
                velocity = 0;
                phase = 'accel';
                instantA = accelPhaseA();
            } else {
                accelDuration = BRAKE_T;
                syncCruiseVelocity();
                instantA = 0;
                phase = 'coast';
                // If already inside the braking distance, brake immediately
                if (remainingM() <= brakeDistanceM() + 0.05) {
                    phase = 'decel';
                    instantA = brakePhaseA();
                }
            }
            pushHistory();
        }

        function buildScenarioButtons() {
            const box = document.getElementById('scenario-btns');
            box.innerHTML = '';
            const labels = t().scenarios;
            SCENARIOS.forEach((s) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'sc-btn' + (s.id === scenarioId ? ' active' : '');
                b.textContent = labels[s.id];
                b.dataset.id = s.id;
                b.addEventListener('click', () => {
                    scenarioId = s.id;
                    applyScenarioStart();
                    playing = true;
                    buildScenarioButtons();
                    updateUI();
                    draw();
                });
                box.appendChild(b);
            });
        }

        function updateLanguageUI() {
            const d = t();
            document.documentElement.lang = currentLang === 'zh' ? 'zh-HK' : 'en';
            document.title = d.title;
            document.getElementById('lang-toggle').innerText = d.langBtn;
            document.getElementById('page-title').innerText = d.title;
            document.getElementById('page-desc').innerText = d.desc;

            document.getElementById('label-anim').innerText = d.animSpeed;

            document.getElementById('leg-w').innerText = d.legW;
            document.getElementById('leg-a').innerText = d.legA;

        function isFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function updateFullscreenBtn() {
            const btn = document.getElementById('fullscreen-btn');
            if (!btn) return;
            const d = t();
            btn.textContent = isFullscreen() ? d.exitFullscreen : d.fullscreen;
        }

        async function toggleFullscreen() {
            try {
                if (isFullscreen()) {
                    if (document.exitFullscreen) await document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } else {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                }
            } catch (_) {
                /* ignore denied / unsupported */
            }
        }

        function updateUI() {
            const d = t();
            const m = mass();

            document.getElementById('massVal').textContent = `${m.toFixed(0)} kg`;
            document.getElementById('animSpeedVal').textContent = `×${animSpeed().toFixed(2)}`;
            playBtn.innerText = playing ? d.pause : d.play;
            document.getElementById('resetBtn').innerText = d.reset;
            const cues = {
                upAccel: d.cueUpAccel,
                upDecel: d.cueUpDecel,
                downAccel: d.cueDownAccel,

            };
            document.getElementById('case-cue').textContent = cues[scenarioId] || '';
            document.getElementById('phaseTag').textContent = d.phases[currentPhaseKey()] || '';
        }

        function drawArrow(ctx, x0, y0, x1, y1, color, width = 3, headLen = 10) {
            const ang = Math.atan2(y1 - y0, x1 - x0);
            const head = headLen;
            // Shaft stops short of the tip so the head stays full-size while the stem can be thin
            const shaftEndX = x1 - head * 0.72 * Math.cos(ang);
            const shaftEndY = y1 - head * 0.72 * Math.sin(ang);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'butt';
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(shaftEndX, shaftEndY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x1 - head * Math.cos(ang - 0.4), y1 - head * Math.sin(ang - 0.4));
            ctx.lineTo(x1 - head * Math.cos(ang + 0.4), y1 - head * Math.sin(ang + 0.4));
            ctx.closePath();
            ctx.fill();
        }

        function drawScene() {
            const ctx = sceneCtx;
            const w = sceneCanvas.clientWidth || sceneCanvas.width;
            const h = sceneCanvas.clientHeight || sceneCanvas.height;
            const d = t();
            ctx.clearRect(0, 0, w, h);

            const s = Math.max(0.52, Math.min(1, h / 580));
            const shaftTop = Math.round(20 * s);
            const shaftPad = Math.round(20 * s);
            const shaftH = h - shaftTop - shaftPad;
            const cabinH = Math.round(110 * s);
            const travelPadTop = Math.round(20 * s);
            const travelPadBot = Math.round(30 * s);
            const travel = Math.max(24, shaftH - cabinH - travelPadTop - travelPadBot);

            // Room on left for |v|, on right for N gauge + a
            const leftLane = Math.min(150, Math.max(118, w * 0.26));
            const rightLane = Math.min(180, Math.max(110, w * 0.30));
            const sw = Math.max(72, Math.min(w * 0.40, w - leftLane - rightLane));
            const sx = leftLane;
            ctx.fillStyle = '#dbe3ec';
            ctx.fillRect(sx, shaftTop, sw, shaftH);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = Math.max(2, 3 * s);
            ctx.strokeRect(sx, shaftTop, sw, shaftH);

            // Floors marks
            ctx.strokeStyle = 'rgba(100,116,139,0.35)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 6; i++) {
                const y = shaftTop + travelPadTop + i * (travel / 5);
                ctx.beginPath();
                ctx.moveTo(sx, y);
                ctx.lineTo(sx + sw, y);
                ctx.stroke();
            }

            const cabinTop = shaftTop + travelPadTop + (1 - cabinY) * travel;
            const cabinInset = 12 * s;
            const cabinW = Math.max(40, sw - 2 * cabinInset);
            const cx = sx + (sw - cabinW) / 2;
            const cabinPad = 8 * s;

            // Cable
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = Math.max(1.5, 2 * s);
            ctx.beginPath();
            ctx.moveTo(sx + sw / 2, shaftTop);
            ctx.lineTo(sx + sw / 2, cabinTop);
            ctx.stroke();
            ctx.fillStyle = '#64748b';
            ctx.font = `bold ${Math.round(14 * s)}px "Noto Sans TC", sans-serif`;
            ctx.textAlign = 'left';
            ctx.fillText(d.cable, sx + sw / 2 + 8 * s, shaftTop + 18 * s);

            // Cabin body
            ctx.fillStyle = '#f8fafc';
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = Math.max(1.5, 2 * s);
            ctx.beginPath();
            ctx.roundRect(cx, cabinTop, cabinW, cabinH, 8 * s);
            ctx.fill();
            ctx.stroke();

            // Floor of cabin
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(cx + 4 * s, cabinTop + cabinH - 14 * s, cabinW - 8 * s, 10 * s);
            ctx.fillStyle = '#475569';
            ctx.font = `bold ${Math.round(14 * s)}px "Noto Sans TC", sans-serif`;
            ctx.fillText(d.floor, cx + cabinPad, cabinTop + cabinH - 2 * s);

            // Person (simple)
            const px = cx + cabinW / 2;
            const py = cabinTop + cabinH - 18 * s;
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(px, py - 52 * s, 10 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(px - 9 * s, py - 42 * s, 18 * s, 28 * s);
            ctx.fillRect(px - 12 * s, py - 14 * s, 8 * s, 14 * s);
            ctx.fillRect(px + 4 * s, py - 14 * s, 8 * s, 14 * s);
            ctx.fillStyle = '#0f766e';
            ctx.font = `bold ${Math.round(14 * s)}px "Noto Sans TC", sans-serif`;
            ctx.textAlign = 'left';
            // Sit right of the person so the label does not cover the N arrow
            ctx.fillText(d.man, px + 16 * s, py - 64 * s);

            const N = normal();
            const W = weight();
            const a = accel();
            // Longer base so N vs mg length difference is easy to read at start/stop
            const baseLen = 72 * s;
            const nLen = forcePx(N, baseLen);
            const wLen = forcePx(W, baseLen);
            const nSt = forceStyle(N, s);
            const wSt = forceStyle(W, s);

            const nArrowX = px - 22 * s;
            const nTextX = nArrowX - 8 * s;
            if (nLen > 0) {
                drawArrow(ctx, nArrowX, py, nArrowX, py - nLen, '#059669', nSt.width, nSt.head);
                ctx.fillStyle = '#059669';
                ctx.textAlign = 'right';
                ctx.font = `bold ${Math.round(16 * s)}px "Noto Sans TC", sans-serif`;
                ctx.fillText('N', nTextX, py - nLen / 2);
            } else {
                ctx.fillStyle = '#059669';
                ctx.textAlign = 'right';
                ctx.font = `bold ${Math.round(15 * s)}px "Noto Sans TC", sans-serif`;
                ctx.fillText('N', nTextX, py - 8 * s);
            }

            const wArrowX = px + 22 * s;
            const wStartY = py - 30 * s;
            drawArrow(ctx, wArrowX, wStartY, wArrowX, wStartY + wLen, '#dc2626', wSt.width, wSt.head);
            const wMidY = wStartY + wLen / 2;
            const cabinBlackBottom = cabinTop + cabinH;
            const mgLabelY = Math.min(wMidY, cabinBlackBottom - 10 * s);
            const mgTextX = wArrowX + 12 * s;
            ctx.fillStyle = '#dc2626';
            ctx.textAlign = 'left';
            ctx.font = `bold ${Math.round(16 * s)}px "Noto Sans TC", sans-serif`;
            ctx.fillText('mg', mgTextX, mgLabelY);
            ctx.textAlign = 'left';

            const aLabelSample = 'a 0.0 ms⁻²';
            ctx.font = `bold ${Math.round(15 * s)}px sans-serif`;
            const aTextW = ctx.measureText(aLabelSample).width + 14;
            const gaugeX = Math.min(sx + sw + 48 * s, w - aTextW - 56 * s);
            drawNormalGauge(ctx, gaugeX, cabinTop + 8 * s, cabinH - 16 * s, N, W, d, s);

            // |v| on the LEFT of the shaft
            const kvx = Math.max(22 * s, sx - 28 * s);
            const kvy = cabinTop + cabinH / 2;
            const speed = Math.abs(velocity);
            const vLen = vPx(velocity, 100 * s);
            ctx.fillStyle = '#0369a1';
            ctx.font = `bold ${Math.round(15 * s)}px sans-serif`;
            ctx.textAlign = 'right';
            if (vLen > 2) {
                if (velocity > 0) drawArrow(ctx, kvx, kvy + vLen / 2, kvx, kvy - vLen / 2, '#0369a1', 3 * s);
                else drawArrow(ctx, kvx, kvy - vLen / 2, kvx, kvy + vLen / 2, '#0369a1', 3 * s);
                ctx.fillText(`|v| = ${speed.toFixed(2)} ms⁻¹`, Math.max(4, kvx - 8 * s), kvy + vLen / 2 + 18 * s);
            } else {
                ctx.fillText('|v| = 0.00 ms⁻¹', Math.max(4, kvx - 8 * s), kvy + 6 * s);
            }
            ctx.textAlign = 'left';

            // a — label above, arrow underneath; sit right of N gauge
            const aLen = aPx(a, 110 * s);
            ctx.fillStyle = '#7c3aed';
            ctx.font = `bold ${Math.round(15 * s)}px sans-serif`;
            ctx.textAlign = 'left';
            const aLabel = aLen > 2 ? `a ${a.toFixed(1)} ms⁻²` : 'a = 0 ms⁻²';
            const aLabelW = ctx.measureText(aLabel).width;
            const aLabelX = Math.min(
                gaugeX + 36 * s,
                w - aLabelW - 6
            );
            const aBlockH = (aLen > 2 ? aLen : 16 * s) + 22 * s;
            const aLabelY = Math.max(
                cabinTop + 18 * s,
                cabinTop + cabinH / 2 - aBlockH / 2 + 14 * s
            );
            ctx.fillText(aLabel, aLabelX, aLabelY);
            const kax = aLabelX + aLabelW / 2;
            const arrowTop = aLabelY + 10 * s;
            if (aLen > 2) {
                if (a > 0) drawArrow(ctx, kax, arrowTop + aLen, kax, arrowTop, '#7c3aed', 3.5 * s);
                else drawArrow(ctx, kax, arrowTop, kax, arrowTop + aLen, '#7c3aed', 3.5 * s);
            }
        }

        function drawNormalGauge(ctx, x, yTop, height, N, W, d, s = 1, ts = s) {
            const yBot = yTop + height;
            const barW = 12 * s;
            const maxRatio = 1.8; // gauge top = 1.8 mg
            const mgY = yBot - (1 / maxRatio) * height;
            const nRatio = W > 0 ? Math.min(maxRatio, N / W) : 0;
            const nY = yBot - (nRatio / maxRatio) * height;

            // Track (butt edges so fill lines up exactly with ticks)
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(x - barW / 2, yTop, barW, height);

            // Green N fill — top edge is exactly nY
            ctx.fillStyle = '#059669';
            ctx.fillRect(x - barW / 2, nY, barW, yBot - nY);

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.strokeRect(x - barW / 2, yTop, barW, height);

            // Red mg reference line across the bar
            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = Math.max(1.5, 2 * s);
            ctx.beginPath();
            ctx.moveTo(x - 16 * s, mgY);
            ctx.lineTo(x + 16 * s, mgY);
            ctx.stroke();

            // "mg" on the LEFT of the vertical column (gap from lift box set by gaugeX)
            ctx.fillStyle = '#dc2626';
            ctx.font = `bold ${Math.round(16 * ts)}px "Noto Sans TC", sans-serif`;
            ctx.textAlign = 'right';
            ctx.fillText('mg', x - 18 * s, mgY + 5 * ts);

            // Side marker at N level (tip on the bar edge at nY — aligns with red line when N = mg)
            ctx.fillStyle = '#059669';
            ctx.beginPath();
            ctx.moveTo(x + barW / 2, nY);          // tip touches bar at N height
            ctx.lineTo(x + barW / 2 + 12 * s, nY - 8 * s);
            ctx.lineTo(x + barW / 2 + 12 * s, nY + 8 * s);
            ctx.closePath();
            ctx.fill();

            // Title "N" above the column — height vs mg line shows magnitude (no number)
            ctx.textAlign = 'center';
            ctx.fillStyle = '#059669';
            ctx.font = `bold ${Math.round(16 * ts)}px "Noto Sans TC", sans-serif`;
            ctx.fillText('N', x, yTop - 8 * ts);
            ctx.textAlign = 'left';
        }

        function drawFbd() {
            const ctx = fbdCtx;
            const w = fbdCanvas.clientWidth || fbdCanvas.width;
            const h = fbdCanvas.clientHeight || fbdCanvas.height;
            ctx.clearRect(0, 0, w, h);

            // Grow with canvas so the force arrows stay the visual focus
            const s = Math.max(0.85, Math.min(1.55, Math.min(w, h) / 420));
            const cx = w / 2;
            const cy = h / 2 + 6 * s;
            const N = normal();
            const W = weight();
            const a = accel();
            const baseLen = 130 * s;
            const nLen = forcePx(N, baseLen);
            const wLen = forcePx(W, baseLen);
            const nSt = forceStyle(N, s);
            const wSt = forceStyle(W, s);
            const forceFont = `bold ${Math.round(22 * s)}px "Noto Sans TC", sans-serif`;
            const sideFont = `bold ${Math.round(15 * s)}px sans-serif`;

            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.arc(cx, cy, 28 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2.5 * s;
            ctx.stroke();
            ctx.fillStyle = '#1e293b';
            ctx.font = forceFont;
            ctx.textAlign = 'center';
            ctx.fillText('m', cx, cy + 7 * s);
            ctx.textAlign = 'left';

            if (nLen > 0) {
                drawArrow(ctx, cx, cy, cx, cy - nLen, '#059669', nSt.width, nSt.head);
                ctx.fillStyle = '#059669';
                ctx.font = forceFont;
                ctx.fillText('N', cx + 26 * s, cy - Math.max(28 * s, nLen / 2));
            } else {
                ctx.fillStyle = '#059669';
                ctx.font = forceFont;
                ctx.fillText('N', cx + 32 * s, cy - 16 * s);
            }
            drawArrow(ctx, cx, cy, cx, cy + wLen, '#dc2626', wSt.width, wSt.head);
            ctx.fillStyle = '#dc2626';
            ctx.font = forceFont;
            ctx.fillText('mg', cx + 26 * s, cy + Math.max(34 * s, wLen / 2 + 4));

            // a (left) and |v| (right): label above, arrow underneath — symmetric layout
            ctx.fillStyle = '#7c3aed';
            ctx.font = sideFont;
            const aFbdLabel = `a = ${a.toFixed(2)} ms⁻²`;
            const aFbdX = 14 * s;
            const sideLabelY = 22 + 6 * s;
            ctx.textAlign = 'left';
            ctx.fillText(aFbdLabel, aFbdX, sideLabelY);
            const al = aPx(a, 110 * s);
            const aArrowX = aFbdX + ctx.measureText(aFbdLabel).width / 2;
            const sideArrowTop = sideLabelY + 12 * s;
            if (al > 2) {
                if (a > 0) drawArrow(ctx, aArrowX, sideArrowTop + al, aArrowX, sideArrowTop, '#7c3aed', 4 * s);
                else drawArrow(ctx, aArrowX, sideArrowTop, aArrowX, sideArrowTop + al, '#7c3aed', 4 * s);
            }

            const speed = Math.abs(velocity);
            const vl = vPx(velocity, 110 * s);
            ctx.fillStyle = '#0369a1';
            ctx.font = sideFont;
            const vFbdLabel = `|v| = ${speed.toFixed(2)} ms⁻¹`;
            ctx.textAlign = 'right';
            ctx.fillText(vFbdLabel, w - 14 * s, sideLabelY);
            const vArrowX = w - 14 * s - ctx.measureText(vFbdLabel).width / 2;
            if (vl > 2) {
                if (velocity > 0) drawArrow(ctx, vArrowX, sideArrowTop + vl, vArrowX, sideArrowTop, '#0369a1', 4 * s);
                else drawArrow(ctx, vArrowX, sideArrowTop, vArrowX, sideArrowTop + vl, '#0369a1', 4 * s);
            }
            ctx.textAlign = 'left';
        }

        function drawNtGraph() {
            const ctx = ntCtx;
            const w = ntCanvas.clientWidth || ntCanvas.width;
            const h = ntCanvas.clientHeight || ntCanvas.height;
            ctx.clearRect(0, 0, w, h);

            const pad = { l: 100, r: 36, t: 32, b: 40 };
            const plotW = w - pad.l - pad.r;
            const plotH = h - pad.t - pad.b;
            const W = weight();
            // Fixed non-mg phase normal force for current m and |a| (does not move with time)
            const Nphase = Math.max(0, mass() * (G + referencePhaseA()));
            const maxN = Math.max(W, Nphase) * 1.25;
            const t0 = history.length ? history[0].t : 0;
            const t1 = Math.max(t0 + 4, history.length ? history[history.length - 1].t : 4, simTime);
            const span = Math.max(0.001, t1 - t0);

            const xOf = (t) => pad.l + ((t - t0) / span) * plotW;
            const yOf = (N) => pad.t + plotH - (N / maxN) * plotH;

            // Axes
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(pad.l, pad.t);
            ctx.lineTo(pad.l, pad.t + plotH);
            ctx.lineTo(pad.l + plotW, pad.t + plotH);
            ctx.stroke();

            const mgY = yOf(W);
            const nPhaseY = yOf(Nphase);

            // Dashed mg reference across the plot
            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 5]);
            ctx.beginPath();
            ctx.moveTo(pad.l, mgY);
            ctx.lineTo(pad.l + plotW, mgY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Tick on Y-axis at the fixed brake-phase N level
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(pad.l - 7, nPhaseY);
            ctx.lineTo(pad.l + 7, nPhaseY);
            ctx.stroke();

            // N(t) polyline
            if (history.length >= 1) {
                ctx.strokeStyle = '#059669';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                history.forEach((p, i) => {
                    const x = xOf(p.t);
                    const y = yOf(p.N);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();

                const cur = history[history.length - 1];
                ctx.fillStyle = '#059669';
                ctx.beginPath();
                ctx.arc(xOf(cur.t), yOf(cur.N), 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Left-axis labels: mg and N phase marks (length/height only — no numeric forces)
            ctx.font = 'bold 14px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'right';
            let yMgLbl = mgY + 5;
            let yNLbl = nPhaseY + 5;
            if (Math.abs(yMgLbl - yNLbl) < 16) {
                if (Nphase < W) yNLbl = yMgLbl + 18;
                else yNLbl = yMgLbl - 18;
            }
            ctx.fillStyle = '#dc2626';
            ctx.fillText('mg', pad.l - 10, yMgLbl);
            ctx.fillStyle = '#1e293b';
            ctx.fillText('N', pad.l - 10, yNLbl);
            ctx.fillStyle = '#64748b';
            ctx.fillText('0', pad.l - 10, pad.t + plotH + 5);

            // Axis titles
            ctx.fillStyle = '#334155';
            ctx.textAlign = 'left';
            ctx.fillText('N (N)', 8, 18);
            ctx.fillText(t0.toFixed(1), pad.l, h - 12);
            ctx.textAlign = 'right';
            ctx.fillText(t1.toFixed(1), pad.l + plotW, h - 12);
            ctx.fillText('t (s)', pad.l + plotW + 4, pad.t + plotH - 8);
            ctx.textAlign = 'left';
        }

        function draw() {
            drawScene();
            drawFbd();
        }

        function fitCanvas(canvas, cssW, cssH) {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const w = Math.max(1, Math.floor(cssW));
            const h = Math.max(1, Math.floor(cssH));
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            // Prefer crisp geometry/text on HiDPI
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
        }

        function resize() {
            const sParent = sceneCanvas.parentElement;
            const fParent = fbdCanvas.parentElement;
            let sceneH = 640;
            let fbdH = 640;
            if (isFullscreen()) {
                // Stretch both panels to use full remaining height
                const labelH = sParent.querySelector('.canvas-label')?.offsetHeight || 22;
                const legendH = sParent.querySelector('.legend')?.offsetHeight || 28;
                const phaseH = sParent.querySelector('.phase-tag')?.offsetHeight || 0;
                const cardPad = 16;
                const extras = labelH + legendH + phaseH + cardPad + 8;
                const cardH = sParent.clientHeight;
                const gridH = document.querySelector('.main-grid')?.clientHeight || 0;
                const fillH = Math.max(cardH, gridH);
                if (fillH > extras + 120) {
                    sceneH = Math.floor(fillH - extras);
                } else {
                    const vh = window.innerHeight;
                    sceneH = Math.max(280, vh - 150 - extras);
                }
                const fbdLabelH = fParent.querySelector('.canvas-label')?.offsetHeight || 22;
                const fbdFill = fParent.clientHeight || fillH;
                fbdH = Math.max(200, Math.min(sceneH, fbdFill - fbdLabelH - 24));
            }
            const sceneW = Math.min(Math.max(280, sParent.clientWidth - 32), 1048);
            const fbdW = Math.min(Math.max(260, fParent.clientWidth - 32), 1048);
            fitCanvas(fbdCanvas, fbdW, fbdH);

            if (!isFullscreen()) {
                fitCanvas(sceneCanvas, sceneW, sceneH);
                fitCanvas(fbdCanvas, fbdW, fbdH);
                draw();
                requestAnimationFrame(() => {
                    if (isFullscreen()) return;
                    const labelH = sParent.querySelector('.canvas-label')?.offsetHeight || 22;
                    const legendH = sParent.querySelector('.legend')?.offsetHeight || 28;
                    const phaseH = sParent.querySelector('#phaseTag')?.offsetHeight || 0;
                    const cs = getComputedStyle(sParent);
                    const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
                    const fLabelH = fParent.querySelector('.canvas-label')?.offsetHeight || 22;
                    const fCs = getComputedStyle(fParent);
                    const fPadY = (parseFloat(fCs.paddingTop) || 0) + (parseFloat(fCs.paddingBottom) || 0);
                    // Match both canvases to the taller card content area
                    const targetH = Math.max(
                        640,
                        Math.floor(Math.max(sParent.clientHeight, fParent.clientHeight) - Math.max(padY + labelH + legendH + phaseH + 16, fPadY + fLabelH + 16))
                    );
                    if (Math.abs(targetH - sceneCanvas.clientHeight) > 4 || Math.abs(targetH - fbdCanvas.clientHeight) > 4) {
                        fitCanvas(sceneCanvas, sceneW, targetH);
                        fitCanvas(fbdCanvas, fbdW, targetH);
                    }
                    draw();
                });
                return;
            }

            fitCanvas(sceneCanvas, sceneW, sceneH);
            fitCanvas(fbdCanvas, fbdW, fbdH);
            draw();

            // Fullscreen: remeasure after layout so both panels fill leftover space
            requestAnimationFrame(() => {
                if (!isFullscreen()) return;
                const labelH = sParent.querySelector('.canvas-label')?.offsetHeight || 22;
                const legendH = sParent.querySelector('.legend')?.offsetHeight || 28;
                const phaseH = sParent.querySelector('#phaseTag')?.offsetHeight || 0;
                const extras = labelH + legendH + phaseH + 24;
                const fillH = Math.max(sParent.clientHeight, document.querySelector('.main-grid')?.clientHeight || 0);
                const nextH = Math.floor(fillH - extras);
                if (nextH > 120 && Math.abs(nextH - sceneH) > 6) {
                    fitCanvas(sceneCanvas, sceneW, nextH);
                    const fbdLabelH = fParent.querySelector('.canvas-label')?.offsetHeight || 22;
                    const fbdFill = fParent.clientHeight || fillH;
                    const nextFbd = Math.max(200, Math.min(nextH, fbdFill - fbdLabelH - 24));
                    fitCanvas(fbdCanvas, fbdW, nextFbd);
                    draw();
                }
            });
        }

        function stopCabin() {
            stopped = true;
            velocity = 0;
            instantA = 0;
            phase = 'rest';
            playing = false;
            posM = targetY() * SHAFT_H;
            syncCabinFromPos();
            pushHistory();
            updateUI();
        }

        function tick(ts) {
            if (!lastTs) lastTs = ts;
            const dt = Math.min(0.04, (ts - lastTs) / 1000);
            lastTs = ts;

            if (playing && !stopped && !tripFinished) {
                const dtSim = dt * animSpeed();
                simTime += dtSim;

                if (phase === 'accel') {
                    instantA = accelPhaseA();
                    posM += velocity * dtSim + 0.5 * instantA * dtSim * dtSim;
                    velocity += instantA * dtSim;
                    accelElapsed += dtSim;
                    syncCabinFromPos();
                    if (accelElapsed >= accelDuration - 1e-4
                        || Math.abs(velocity) >= cruiseSpeed() - 1e-3) {
                        // Reach constant speed, then keep coasting
                        phase = 'coast';
                        syncCruiseVelocity();
                        instantA = 0;
                    }
                } else if (phase === 'coast') {
                    instantA = 0;
                    syncCruiseVelocity();
                    posM += velocity * dtSim;
                    syncCabinFromPos();

                    if (isAccelScenario()) {
                        // Keep moving at constant speed; when trip ends, show initial N ≠ mg
                        if (reachedDestination()) {
                            finishShowingInitialAccel();
                            draw();
                            requestAnimationFrame(tick);
                            return;
                        }
                    } else if (remainingM() <= brakeDistanceM() + 1e-4) {
                        phase = 'decel';
                        syncCruiseVelocity();
                        instantA = brakePhaseA();
                    }
                }
                if (phase === 'decel' && !stopped && !tripFinished) {
                    instantA = brakePhaseA();
                    posM += velocity * dtSim + 0.5 * instantA * dtSim * dtSim;
                    velocity += instantA * dtSim;
                    syncCabinFromPos();

                    const arrived = isUpScenario()
                        ? (velocity <= 0 || posM >= targetY() * SHAFT_H)
                        : (velocity >= 0 || posM <= targetY() * SHAFT_H);
                    // Freeze while still braking / moving (N ≠ mg), not fully stopped
                    if (arrived || Math.abs(velocity) <= 0.25 * cruiseSpeed()) {
                        finishAtBrakePhase();
                        draw();
                        requestAnimationFrame(tick);
                        return;
                    }
                }

                pushHistory();
                updateUI();
            }
            draw();
            requestAnimationFrame(tick);
        }

        massSlider.addEventListener('input', () => {
            pushHistory();
            updateUI();
            draw();
        });
        animSpeedSlider.addEventListener('input', () => {
            updateUI();
        });
        playBtn.addEventListener('click', () => {
            // After an accel trip ends at the side, Play restarts the animation
            if (tripFinished || stopped) {
                replayScenario();
                return;
            }
            playing = !playing;
            lastTs = 0;
            updateUI();
        });
        document.getElementById('resetBtn').addEventListener('click', () => {
            replayScenario();
        });
        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateLanguageUI();
        });
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            toggleFullscreen();
        });
        function onFullscreenChange() {
            document.body.classList.toggle('is-fullscreen', isFullscreen());
            updateFullscreenBtn();
            // Wait a frame so layout width is restored before measuring canvases
            requestAnimationFrame(() => {
                requestAnimationFrame(resize);
            });
        }
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        window.addEventListener('message', (ev) => {
            if (ev.data?.type !== 's3phy:lang') return;
            currentLang = hubLangToLocal(ev.data.lang);
            updateLanguageUI();
        });
        window.addEventListener('resize', resize);

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                const rr = Math.min(r, w / 2, h / 2);
                this.moveTo(x + rr, y);
                this.arcTo(x + w, y, x + w, y + h, rr);
                this.arcTo(x + w, y + h, x, y + h, rr);
                this.arcTo(x, y + h, x, y, rr);
                this.arcTo(x, y, x + w, y, rr);
                this.closePath();
            };
        }

        updateLanguageUI();
        applyScenarioStart();
        resize();
        requestAnimationFrame(tick);
    </script>
</body>
</html>
