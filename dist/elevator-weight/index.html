<!DOCTYPE html>
<html lang="zh-HK" translate="no">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電梯中的受力</title>
    <link rel="stylesheet" href="../shared/s3phy-embed.css">
    <script src="../shared/s3phy-embed-init.js"></script>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <div class="el-wrap">
    <header class="el-head">
        <h2 class="el-title" id="page-title">Forces in an elevator</h2>
        <p class="el-sub" id="page-desc">Normal force, weight and acceleration when a lift goes up or down.</p>
        <div class="el-head-actions">
            <button type="button" class="el-fs-btn" id="fullscreen-btn">⛶ Full screen</button>
            <button type="button" class="el-lang-btn" id="lang-toggle">🌐 English</button>
        </div>
    </header>

    <div class="el-dash">
        <div class="el-card">
            <div class="el-scenarios" id="scenario-btns"></div>
            <div class="el-controls-row">
                <div class="el-control-group">
                    <span class="el-slider-label" id="label-mass">Mass m</span>
                    <div class="el-slider-row">
                        <input type="range" id="massSlider" min="40" max="100" step="1" value="70">
                        <span class="el-val" id="massVal">70 kg</span>
                    </div>
                </div>
                <div class="el-control-group">
                    <span class="el-slider-label" id="label-anim">Animation speed</span>
                    <div class="el-slider-row">
                        <input type="range" id="animSpeedSlider" min="0.35" max="2.5" step="0.05" value="1">
                        <span class="el-val" id="animSpeedVal">×1.00</span>
                    </div>
                </div>
                <button type="button" class="el-play-btn" id="playBtn">▶ Play</button>
                <button type="button" class="el-play-btn secondary" id="resetBtn">↺ Reset</button>
            </div>
            <p id="case-cue"></p>
        </div>

        <div class="el-main-grid">
            <div class="el-card el-viz-card">
                <div class="el-canvas-label" id="label-scene">Elevator shaft (side view)</div>
                <canvas id="sceneCanvas" width="640" height="580"></canvas>
                <div class="el-legend">
                    <span class="ln" id="leg-n">N (normal)</span>
                    <span class="lw" id="leg-w">W = mg (weight)</span>
                    <span class="lv" id="leg-v">v (speed)</span>
                </div>
                <span class="el-phase-tag" id="phaseTag"></span>
            </div>
            <div class="el-card el-viz-card fbd-card">
                <div class="el-canvas-label" id="label-fbd">Free-body diagram</div>
                <canvas id="fbdCanvas" width="640" height="640"></canvas>
            </div>
        </div>
    </div>
    </div>

    <script>
        const G = 9.81;
        const UI_FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';
        const C = {
            n: '#10b981',
            w: '#ef4444',
            a: '#6366f1',
            v: '#0891b2',
            text: '#1f2937',
            muted: '#64748b',
            border: '#cbd5e1',
            panel: '#f1f5f9',
            shaft: '#e4e4e7',
            accent: '#0891b2',
        };
        function uiFont(px, s = 1) {
            return `bold ${Math.round(px * s)}px ${UI_FONT}`;
        }
        // Physical shaft height so cabinY∈[0,1] maps to metres
        const SHAFT_H = 85; // m — room for accel + coast + brake at |a|=5, t=3 s
        const BRAKE_T = 3; // seconds of non-zero |a| while speeding up or braking
        const FIXED_A = 5.0; // fixed |a| for all scenarios (ms⁻²)
        const V_REF = 24; // m/s — scale for v arrow (≈ max cruise = 5×3)
        const FORCE_REF = 70 * G; // pixel scale reference (70 kg · g)
        const A_REF = 8; // scale for a arrow length
        const SCENE_ASPECT = 620 / 640;
        const FBD_ASPECT = 0.82;
        const FBD_MAX_H = 380;
        const GRID_STACK_MQ = window.matchMedia('(max-width: 820px)');
        const SCENARIOS = [
            { id: 'upAccel' },   // from rest, a↑ — ends still accelerating (N > mg)
            { id: 'upDecel' },   // coast up, then a↓ — ends still braking (N < mg)
            { id: 'downAccel' }, // from rest, a↓ — ends still accelerating (N < mg)
            { id: 'downDecel' }, // coast down, then a↑ — ends still braking (N > mg)
        ];

        const dict = {
            zh: {
                title: '電梯中的受力',
                desc: '四個情況（|a| = 5.0 ms⁻²）：從靜止向上／向下加速；以及勻速後停車前減速（上行變輕、下行變重）。動畫結束時停在 N ≠ mg 的運動狀態。',
                mass: '質量 m',
                animSpeed: '動畫速度',
                play: '▶ 播放',
                pause: '⏸ 暫停',
                fullscreen: '⛶ 全螢幕',
                exitFullscreen: '⛶ 退出全螢幕',
                reset: '↺ 重設位置',
                scene: '電梯井（側視）',
                fbd: '受力圖（自由體圖）',
                nt: '法向力 N 對時間',
                ka: '加速度 a（向上為正）',
                kv: '速率 |v|',
                kn: '法向力 N（地板托力）',
                kw: '重量 mg',
                kratio: 'N / mg',
                legN: 'N（法向力）',
                legW: 'W = mg（重量）',
                legA: 'a（加速度）',
                legV: 'v（速度）',
                legNtN: 'N(t)',
                legNtMg: 'mg（參考）',
                feelHeavy: '感覺變重（N > mg）— a 向上',
                feelNormal: '感覺正常體重（N = mg）',
                feelLight: '感覺變輕（N < mg）— a 向下',
                feelZero: '失重（N = 0）',
                eq: (n, mg, a) => `ΣF = N − mg = ma\nN − ${mg} = m(${a})\nN = ${n} N`,
                scenarios: {
                    upAccel: '上行 · 由靜止 a 向上',
                    upDecel: '上行 · 停車前 a 向下',
                    downAccel: '下行 · 由靜止 a 向下',
                    downDecel: '下行 · 停車前 a 向上',
                },
                cueUpAccel: '由靜止向上加速（|a| = 5.0 ms⁻²，a↑，N > mg）→ 之後保持勻速上行 → 結束時回到 t = 0 的初始加速畫面（N ≠ mg）',
                cueUpDecel: '先勻速上行（a = 0，N = mg）→ 停車前減速（a↓，N < mg）→ 結束停在減速中（仍在動，N ≠ mg）',
                cueDownAccel: '由靜止向下加速（|a| = 5.0 ms⁻²，a↓，N < mg）→ 之後保持勻速下行 → 結束時回到 t = 0 的初始加速畫面（N ≠ mg）',
                cueDownDecel: '先勻速下行（a = 0，N = mg）→ 停車前減速（a↑，N > mg）→ 結束停在減速中（仍在動，N ≠ mg）',
                why: '點解減速至停會變輕／變重？',
                whyLight: '上行減速 → 變輕',
                whyHeavy: '下行減速 → 變重',
                whyReplay: '↺ 重播解說',
                whyStepsLight: [
                    '① 電梯同人一齊向上行。',
                    '② 電梯減速至停：加速度向下（a↓）。',
                    '③ 身體有慣性，傾向繼續向上 → 對地板壓得較少。',
                    '④ 地板托力 N 變細（N < mg）→ 感覺變輕。',
                ],
                whyStepsHeavy: [
                    '① 電梯同人一齊向下行。',
                    '② 電梯減速至停：加速度向上（a↑）。',
                    '③ 身體有慣性，傾向繼續向下 → 對地板壓得較多。',
                    '④ 地板托力 N 變大（N > mg）→ 感覺變重。',
                ],
                whyEqLight: 'ΣF = N − mg = ma\na 向下為負 → N = m(g + a) < mg',
                whyEqHeavy: 'ΣF = N − mg = ma\na 向上為正 → N = m(g + a) > mg',
                whyFloor: '地板',
                whyBody: '人',
                whyGhost: '慣性方向',
                whyInertia: '慣性',
                phases: {
                    rest: '階段：靜止（a = 0）',
                    accel: '階段：加速中',
                    coast: '階段：勻速（N = mg）',
                    decel: '階段：減速中',
                    upAccel: '階段：上行加速（N > mg）',
                    upDecel: '階段：上行減速（N < mg）',
                    downAccel: '階段：下行加速（N < mg）',
                    downDecel: '階段：下行減速（N > mg）',
                    stopped: '階段：已停下（N = mg）',
                },
                man: '人',
                floor: '地板',
                cable: '纜',
                langBtn: '🌐 English',
            },
            en: {
                title: 'Forces in an elevator',
                desc: 'Four cases (|a| = 5.0 ms⁻²): accelerate up/down from rest; and coast then brake (lighter going up, heavier going down). Animation ends frozen while still moving with N ≠ mg.',
                mass: 'Mass m',
                animSpeed: 'Animation speed',
                play: '▶ Play',
                pause: '⏸ Pause',
                fullscreen: '⛶ Full screen',
                exitFullscreen: '⛶ Exit full screen',
                reset: '↺ Reset position',
                scene: 'Elevator shaft (side view)',
                fbd: 'Free-body diagram',
                nt: 'Normal force N vs time',
                ka: 'Acceleration a (up +)',
                kv: 'Speed |v|',
                kn: 'Normal N (floor push)',
                kw: 'Weight mg',
                kratio: 'N / mg',
                legN: 'N (normal)',
                legW: 'W = mg (weight)',
                legA: 'a (acceleration)',
                legV: 'v (speed)',
                legNtN: 'N(t)',
                legNtMg: 'mg (reference)',
                feelHeavy: 'Feels heavier (N > mg) — a upward',
                feelNormal: 'Feels normal weight (N = mg)',
                feelLight: 'Feels lighter (N < mg) — a downward',
                feelZero: 'Weightless (N = 0)',
                eq: (n, mg, a) => `ΣF = N − mg = ma\nN − ${mg} = m(${a})\nN = ${n} N`,
                scenarios: {
                    upAccel: 'Going up · a up from rest',
                    upDecel: 'Going up · a down before stop',
                    downAccel: 'Going down · a down from rest',
                    downDecel: 'Going down · a up before stop',
                },
                cueUpAccel: 'From rest, accelerate UP (|a| = 5.0 ms⁻², a↑, N > mg) → keep constant speed UP → at end, jump back to the t = 0 accel frame (N ≠ mg)',
                cueUpDecel: 'Coast UP (a = 0, N = mg) → brake with a DOWN (N < mg) → ends frozen while still braking (moving, N ≠ mg)',
                cueDownAccel: 'From rest, accelerate DOWN (|a| = 5.0 ms⁻², a↓, N < mg) → keep constant speed DOWN → at end, jump back to the t = 0 accel frame (N ≠ mg)',
                cueDownDecel: 'Coast DOWN (a = 0, N = mg) → brake with a UP (N > mg) → ends frozen while still braking (moving, N ≠ mg)',
                why: 'Why slowing to a stop feels lighter / heavier',
                whyLight: 'Up & slowing → lighter',
                whyHeavy: 'Down & slowing → heavier',
                whyReplay: '↺ Replay explanation',
                whyStepsLight: [
                    '① Cabin and person move upward together.',
                    '② Cabin slows to a stop: acceleration is downward (a↓).',
                    '③ Inertia keeps the body tending upward → less push on the floor.',
                    '④ Floor push N shrinks (N < mg) → you feel lighter.',
                ],
                whyStepsHeavy: [
                    '① Cabin and person move downward together.',
                    '② Cabin slows to a stop: acceleration is upward (a↑).',
                    '③ Inertia keeps the body tending downward → more push on the floor.',
                    '④ Floor push N grows (N > mg) → you feel heavier.',
                ],
                whyEqLight: 'ΣF = N − mg = ma\na downward (negative) → N = m(g + a) < mg',
                whyEqHeavy: 'ΣF = N − mg = ma\na upward (positive) → N = m(g + a) > mg',
                whyFloor: 'Floor',
                whyBody: 'Person',
                whyGhost: 'Inertia path',
                whyInertia: 'Inertia',
                phases: {
                    rest: 'Phase: at rest (a = 0)',
                    accel: 'Phase: accelerating',
                    coast: 'Phase: constant speed (N = mg)',
                    decel: 'Phase: decelerating',
                    upAccel: 'Phase: up & speeding up (N > mg)',
                    upDecel: 'Phase: up & slowing (N < mg)',
                    downAccel: 'Phase: down & speeding up (N < mg)',
                    downDecel: 'Phase: down & slowing (N > mg)',
                    stopped: 'Phase: stopped (N = mg)',
                },
                man: 'Person',
                floor: 'Floor',
                cable: 'Cable',
                langBtn: '🌐 中文',
            },
        };

        function hubLangToLocal(lang) {
            return lang === 'en' ? 'en' : 'zh';
        }

        const params = new URLSearchParams(location.search);
        let currentLang = hubLangToLocal(params.get('lang') || 'zh');
        let scenarioId = 'upDecel';
        let playing = true;
        let cabinY = 0.12;
        let startY = 0.12;
        let posM = 0.12 * SHAFT_H; // cabin height from bottom (m)
        let velocity = 0; // signed SI speed (m/s), up +
        let stopped = false;
        let tripFinished = false; // ended frozen in N≠mg moving phase
        let phase = 'coast'; // accel | coast | decel | rest
        let simTime = 0;
        let history = []; // { t, N, a }
        let lastTs = 0;
        let accelElapsed = 0;
        let accelDuration = BRAKE_T; // may shorten if shaft room is tight
        const HISTORY_MAX_T = 40;
        /** Instantaneous SI acceleration (up +). Non-zero while speeding up or braking. */
        let instantA = 0;

        const sceneCanvas = document.getElementById('sceneCanvas');
        const sceneCtx = sceneCanvas.getContext('2d');
        const fbdCanvas = document.getElementById('fbdCanvas');
        const fbdCtx = fbdCanvas.getContext('2d');
        const ntCanvas = document.getElementById('ntCanvas');
        const ntCtx = ntCanvas ? ntCanvas.getContext('2d') : null;
        const massSlider = document.getElementById('massSlider');
        const animSpeedSlider = document.getElementById('animSpeedSlider');
        const playBtn = document.getElementById('playBtn');

        function t() { return dict[currentLang]; }
        function scenario() { return SCENARIOS.find((s) => s.id === scenarioId); }
        function mass() { return parseFloat(massSlider.value); }
        function aMag() { return FIXED_A; }
        function animSpeed() { return parseFloat(animSpeedSlider.value); }

        function accel() {
            return stopped ? 0 : instantA;
        }

        function weight() { return mass() * G; }
        function normal() {
            // N - mg = ma  (up +)  →  N = m(g+a)
            return Math.max(0, mass() * (G + accel()));
        }

        function forcePx(F, basePx) {
            return F > 0.5 ? Math.max(8, (F / FORCE_REF) * basePx) : 0;
        }
        /** Shaft width + head size track force magnitude (same scale as length). */
        function forceStyle(F, s = 1) {
            const t = Math.min(1.85, Math.max(0.28, F / FORCE_REF));
            return {
                width: (2.2 + 3.0 * t) * s,
                head: (7 + 9 * t) * s,
            };
        }
        function aPx(a, maxPx) {
            return Math.min(maxPx, (Math.abs(a) / A_REF) * maxPx);
        }
        function vPx(v, maxPx) {
            return Math.min(maxPx, (Math.abs(v) / V_REF) * maxPx);
        }

        function isUpScenario() {
            return scenarioId === 'upAccel' || scenarioId === 'upDecel';
        }
        function isAccelScenario() {
            return scenarioId === 'upAccel' || scenarioId === 'downAccel';
        }
        function motionSign() {
            return isUpScenario() ? 1 : -1;
        }
        function targetY() {
            return isUpScenario() ? 0.9 : 0.1;
        }
        /** a while speeding up from rest */
        function accelPhaseA() {
            return motionSign() * aMag();
        }
        /** a while braking to a stop */
        function brakePhaseA() {
            return -motionSign() * aMag();
        }
        /** Signed a for the current non-coast phase. */
        function signedA() {
            if (phase === 'accel') return accelPhaseA();
            if (phase === 'decel') return brakePhaseA();
            return 0;
        }
        /** Fixed N–t axis mark: accel scenarios → speeding-up N; decel scenarios → braking N */
        function referencePhaseA() {
            return isAccelScenario() ? accelPhaseA() : brakePhaseA();
        }

        /** Cruise |v| after the accel interval (or for coast-start scenarios). */
        function cruiseSpeed() {
            const tCruise = isAccelScenario() ? accelDuration : BRAKE_T;
            return aMag() * tCruise;
        }

        /** Distance covered while braking from cruise to rest at |a|. */
        function brakeDistanceM() {
            const tCruise = isAccelScenario() ? accelDuration : BRAKE_T;
            return 0.5 * aMag() * tCruise * tCruise;
        }

        function remainingM() {
            return Math.abs(targetY() * SHAFT_H - posM);
        }

        function syncCabinFromPos() {
            cabinY = Math.min(1, Math.max(0, posM / SHAFT_H));
        }

        function syncCruiseVelocity() {
            velocity = motionSign() * cruiseSpeed();
        }

        /** Cap accel time so accel + a stretch of constant-speed coast fit in the shaft. */
        function fitAccelDuration() {
            const travel = Math.abs(targetY() * SHAFT_H - startY * SHAFT_H);
            const coastMin = 8; // m of constant-speed coast after speeding up
            // accelDist = 0.5 a t^2
            const tmax = Math.sqrt(Math.max(0.25, 2 * (travel - coastMin) / Math.max(aMag(), 0.05)));
            return Math.min(BRAKE_T, tmax);
        }

        /** True when cabin has reached the destination end of the shaft. */
        function reachedDestination() {
            const dest = targetY() * SHAFT_H;
            return isUpScenario() ? posM >= dest - 0.05 : posM <= dest + 0.05;
        }

        /**
         * Accel scenarios: after coasting to the end, snap the display back to
         * the t = 0 start (as if Pause was pressed at the beginning): a ≠ 0, N ≠ mg.
         */
        function finishShowingInitialAccel() {
            playing = false;
            tripFinished = true;
            stopped = false;
            // Restore the opening frame of this scenario (t = 0)
            posM = startY * SHAFT_H;
            syncCabinFromPos();
            velocity = 0;
            accelElapsed = 0;
            phase = 'accel';
            instantA = accelPhaseA();
            simTime = 0;
            pushHistory();
            updateUI();
        }

        /** Freeze near end of braking: still moving slowly, a ≠ 0, N ≠ mg. */
        function finishAtBrakePhase() {
            playing = false;
            tripFinished = true;
            stopped = false;
            phase = 'decel';
            instantA = brakePhaseA();
            const sign = motionSign();
            const keepV = Math.max(1.2, 0.2 * cruiseSpeed());
            velocity = sign * keepV;
            pushHistory();
            updateUI();
        }

        /** Restart current scenario from the beginning and play. */
        function replayScenario() {
            applyScenarioStart();
            playing = true;
            tripFinished = false;
            stopped = false;
            lastTs = 0;
            updateUI();
            draw();
        }

        function currentPhaseKey() {
            if (phase === 'rest' || (stopped && !tripFinished)) return 'stopped';
            if (phase === 'accel') {
                if (scenarioId === 'upAccel') return 'upAccel';
                if (scenarioId === 'downAccel') return 'downAccel';
                return 'accel';
            }
            if (phase === 'decel') {
                return isUpScenario() ? 'upDecel' : 'downDecel';
            }
            if (phase === 'coast') return 'coast';
            return 'rest';
        }

        function clearHistory() {
            simTime = 0;
            history = [];
            lastTs = 0;
        }

        function pushHistory() {
            const N = normal();
            const a = accel();
            const last = history[history.length - 1];
            // Record densely so N(t) shows every-instance change
            if (last && Math.abs(last.t - simTime) < 0.008) {
                last.N = N;
                last.a = a;
                return;
            }
            history.push({ t: simTime, N, a });
            while (history.length > 1 && history[history.length - 1].t - history[0].t > HISTORY_MAX_T) {
                history.shift();
            }
        }

        function applyScenarioStart() {
            stopped = false;
            tripFinished = false;
            clearHistory();
            startY = isUpScenario() ? 0.12 : 0.88;
            posM = startY * SHAFT_H;
            syncCabinFromPos();
            accelElapsed = 0;

            if (isAccelScenario()) {
                accelDuration = fitAccelDuration();
                velocity = 0;
                phase = 'accel';
                instantA = accelPhaseA();
            } else {
                accelDuration = BRAKE_T;
                syncCruiseVelocity();
                instantA = 0;
                phase = 'coast';
                // If already inside the braking distance, brake immediately
                if (remainingM() <= brakeDistanceM() + 0.05) {
                    phase = 'decel';
                    instantA = brakePhaseA();
                }
            }
            pushHistory();
        }

        function buildScenarioButtons() {
            const box = document.getElementById('scenario-btns');
            box.innerHTML = '';
            const labels = t().scenarios;
            SCENARIOS.forEach((s) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'el-sc-btn' + (s.id === scenarioId ? ' active' : '');
                b.textContent = labels[s.id];
                b.dataset.id = s.id;
                b.addEventListener('click', () => {
                    scenarioId = s.id;
                    applyScenarioStart();
                    playing = true;
                    buildScenarioButtons();
                    updateUI();
                    draw();
                });
                box.appendChild(b);
            });
        }

        function updateLanguageUI() {
            const d = t();
            document.documentElement.lang = currentLang === 'zh' ? 'zh-HK' : 'en';
            document.title = d.title;
            document.getElementById('lang-toggle').innerText = d.langBtn;
            document.getElementById('page-title').innerText = d.title;
            document.getElementById('page-desc').innerText = d.desc;
            document.getElementById('label-mass').innerText = d.mass;
            document.getElementById('label-anim').innerText = d.animSpeed;
            document.getElementById('label-scene').innerText = d.scene;
            document.getElementById('label-fbd').innerText = d.fbd;
            const labelNt = document.getElementById('label-nt');
            if (labelNt) labelNt.innerText = d.nt;
            document.getElementById('leg-n').innerText = d.legN;
            document.getElementById('leg-w').innerText = d.legW;
            const legV = document.getElementById('leg-v');
            if (legV) legV.innerText = d.legV;
            const legNtN = document.getElementById('leg-nt-n');
            if (legNtN) legNtN.innerText = d.legNtN;
            const legNtMg = document.getElementById('leg-nt-mg');
            if (legNtMg) legNtMg.innerText = d.legNtMg;
            playBtn.innerText = playing ? d.pause : d.play;
            updateFullscreenBtn();
            buildScenarioButtons();
            updateUI();
            draw();
        }

        function isFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function updateFullscreenBtn() {
            const btn = document.getElementById('fullscreen-btn');
            if (!btn) return;
            const d = t();
            btn.textContent = isFullscreen() ? d.exitFullscreen : d.fullscreen;
        }

        async function toggleFullscreen() {
            try {
                if (isFullscreen()) {
                    if (document.exitFullscreen) await document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } else {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                }
            } catch (_) {
                /* ignore denied / unsupported */
            }
        }

        function updateUI() {
            const d = t();
            const m = mass();

            document.getElementById('massVal').textContent = `${m.toFixed(0)} kg`;
            document.getElementById('animSpeedVal').textContent = `×${animSpeed().toFixed(2)}`;
            playBtn.innerText = playing ? d.pause : d.play;
            document.getElementById('resetBtn').innerText = d.reset;
            const cues = {
                upAccel: d.cueUpAccel,
                upDecel: d.cueUpDecel,
                downAccel: d.cueDownAccel,
                downDecel: d.cueDownDecel,
            };
            document.getElementById('case-cue').textContent = cues[scenarioId] || '';
            document.getElementById('phaseTag').textContent = d.phases[currentPhaseKey()] || '';
        }

        function drawArrow(ctx, x0, y0, x1, y1, color, width = 3, headLen = 10) {
            const ang = Math.atan2(y1 - y0, x1 - x0);
            const head = headLen;
            // Shaft stops short of the tip so the head stays full-size while the stem can be thin
            const shaftEndX = x1 - head * 0.72 * Math.cos(ang);
            const shaftEndY = y1 - head * 0.72 * Math.sin(ang);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'butt';
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(shaftEndX, shaftEndY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x1 - head * Math.cos(ang - 0.4), y1 - head * Math.sin(ang - 0.4));
            ctx.lineTo(x1 - head * Math.cos(ang + 0.4), y1 - head * Math.sin(ang + 0.4));
            ctx.closePath();
            ctx.fill();
        }

        function drawScene() {
            const ctx = sceneCtx;
            const w = sceneCanvas.clientWidth || sceneCanvas.width;
            const h = sceneCanvas.clientHeight || sceneCanvas.height;
            const d = t();
            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            const s = Math.max(0.45, Math.min(1, Math.min(h / 580, w / 640)));
            const shaftTop = Math.round(20 * s);
            const shaftPad = Math.round(20 * s);
            const shaftH = h - shaftTop - shaftPad;
            const cabinH = Math.round(158 * s);
            const travelPadTop = Math.round(20 * s);
            const travelPadBot = Math.round(30 * s);
            const travel = Math.max(24, shaftH - cabinH - travelPadTop - travelPadBot);

            // Wider shaft — main focus of the left panel
            const padL = Math.max(6, Math.min(100, w * 0.14));
            const padR = Math.max(6, Math.min(48, w * 0.08));
            const innerW = Math.max(120, w - padL - padR);
            const sw = Math.max(78, Math.min(innerW * 0.78, innerW - 12));
            const sx = padL + (innerW - sw) / 2;
            ctx.fillStyle = C.shaft;
            ctx.fillRect(sx, shaftTop, sw, shaftH);
            ctx.strokeStyle = C.border;
            ctx.lineWidth = Math.max(2, 3 * s);
            ctx.strokeRect(sx, shaftTop, sw, shaftH);

            // Floors marks
            ctx.strokeStyle = 'rgba(100,116,139,0.25)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 6; i++) {
                const y = shaftTop + travelPadTop + i * (travel / 5);
                ctx.beginPath();
                ctx.moveTo(sx, y);
                ctx.lineTo(sx + sw, y);
                ctx.stroke();
            }

            const cabinTop = shaftTop + travelPadTop + (1 - cabinY) * travel;
            const cabinInset = 10 * s;
            const cabinW = Math.max(52, sw - 2 * cabinInset);
            const cx = sx + (sw - cabinW) / 2;
            const cabinPad = 8 * s;

            // Cable
            ctx.strokeStyle = C.muted;
            ctx.lineWidth = Math.max(1.5, 2 * s);
            ctx.beginPath();
            ctx.moveTo(sx + sw / 2, shaftTop);
            ctx.lineTo(sx + sw / 2, cabinTop);
            ctx.stroke();
            ctx.fillStyle = C.muted;
            ctx.font = uiFont(14, s);
            ctx.textAlign = 'left';
            ctx.fillText(d.cable, sx + sw / 2 + 8 * s, shaftTop + 18 * s);

            // Cabin body
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = C.text;
            ctx.lineWidth = Math.max(1.5, 2 * s);
            ctx.beginPath();
            ctx.roundRect(cx, cabinTop, cabinW, cabinH, 8 * s);
            ctx.fill();
            ctx.stroke();

            // Floor of cabin
            const floorH = 12 * s;
            ctx.fillStyle = C.panel;
            ctx.fillRect(cx + 4 * s, cabinTop + cabinH - floorH - 4 * s, cabinW - 8 * s, floorH);
            ctx.fillStyle = C.muted;
            ctx.font = uiFont(14, s);
            ctx.fillText(d.floor, cx + cabinPad, cabinTop + cabinH - 2 * s);

            // Person — larger figure; N and mg attach on opposite sides of the torso
            const px = cx + cabinW / 2;
            const feetY = cabinTop + cabinH - 22 * s;
            const headR = 14 * s;
            const headCy = feetY - 78 * s;
            const torsoW = 28 * s;
            const torsoH = 46 * s;
            const torsoTop = headCy + headR - 3 * s;
            const legW = 11 * s;
            const legTop = torsoTop + torsoH - 5 * s;

            ctx.fillStyle = C.text;
            ctx.beginPath();
            ctx.arc(px, headCy, headR, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(px - torsoW / 2, torsoTop, torsoW, torsoH);
            ctx.fillRect(px - torsoW / 2 + 3 * s, legTop, legW, feetY - legTop);
            ctx.fillRect(px + torsoW / 2 - legW - 3 * s, legTop, legW, feetY - legTop);
            ctx.fillStyle = C.accent;
            ctx.font = uiFont(14, s);
            ctx.textAlign = 'center';
            ctx.fillText(d.man, px, headCy - headR - 12 * s);

            const N = normal();
            const W = weight();
            const baseLen = 92 * s;
            const nLen = forcePx(N, baseLen);
            const wLen = forcePx(W, baseLen);
            const nSt = forceStyle(N, s);
            const wSt = forceStyle(W, s);

            const comY = feetY - 52 * s;
            const comNX = px - 16 * s;
            const comWX = px + 16 * s;

            if (nLen > 0) {
                drawArrow(ctx, comNX, comY, comNX, comY - nLen, C.n, nSt.width, nSt.head);
                ctx.fillStyle = C.n;
                ctx.textAlign = 'right';
                ctx.font = uiFont(16, s);
                ctx.fillText('N', comNX - 12 * s, comY - nLen / 2);
            } else {
                ctx.fillStyle = C.n;
                ctx.textAlign = 'right';
                ctx.font = uiFont(15, s);
                ctx.fillText('N', comNX - 12 * s, comY - 10 * s);
            }

            drawArrow(ctx, comWX, comY, comWX, comY + wLen, C.w, wSt.width, wSt.head);
            ctx.fillStyle = C.w;
            ctx.textAlign = 'left';
            ctx.font = uiFont(16, s);
            ctx.fillText('mg', comWX + 12 * s, comY + Math.max(22 * s, wLen / 2));
            ctx.textAlign = 'left';

            // |v| on the LEFT of the shaft (only motion indicator on this graph)
            const kvx = Math.max(padL + 14 * s, sx - 18 * s);
            const kvy = cabinTop + cabinH / 2;
            const speed = Math.abs(velocity);
            const vLen = vPx(velocity, 100 * s);
            ctx.fillStyle = C.v;
            ctx.font = uiFont(15, s);
            ctx.textAlign = 'right';
            const vLabel = vLen > 2 ? `|v| = ${speed.toFixed(2)} ms⁻¹` : '|v| = 0.00 ms⁻¹';
            const vLabelW = ctx.measureText(vLabel).width;
            const vLabelX = Math.max(padL, Math.min(kvx - 6 * s, w - padR - vLabelW));
            if (vLen > 2) {
                if (velocity > 0) drawArrow(ctx, kvx, kvy + vLen / 2, kvx, kvy - vLen / 2, C.v, 3 * s);
                else drawArrow(ctx, kvx, kvy - vLen / 2, kvx, kvy + vLen / 2, C.v, 3 * s);
                ctx.fillText(vLabel, vLabelX + vLabelW, kvy + vLen / 2 + 18 * s);
            } else {
                ctx.fillText(vLabel, vLabelX + vLabelW, kvy + 6 * s);
            }
            ctx.textAlign = 'left';
        }

        function drawNormalGauge(ctx, x, yTop, height, N, W, d, s = 1, ts = s) {
            const yBot = yTop + height;
            const barW = 12 * s;
            const maxRatio = 1.8; // gauge top = 1.8 mg
            const mgY = yBot - (1 / maxRatio) * height;
            const nRatio = W > 0 ? Math.min(maxRatio, N / W) : 0;
            const nY = yBot - (nRatio / maxRatio) * height;

            // Track (butt edges so fill lines up exactly with ticks)
            ctx.fillStyle = C.panel;
            ctx.fillRect(x - barW / 2, yTop, barW, height);

            // Green N fill — top edge is exactly nY
            ctx.fillStyle = C.n;
            ctx.fillRect(x - barW / 2, nY, barW, yBot - nY);

            ctx.strokeStyle = C.border;
            ctx.lineWidth = 1;
            ctx.strokeRect(x - barW / 2, yTop, barW, height);

            // Red mg reference line across the bar
            ctx.strokeStyle = C.w;
            ctx.lineWidth = Math.max(1.5, 2 * s);
            ctx.beginPath();
            ctx.moveTo(x - 16 * s, mgY);
            ctx.lineTo(x + 16 * s, mgY);
            ctx.stroke();

            ctx.fillStyle = C.w;
            ctx.font = uiFont(16, ts);
            ctx.textAlign = 'right';
            ctx.fillText('mg', x - 18 * s, mgY + 5 * ts);

            ctx.fillStyle = C.n;
            ctx.beginPath();
            ctx.moveTo(x + barW / 2, nY);          // tip touches bar at N height
            ctx.lineTo(x + barW / 2 + 12 * s, nY - 8 * s);
            ctx.lineTo(x + barW / 2 + 12 * s, nY + 8 * s);
            ctx.closePath();
            ctx.fill();

            // Title "N" above the column — height vs mg line shows magnitude (no number)
            ctx.textAlign = 'center';
            ctx.fillStyle = C.n;
            ctx.font = uiFont(16, ts);
            ctx.fillText('N', x, yTop - 8 * ts);
            ctx.textAlign = 'left';
        }

        function drawFbd() {
            const ctx = fbdCtx;
            const w = fbdCanvas.clientWidth || fbdCanvas.width;
            const h = fbdCanvas.clientHeight || fbdCanvas.height;
            ctx.clearRect(0, 0, w, h);

            // Compact FBD — N and mg from centre of mass only
            const s = Math.max(0.72, Math.min(1.15, Math.min(w, h) / 320));
            const cx = w / 2;
            const cy = h / 2 + 4 * s;
            const N = normal();
            const W = weight();
            const baseLen = 96 * s;
            const nLen = forcePx(N, baseLen);
            const wLen = forcePx(W, baseLen);
            const nSt = forceStyle(N, s);
            const wSt = forceStyle(W, s);
            const forceFont = uiFont(18, s);

            ctx.fillStyle = C.panel;
            ctx.beginPath();
            ctx.arc(cx, cy, 22 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = C.text;
            ctx.lineWidth = 2 * s;
            ctx.stroke();
            ctx.fillStyle = C.text;
            ctx.font = forceFont;
            ctx.textAlign = 'center';
            ctx.fillText('m', cx, cy + 6 * s);
            ctx.textAlign = 'left';

            if (nLen > 0) {
                drawArrow(ctx, cx, cy, cx, cy - nLen, C.n, nSt.width, nSt.head);
                ctx.fillStyle = C.n;
                ctx.font = forceFont;
                ctx.fillText('N', cx + 18 * s, cy - Math.max(20 * s, nLen / 2));
            } else {
                ctx.fillStyle = C.n;
                ctx.font = forceFont;
                ctx.fillText('N', cx + 18 * s, cy - 12 * s);
            }
            drawArrow(ctx, cx, cy, cx, cy + wLen, C.w, wSt.width, wSt.head);
            ctx.fillStyle = C.w;
            ctx.font = forceFont;
            ctx.fillText('mg', cx + 18 * s, cy + Math.max(24 * s, wLen / 2 + 4));
        }

        function drawNtGraph() {
            const ctx = ntCtx;
            const w = ntCanvas.clientWidth || ntCanvas.width;
            const h = ntCanvas.clientHeight || ntCanvas.height;
            ctx.clearRect(0, 0, w, h);

            const pad = { l: 100, r: 36, t: 32, b: 40 };
            const plotW = w - pad.l - pad.r;
            const plotH = h - pad.t - pad.b;
            const W = weight();
            // Fixed non-mg phase normal force for current m and |a| (does not move with time)
            const Nphase = Math.max(0, mass() * (G + referencePhaseA()));
            const maxN = Math.max(W, Nphase) * 1.25;
            const t0 = history.length ? history[0].t : 0;
            const t1 = Math.max(t0 + 4, history.length ? history[history.length - 1].t : 4, simTime);
            const span = Math.max(0.001, t1 - t0);

            const xOf = (t) => pad.l + ((t - t0) / span) * plotW;
            const yOf = (N) => pad.t + plotH - (N / maxN) * plotH;

            // Axes
            ctx.strokeStyle = C.text;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(pad.l, pad.t);
            ctx.lineTo(pad.l, pad.t + plotH);
            ctx.lineTo(pad.l + plotW, pad.t + plotH);
            ctx.stroke();

            const mgY = yOf(W);
            const nPhaseY = yOf(Nphase);

            ctx.strokeStyle = C.w;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 5]);
            ctx.beginPath();
            ctx.moveTo(pad.l, mgY);
            ctx.lineTo(pad.l + plotW, mgY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = C.text;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(pad.l - 7, nPhaseY);
            ctx.lineTo(pad.l + 7, nPhaseY);
            ctx.stroke();

            if (history.length >= 1) {
                ctx.strokeStyle = C.n;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                history.forEach((p, i) => {
                    const x = xOf(p.t);
                    const y = yOf(p.N);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();

                const cur = history[history.length - 1];
                ctx.fillStyle = C.n;
                ctx.beginPath();
                ctx.arc(xOf(cur.t), yOf(cur.N), 5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.font = uiFont(14);
            ctx.textAlign = 'right';
            let yMgLbl = mgY + 5;
            let yNLbl = nPhaseY + 5;
            if (Math.abs(yMgLbl - yNLbl) < 16) {
                if (Nphase < W) yNLbl = yMgLbl + 18;
                else yNLbl = yMgLbl - 18;
            }
            ctx.fillStyle = C.w;
            ctx.fillText('mg', pad.l - 10, yMgLbl);
            ctx.fillStyle = C.text;
            ctx.fillText('N', pad.l - 10, yNLbl);
            ctx.fillStyle = C.muted;
            ctx.fillText('0', pad.l - 10, pad.t + plotH + 5);

            ctx.fillStyle = C.text;
            ctx.textAlign = 'left';
            ctx.fillText('N (N)', 8, 18);
            ctx.fillText(t0.toFixed(1), pad.l, h - 12);
            ctx.textAlign = 'right';
            ctx.fillText(t1.toFixed(1), pad.l + plotW, h - 12);
            ctx.fillText('t (s)', pad.l + plotW + 4, pad.t + plotH - 8);
            ctx.textAlign = 'left';
        }

        function draw() {
            drawScene();
            drawFbd();
        }

        function fitCanvas(canvas, cssW, cssH) {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const w = Math.max(1, Math.floor(cssW));
            const h = Math.max(1, Math.floor(cssH));
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            // Prefer crisp geometry/text on HiDPI
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
        }

        function cardChrome(parent, withLegend) {
            const cs = getComputedStyle(parent);
            const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
            const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
            const labelH = parent.querySelector('.el-canvas-label')?.offsetHeight || 0;
            const legendH = withLegend ? (parent.querySelector('.el-legend')?.offsetHeight || 0) : 0;
            const phaseH = withLegend ? (parent.querySelector('#phaseTag')?.offsetHeight || 0) : 0;
            return {
                padX,
                padY,
                below: labelH + legendH + phaseH + padY + 8,
            };
        }

        function gridStacked() {
            return GRID_STACK_MQ.matches;
        }

        function resize() {
            const sParent = sceneCanvas.parentElement;
            const fParent = fbdCanvas.parentElement;
            const sChrome = cardChrome(sParent, true);
            const fChrome = cardChrome(fParent, false);

            const sceneW = Math.max(280, Math.floor(sParent.clientWidth - sChrome.padX));
            const fbdW = Math.max(280, Math.floor(fParent.clientWidth - fChrome.padX));

            let sceneH = Math.round(sceneW * SCENE_ASPECT);
            let fbdH = Math.round(fbdW * FBD_ASPECT);
            const stacked = gridStacked();

            if (isFullscreen()) {
                const grid = document.querySelector('.el-main-grid');
                const gridH = grid?.clientHeight || 0;
                if (gridH > 120) {
                    if (stacked) {
                        const each = Math.floor((gridH - 16) / 2);
                        sceneH = Math.max(240, each - sChrome.below);
                        fbdH = Math.max(240, each - fChrome.below);
                    } else {
                        sceneH = Math.max(280, gridH - sChrome.below);
                        fbdH = Math.max(280, gridH - fChrome.below);
                    }
                }
            } else {
                sceneH = Math.min(620, Math.max(400, sceneH));
                fbdH = Math.min(FBD_MAX_H, Math.max(240, fbdH));
            }

            fitCanvas(sceneCanvas, sceneW, sceneH);
            fitCanvas(fbdCanvas, fbdW, fbdH);
            draw();

            if (isFullscreen()) {
                requestAnimationFrame(() => {
                    if (!isFullscreen()) return;
                    const grid = document.querySelector('.el-main-grid');
                    const gridH = grid?.clientHeight || 0;
                    if (gridH <= 120) return;
                    let nextSceneH;
                    let nextFbdH;
                    if (stacked) {
                        const each = Math.floor((gridH - 16) / 2);
                        nextSceneH = Math.max(240, each - sChrome.below);
                        nextFbdH = Math.max(240, each - fChrome.below);
                    } else {
                        nextSceneH = Math.max(280, gridH - sChrome.below);
                        nextFbdH = Math.max(280, gridH - fChrome.below);
                    }
                    if (Math.abs(nextSceneH - sceneH) > 6 || Math.abs(nextFbdH - fbdH) > 6) {
                        fitCanvas(sceneCanvas, sceneW, nextSceneH);
                        fitCanvas(fbdCanvas, fbdW, nextFbdH);
                        draw();
                    }
                });
            }
        }

        function stopCabin() {
            stopped = true;
            velocity = 0;
            instantA = 0;
            phase = 'rest';
            playing = false;
            posM = targetY() * SHAFT_H;
            syncCabinFromPos();
            pushHistory();
            updateUI();
        }

        function tick(ts) {
            if (!lastTs) lastTs = ts;
            const dt = Math.min(0.04, (ts - lastTs) / 1000);
            lastTs = ts;

            if (playing && !stopped && !tripFinished) {
                const dtSim = dt * animSpeed();
                simTime += dtSim;

                if (phase === 'accel') {
                    instantA = accelPhaseA();
                    posM += velocity * dtSim + 0.5 * instantA * dtSim * dtSim;
                    velocity += instantA * dtSim;
                    accelElapsed += dtSim;
                    syncCabinFromPos();
                    if (accelElapsed >= accelDuration - 1e-4
                        || Math.abs(velocity) >= cruiseSpeed() - 1e-3) {
                        // Reach constant speed, then keep coasting
                        phase = 'coast';
                        syncCruiseVelocity();
                        instantA = 0;
                    }
                } else if (phase === 'coast') {
                    instantA = 0;
                    syncCruiseVelocity();
                    posM += velocity * dtSim;
                    syncCabinFromPos();

                    if (isAccelScenario()) {
                        // Keep moving at constant speed; when trip ends, show initial N ≠ mg
                        if (reachedDestination()) {
                            finishShowingInitialAccel();
                            draw();
                            requestAnimationFrame(tick);
                            return;
                        }
                    } else if (remainingM() <= brakeDistanceM() + 1e-4) {
                        phase = 'decel';
                        syncCruiseVelocity();
                        instantA = brakePhaseA();
                    }
                }
                if (phase === 'decel' && !stopped && !tripFinished) {
                    instantA = brakePhaseA();
                    posM += velocity * dtSim + 0.5 * instantA * dtSim * dtSim;
                    velocity += instantA * dtSim;
                    syncCabinFromPos();

                    const arrived = isUpScenario()
                        ? (velocity <= 0 || posM >= targetY() * SHAFT_H)
                        : (velocity >= 0 || posM <= targetY() * SHAFT_H);
                    // Freeze while still braking / moving (N ≠ mg), not fully stopped
                    if (arrived || Math.abs(velocity) <= 0.25 * cruiseSpeed()) {
                        finishAtBrakePhase();
                        draw();
                        requestAnimationFrame(tick);
                        return;
                    }
                }

                pushHistory();
                updateUI();
            }
            draw();
            requestAnimationFrame(tick);
        }

        massSlider.addEventListener('input', () => {
            pushHistory();
            updateUI();
            draw();
        });
        animSpeedSlider.addEventListener('input', () => {
            updateUI();
        });
        playBtn.addEventListener('click', () => {
            // After an accel trip ends at the side, Play restarts the animation
            if (tripFinished || stopped) {
                replayScenario();
                return;
            }
            playing = !playing;
            lastTs = 0;
            updateUI();
        });
        document.getElementById('resetBtn').addEventListener('click', () => {
            replayScenario();
        });
        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateLanguageUI();
        });
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            toggleFullscreen();
        });
        function onFullscreenChange() {
            document.body.classList.toggle('is-fullscreen', isFullscreen());
            updateFullscreenBtn();
            // Wait a frame so layout width is restored before measuring canvases
            requestAnimationFrame(() => {
                requestAnimationFrame(resize);
            });
        }
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        window.addEventListener('message', (ev) => {
            if (ev.data?.type !== 's3phy:lang') return;
            currentLang = hubLangToLocal(ev.data.lang);
            updateLanguageUI();
        });
        window.addEventListener('resize', resize);
        if (typeof GRID_STACK_MQ.addEventListener === 'function') {
            GRID_STACK_MQ.addEventListener('change', resize);
        } else if (typeof GRID_STACK_MQ.addListener === 'function') {
            GRID_STACK_MQ.addListener(resize);
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                const rr = Math.min(r, w / 2, h / 2);
                this.moveTo(x + rr, y);
                this.arcTo(x + w, y, x + w, y + h, rr);
                this.arcTo(x + w, y + h, x, y + h, rr);
                this.arcTo(x, y + h, x, y, rr);
                this.arcTo(x, y, x + w, y, rr);
                this.closePath();
            };
        }

        updateLanguageUI();
        applyScenarioStart();
        resize();
        requestAnimationFrame(tick);
    </script>
</body>
</html>
