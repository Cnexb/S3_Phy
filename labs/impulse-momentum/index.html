<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../shared/s3phy-embed.css">
  <link rel="stylesheet" href="../shared/s3phy-n1-sim.css">
  <script src="../shared/s3phy-embed-init.js"></script>
  <script src="../shared/s3phy-n1-draw.js"></script>
  <title>Impulse | Momentum Lab</title>
  <style>
    
  </style>
</head>
<body class="n1-lab n1-sim">
  <div class="deco-blob deco-blob--accent" aria-hidden="true"></div>
  <div class="deco-blob deco-blob--emerald" aria-hidden="true"></div>
  <div class="wrap" id="labShell">
    <header class="n1-header">
      <div class="n1-header__inner">
        <div class="n1-brand">
          <div class="n1-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none">
              <circle cx="10" cy="16" r="5" fill="#34d399"/>
              <path d="M16 16h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M21.5 12.5L25 16l-3.5 3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <div class="n1-title-row">
              <h1><span class="en">Impulse</span><span class="zh">衝量</span></h1>
              <span class="n1-chip">HKDSE Physics</span>
            </div>
            <p class="n1-sub"><span class="en">HKDSE Physics · Momentum · J = F Δt = Δp</span><span class="zh">HKDSE 物理 · 動量 · J = F Δt = Δp</span></p>
          </div>
        </div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="btn-en" class="active">EN</button>
          <button type="button" id="btn-zh">繁中</button>
        </div>
      </div>
    </header>
    <main class="n1-main">
    <section class="card glass-panel">
      <div class="card-hd">
        <div>
          <h2 id="hd-title"></h2>
          <p id="hd-sub"></p>
        </div>
        <div class="hd-actions">
          <div class="hd-run">
            <button class="btn teal" type="button" id="btn-play"><span class="en">Play bounce</span><span class="zh">播放反彈</span></button>
            <button class="btn sec" type="button" id="btn-reset"><span class="en">Reset</span><span class="zh">重設</span></button>
          </div>
        </div>
      </div>
      <div class="workspace">
        <div class="stage">

          <div class="hint-chip" id="hint"></div>
          <aside class="hud hud-left">
            <div>
              <h3><span class="en">Live numbers</span><span class="zh">即時數據</span></h3>
              <div class="readout" id="stats"></div>
            </div>
          </aside>
          <aside class="hud hud-right" id="hud-controls">
            <div class="hud-hd">
              <h3><span class="en">Control bar</span><span class="zh">控制列</span></h3>
              <button class="hud-toggle" type="button" id="btn-hide-controls"><span class="en">Hide</span><span class="zh">隱藏</span></button>
            </div>
            <div class="hud-body">
              <div class="slider-wrap">
                <div class="slider-head"><span class="en">Ball mass</span><span class="zh">球的質量</span><em class="a" id="val-im">0.80 kg</em></div>
                <input class="a-range" type="range" id="sl-im" min="0.2" max="4" step="0.1" value="0.8" />
              </div>
              <div class="slider-wrap">
                <div class="slider-head"><span class="en">Approach speed</span><span class="zh">接近速率</span><em class="a" id="val-iu">3.5 m/s</em></div>
                <input class="a-range" type="range" id="sl-iu" min="0.5" max="8" step="0.1" value="3.5" />
              </div>
            </div>
          </aside>
          <button class="fs-btn" type="button" data-fs="labShell"><span class="en">Full screen</span><span class="zh">全螢幕</span></button>
          <canvas id="cv" width="900" height="460"></canvas>

        </div>
      </div>
    </section>
    </main>
  </div>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let lang = "en";
  const t = (en, zh) => (lang === "zh" ? zh : en);
  function setLang(next) {
    lang = next;
    document.documentElement.lang = next === "zh" ? "zh-HK" : "en";
    $("btn-en").classList.toggle("active", next === "en");
    $("btn-zh").classList.toggle("active", next === "zh");
    updateUI();
  }
  $("btn-en").onclick = () => setLang("en");
  $("btn-zh").onclick = () => setLang("zh");
  function applyLangFromHub(raw) {
    const next = (raw === "zh-Hant" || raw === "zhHant" || raw === "zh" || raw === "zh-HK") ? "zh" : "en";
    setLang(next);
  }
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q) applyLangFromHub(q);
  } catch (e) { /* ignore */ }
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "s3phy:lang") applyLangFromHub(ev.data.lang);
  });

  function syncHideControls() {
    const hidden = $("hud-controls").classList.contains("collapsed");
    $("btn-hide-controls").innerHTML = hidden
      ? '<span class="en">Show</span><span class="zh">顯示</span>'
      : '<span class="en">Hide</span><span class="zh">隱藏</span>';
  }
  $("btn-hide-controls").onclick = () => {
    $("hud-controls").classList.toggle("collapsed");
    syncHideControls();
  };
  document.querySelectorAll("[data-fs]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const el = $(btn.dataset.fs);
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    });
  });
  const canvasCache = new WeakMap();
  function fitCanvas(canvas) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(320, rect.width || 320);
    const h = Math.max(260, rect.height || 460);
    const prev = canvasCache.get(canvas);
    const ctx = canvas.getContext("2d");
    if (!prev || prev.w !== w || prev.h !== h || prev.dpr !== dpr) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvasCache.set(canvas, { w, h, dpr });
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }
  const Art = window.N1Art;
  function roundRect(ctx, x, y, w, h, r) { Art.roundRect(ctx, x, y, w, h, r); }
  function arrow(ctx, x1, y1, x2, y2, color, width) {
    Art.drawArrow(ctx, x1, y1, x2, y2, color, width || 3.2);
  }
  function fmt(n, d) {
    if (!isFinite(n)) return "—";
    const s = Number(n).toFixed(d == null ? 2 : d);
    return (n > 0 && d !== 0 ? "+" : "") + s;
  }
  function fmtAbs(n, d) {
    if (!isFinite(n)) return "—";
    return Number(n).toFixed(d == null ? 2 : d);
  }
  const pOf = (m, v) => m * v;
  const keOf = (m, v) => 0.5 * m * v * v;
  function spawnSparks(x, y) {
    for (let i = 0; i < 14; i++) {
      S.sparks.push({
        x, y,
        vx: (Math.random() - 0.5) * 180,
        vy: (Math.random() - 0.8) * 140,
        life: 1,
        c: Math.random() > 0.5 ? "#34d399" : "#f97316"
      });
    }
  }
  function stat(label, value, cls) {
    const d = document.createElement("div");
    d.className = "stat" + (cls ? " " + cls : "");
    d.innerHTML = "<span></span><b></b>";
    d.querySelector("span").textContent = label;
    d.querySelector("b").textContent = value;
    $("stats").appendChild(d);
  }
  const TRACK = 12;
  const S = {
    running: false, speed: 1,
    im: 0.8, iu: 3.5, iv: 1.5, dt: 0.009,
    iball: 2.2, iphase: "idle", it: 0,
    sparks: [], flash: 0
  };
  const cv = $("cv");
  function resetImpulse() {
    S.iphase = "idle"; S.it = 0; S.iball = 2.4; S.flash = 0; S.sparks = [];
  }
  function restoreImpulseControls() {
    S.im = 0.8; S.iu = 3.5; S.iv = 1.5;
    $("sl-im").value = "0.8"; $("sl-iu").value = "3.5";
    S.running = false; resetImpulse();
  }
  function bindSlider(id, key) {
    $(id).addEventListener("input", () => {
      if (S.running) return;
      S[key] = Number($(id).value);
      resetImpulse(); updateUI();
    });
  }
  bindSlider("sl-im", "im"); bindSlider("sl-iu", "iu");
  $("btn-play").onclick = () => { resetImpulse(); S.iphase = "approach"; S.running = true; updateUI(); };
  $("btn-reset").onclick = () => { restoreImpulseControls(); updateUI(); };
  function liveImpulse() {
    const u = S.iu, v = -S.iv, m = S.im;
    const dp = m * (v - u);
    const F = S.dt > 0 ? dp / S.dt : 0;
    return { u, v, m, pu: m * u, pv: m * v, dp, F, k0: keOf(m, u), k1: keOf(m, v) };
  }
  function updateUI() {
    $("hd-title").textContent = t("Impulse studio", "衝量工作室");
    $("hd-sub").textContent = t("Impulse J = F Δt equals the change in momentum. Reversing direction makes Δp large.", "衝量 J = F Δt 等於動量變化。方向相反會令 Δp 變大。");
    $("hint").style.display = "none";
    $("val-im").textContent = fmtAbs(S.im, 2) + " kg";
    $("val-iu").textContent = fmtAbs(S.iu, 1) + " m/s";
    $("stats").innerHTML = "";
    const I = liveImpulse();
    stat(t("p before", "碰撞前 p"), fmtAbs(I.pu, 2) + " kg m/s", "a");
    stat(t("p after", "碰撞後 p"), fmt(I.pv, 2) + " kg m/s", "b");
    ["sl-im","sl-iu"].forEach((id) => { $(id).disabled = S.running; });
  }
  function stepImpulse(dt) {
    if (!S.running) return;
    const wall = 10.4;
    const r = 0.28 + Math.min(0.22, S.im * 0.04);
    const rate = S.speed;
    if (S.iphase === "approach") {
      S.iball += S.iu * dt * rate * 1.15;
      if (S.iball + r >= wall) {
        S.iball = wall - r; S.iphase = "contact"; S.it = 0; S.flash = 1; spawnSparks(wall, 0);
      }
    } else if (S.iphase === "contact") {
      S.it += dt;
      const vis = 0.62 / Math.max(0.25, S.speed);
      const frac = Math.min(1, S.it / vis);
      S.iball = wall - r + Math.sin(frac * Math.PI) * 0.07;
      if (frac >= 1) S.iphase = "rebound";
    } else if (S.iphase === "rebound") {
      S.iball -= S.iv * dt * rate * 1.15;
      if (S.iball < 1.2) S.running = false;
    }
  }
  function drawScene(dt) {
    const { ctx, w, h } = fitCanvas(cv);
    const ground = h * 0.72;
    Art.drawFloor(ctx, w, h, ground + 8, t("Smooth floor", "光滑地面"));
    const pad = 36; const scale = (w - pad * 2) / TRACK; const X = (m) => pad + m * scale;
    S.flash *= 0.9;
    if (S.flash > 0.04) {
      ctx.fillStyle = "rgba(249,115,22," + (S.flash * 0.18) + ")";
      ctx.fillRect(0, 0, w, h);
    }
    S.sparks.forEach((p) => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; p.life -= dt * 1.8;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(X(p.x), ground - 40 + p.y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });
    S.sparks = S.sparks.filter((p) => p.life > 0);
    ctx.fillStyle = "#64748b"; ctx.fillRect(X(10.55), ground - 150, 22, 158);
    ctx.fillStyle = "#cbd5e1"; ctx.fillRect(X(10.55), ground - 150, 8, 158);
    const r = (0.28 + Math.min(0.22, S.im * 0.04)) * scale;
    const bx = X(S.iball); const by = ground - r;
    Art.drawGlowingBall(ctx, bx, by, r, Art.C.greenTop, Art.C.greenBot, Art.C.greenStroke);
    const vel = S.iphase === "rebound" ? -S.iv : S.iphase === "contact" ? 0 : S.iu;
    if (Math.abs(vel) > 0.02) {
      const dir = vel > 0 ? 1 : -1;
      arrow(ctx, bx, by - r - 18, bx + dir * (24 + Math.abs(vel) * 8), by - r - 18, Art.C.greenBot, 3.2);
    }
    if (S.iphase === "contact") {
      const I = liveImpulse();
      arrow(ctx, X(10.5), by, X(10.5) - 70, by, Art.C.violet, 4);
      ctx.fillStyle = Art.C.violet;
      ctx.font = Art.font(800, 13);
      ctx.textAlign = "right";
      ctx.fillText("F_avg " + fmt(I.F, 0) + " N", X(10.4) - 76, by - 8);
    }
  }
  let last = performance.now(); let uiAcc = 0;
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    stepImpulse(dt); drawScene(dt);
    uiAcc += dt;
    if (!S.running || uiAcc > 0.12) { if (S.running) updateUI(); uiAcc = 0; }
    requestAnimationFrame(loop);
  }
  resetImpulse(); updateUI(); requestAnimationFrame(loop);

})();
</script>
</body>
</html>
